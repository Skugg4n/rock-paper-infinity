<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Infinity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chapter IV draws a real 3D model. This importmap is THE place the three.js
         CDN is named; src/phase4/scene.js imports the bare names below. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
    </script>
    <style id="dynamic-styles"></style> <!-- For dynamic animation timings -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-stage2.css">
    <link rel="stylesheet" href="style-deep.css">
</head>
<body class="text-slate-800">

    <!-- ==================== PHASE 1: INDUSTRY ==================== -->
    <div id="phase-industry" class="phase-container hidden">

        <!-- Star display on the left -->
        <div class="absolute top-4 left-3 sm:top-8 sm:left-4 md:left-8 max-w-[60vw] sm:max-w-none">
            <div id="win-tracker" aria-label="Stars" aria-live="polite" class="flex flex-col items-start gap-2 sm:gap-3"></div>
        </div>

        <!-- Right-side panel: counters + resource bars -->
        <div class="absolute top-4 right-3 sm:top-8 sm:right-4 md:right-8 flex flex-col items-end gap-2 sm:gap-3">
            <!-- Game counters (shown after first game) -->
            <div id="game-counters" class="hidden flex flex-col items-end gap-0.5 text-slate-400">
                <div class="flex items-center gap-1">
                    <span id="games-value" aria-label="Games played" aria-live="polite" class="font-mono text-xs sm:text-sm tabular-nums">0</span>
                    <span id="games-icon"></span>
                </div>
                <div class="flex items-center gap-1">
                    <span id="wins-value" aria-label="Wins" aria-live="polite" class="font-mono text-xs sm:text-sm tabular-nums">0</span>
                    <span id="wins-icon"></span>
                </div>
            </div>
            <!-- Resource bars (shown after 10 stars) -->
            <div id="resource-bars" class="hidden flex flex-col items-end gap-3 sm:gap-4">
                <div id="energy-bars" class="flex items-end gap-2">
                <div id="energy-container" aria-label="Energy" role="progressbar" class="w-3 h-24 sm:w-4 sm:h-32 bg-slate-300 rounded-full overflow-hidden p-0.5 sm:p-1 flex flex-col justify-end">
                    <div id="energy-fill" class="w-full bg-slate-500 rounded-full transition-all duration-300"></div>
                </div>
                <div id="reserve-energy-container" aria-label="Reserve energy" role="progressbar" class="w-4 h-28 sm:w-6 sm:h-40 bg-slate-300 rounded-full overflow-hidden p-0.5 sm:p-1 flex flex-col justify-end">
                    <div id="reserve-energy-fill" class="w-full bg-slate-400 rounded-full transition-all duration-300"></div>
                </div>
            </div>
            <div id="quantum-foam-container" class="hidden w-16 flex flex-col items-center gap-2">
                <button id="collapse-foam-btn" class="btn w-12 h-12 rounded-full flex justify-center items-center overflow-hidden" disabled>
                    <div id="collapse-foam-fill" style="height: 0%;"></div>
                    <i data-lucide="zap" class="relative w-6 h-6 text-slate-600"></i>
                </button>
            </div>
            <div id="sps-container" class="hidden flex items-center gap-1 sm:gap-2 text-slate-500">
                <span id="sps-value" class="font-bold text-sm sm:text-lg font-mono">0.0</span>
                <div class="flex items-center">
                    <i data-lucide="star" class="w-3 h-3 sm:w-4 sm:h-4"></i>
                    <span class="font-bold text-xs sm:text-sm mx-0.5">/</span>
                    <i data-lucide="timer" class="w-3 h-3 sm:w-4 sm:h-4"></i>
                </div>
            </div>
            <div id="eps-container" class="hidden flex items-center gap-1 sm:gap-2 text-slate-500">
                <span id="eps-value" class="font-bold text-sm sm:text-lg font-mono">0.0</span>
                <div class="flex items-center">
                    <i data-lucide="zap-off" class="w-3 h-3 sm:w-4 sm:h-4"></i>
                    <span class="font-bold text-xs sm:text-sm mx-0.5">/</span>
                    <i data-lucide="timer" class="w-3 h-3 sm:w-4 sm:h-4"></i>
                </div>
            </div>
             <div id="egps-container" class="hidden flex items-center gap-1 sm:gap-2 text-slate-500">
                <span id="egps-value" class="font-bold text-sm sm:text-lg font-mono">0.0</span>
                <div class="flex items-center">
                    <i data-lucide="atom" class="w-3 h-3 sm:w-4 sm:h-4"></i>
                    <span class="font-bold text-xs sm:text-sm mx-0.5">/</span>
                    <i data-lucide="timer" class="w-3 h-3 sm:w-4 sm:h-4"></i>
                </div>
            </div>
        </div>
        </div>

        <!-- Main container for the game -->
        <div class="w-full max-w-2xl mx-auto p-4 flex flex-col h-[100svh]">
            <header class="h-12 sm:h-16 flex-shrink-0"></header> <!-- Spacer -->

            <main id="game-board-container" class="pointer-events-none flex-grow grid grid-cols-1 items-center justify-center gap-4">
                <!-- Game boards are injected here by JS -->
            </main>

            <footer id="player-zone" class="h-40 flex-shrink-0 flex flex-col justify-end items-center gap-4 pb-4">
                <div id="player-controls-container" class="flex justify-center items-center gap-1.5 sm:gap-2 w-full max-w-sm">
                    <button data-choice="rock" aria-label="Rock" class="btn choice-btn bg-slate-50 w-12 h-12 sm:w-16 sm:h-16 rounded-full shadow-md flex justify-center items-center"><i data-lucide="gem"></i></button>
                    <button data-choice="paper" aria-label="Paper" class="btn choice-btn bg-slate-50 w-12 h-12 sm:w-16 sm:h-16 rounded-full shadow-md flex justify-center items-center"><i data-lucide="file-text"></i></button>
                    <button data-choice="scissors" aria-label="Scissors" class="btn choice-btn bg-slate-50 w-12 h-12 sm:w-16 sm:h-16 rounded-full shadow-md flex justify-center items-center"><i data-lucide="scissors"></i></button>
                    <button id="manualRecharge" aria-label="Manual recharge" data-upgrade="manualRecharge" class="invisible btn upgrade-btn bg-slate-50 w-12 h-12 sm:w-16 sm:h-16 rounded-full shadow-md flex justify-center items-center"><i data-lucide="battery-charging"></i></button>
                    <button id="autoPlay" aria-label="Auto-play" data-upgrade="autoPlay" class="invisible btn upgrade-btn bg-slate-50 w-12 h-12 sm:w-16 sm:h-16 rounded-full shadow-md flex justify-center items-center"><i data-lucide="repeat-2"></i></button>
                </div>
            </footer>
        </div>

        <!-- Upgrade buttons -->
        <div class="absolute bottom-4 right-3 sm:bottom-8 sm:right-8 flex items-end gap-2 sm:gap-3">
            <div id="downgrade-tray" class="flex flex-col gap-3"></div>
            <div id="upgrade-tray" class="flex flex-col gap-3">
                <button id="speed" aria-label="Upgrade game speed" data-upgrade="speed" class="invisible btn upgrade-btn bg-white p-3 rounded-full shadow-lg">
                    <i id="speed-icon" data-lucide="chevrons-right" class="relative w-6 h-6 text-slate-600"></i>
                </button>
                <button id="energyGenerator" aria-label="Upgrade energy generator" data-upgrade="energyGenerator" class="invisible btn upgrade-btn bg-white p-3 rounded-full shadow-lg">
                    <i data-lucide="atom" class="relative w-6 h-6 text-slate-600"></i>
                </button>
                <button id="buyBattery" aria-label="Buy battery reserve" data-upgrade="buyBattery" class="invisible btn upgrade-btn bg-white p-3 rounded-full shadow-lg"><i data-lucide="battery-plus" class="relative w-6 h-6 text-slate-600"></i></button>
                <button id="luck" aria-label="Luck upgrade" data-upgrade="luck" class="invisible btn upgrade-btn bg-white p-3 rounded-full shadow-lg"><i data-lucide="clover" class="relative w-6 h-6 text-slate-600"></i></button>
                <button id="addGameBoard" aria-label="Add game board" data-upgrade="addGameBoard" class="invisible btn upgrade-btn bg-white p-3 rounded-full shadow-lg">
                    <i data-lucide="copy" class="relative w-6 h-6 text-slate-600"></i>
                </button>
                <button id="mergeGameBoard" aria-label="Build factory" data-upgrade="mergeGameBoard" class="invisible btn upgrade-btn bg-white p-3 rounded-full shadow-lg"><i data-lucide="factory" class="relative w-6 h-6 text-slate-600"></i></button>
                <button id="bank" aria-label="Build bank — advance to next phase" data-upgrade="bank" class="invisible btn upgrade-btn bg-white p-3 rounded-full shadow-lg"><i data-lucide="landmark" class="relative w-6 h-6 text-slate-600"></i></button>
            </div>
        </div>

        <!-- Phase 1 Debug menu -->
        <div id="debug-trigger" class="absolute top-0 left-0 w-16 h-16 cursor-pointer"></div>
        <div id="debug-menu" class="hidden absolute top-16 left-4 flex flex-col gap-2 bg-slate-700 p-2 rounded-lg shadow-xl z-20">
            <div class="text-white text-xs font-bold border-b border-slate-600 pb-1 mb-1">Stars</div>
            <button data-add-stars="1" class="text-white text-xs font-bold bg-slate-600 hover:bg-slate-500 rounded px-2 py-1">+1 ★</button>
            <button data-add-stars="100" class="text-white text-xs font-bold bg-slate-600 hover:bg-slate-500 rounded px-2 py-1">+100 ★</button>
            <button data-add-stars="1000" class="text-white text-xs font-bold bg-slate-600 hover:bg-slate-500 rounded px-2 py-1">+1k ★</button>
            <button data-add-stars="10000" class="text-white text-xs font-bold bg-slate-600 hover:bg-slate-500 rounded px-2 py-1">+10k ★</button>
            <button data-add-stars="100000" class="text-white text-xs font-bold bg-slate-600 hover:bg-slate-500 rounded px-2 py-1">+100k ★</button>
            <div class="text-white text-xs font-bold border-b border-slate-600 pb-1 my-1">Speed</div>
            <div class="flex items-center justify-between gap-2">
                 <button data-change-speed="-1" class="text-white text-lg font-bold bg-slate-600 hover:bg-slate-500 rounded w-6 h-6">-</button>
                 <span id="debug-speed" class="text-white text-xs font-mono">⚡︎ 1x</span>
                 <button data-change-speed="1" class="text-white text-lg font-bold bg-slate-600 hover:bg-slate-500 rounded w-6 h-6">+</button>
            </div>
            <div class="text-white text-xs font-bold border-b border-slate-600 pb-1 my-1">Games</div>
            <div id="debug-games-played" class="text-white text-xs font-mono text-center">0</div>
            <button class="text-white text-xs font-bold bg-slate-600 hover:bg-slate-500 rounded px-2 py-1" onclick="setPhase(phases.CITY)">Go to Stage 2</button>
        </div>

    </div>

    <!-- ==================== PHASE 2: CITY ==================== -->
    <div id="phase-city" class="phase-container hidden">

        <button id="debug-toggle-btn" class="absolute top-0 left-0 w-16 h-16 z-40 opacity-0"></button>

        <!-- UI -->
        <div class="absolute top-4 left-3 sm:top-8 sm:left-4 md:left-8 flex flex-col gap-1.5 sm:gap-2 z-20">
            <div class="flex items-center gap-2 sm:gap-4">
                <i data-lucide="star" class="w-5 h-5 sm:w-7 sm:h-7 text-slate-400" aria-hidden="true"></i>
                <div>
                    <span id="star-count" aria-label="Stars" aria-live="polite" class="font-mono font-bold text-xl sm:text-3xl text-slate-600"></span>
                    <span id="net-star-change" class="block font-mono text-sm sm:text-lg text-slate-500">+0/s</span>
                    <span id="stars-per-person" class="p2-disclose block font-mono text-[10px] sm:text-xs text-slate-500">0 per person</span>
                </div>
            </div>
            <div id="science-row" class="p2-disclose flex items-center gap-2 sm:gap-4">
                <i data-lucide="atom" class="w-5 h-5 sm:w-7 sm:h-7 text-slate-400" aria-hidden="true"></i>
                <div>
                    <span id="science-count" aria-label="Science" aria-live="polite" class="font-mono font-bold text-xl sm:text-3xl text-slate-600"></span>
                    <span id="net-science-change" class="block font-mono text-sm sm:text-lg text-slate-500">+0/s</span>
                </div>
            </div>
            <div id="allocation-slider-container" class="p2-disclose pt-2">
                <div class="flex justify-between text-xs text-slate-500">
                    <span class="flex items-center gap-1"><i data-lucide="star" class="w-3 h-3"></i> Industry</span>
                    <span class="flex items-center gap-1">Research <i data-lucide="atom" class="w-3 h-3"></i></span>
                </div>
                <div class="flex items-center gap-1">
                    <button id="allocation-dec-btn" class="allocation-step-btn sm:hidden" aria-label="Decrease research allocation by 5%">−</button>
                    <input type="range" min="0" max="100" value="50" class="w-full" id="allocation-slider" aria-label="Population allocation: Industry vs Research">
                    <button id="allocation-inc-btn" class="allocation-step-btn sm:hidden" aria-label="Increase research allocation by 5%">+</button>
                </div>
            </div>
            <!-- WAR HUD (chapter III): defence, force, arms, the goods ↔ arms slider, tiers -->
            <div id="war-ui" class="hidden flex flex-col gap-1 pt-3">
                <div class="flex items-center gap-2"><i data-lucide="shield" class="w-5 h-5 sm:w-6 sm:h-6 text-slate-400"></i><span id="war-defence" class="font-mono font-bold text-lg sm:text-2xl text-slate-600 tabular-nums">0</span></div>
                <div class="flex items-center gap-2"><i data-lucide="swords" class="w-5 h-5 sm:w-6 sm:h-6 text-slate-400"></i><span id="war-force" class="font-mono font-bold text-lg sm:text-2xl text-slate-600 tabular-nums">0</span></div>
                <div class="flex items-center gap-2"><i data-lucide="hammer" class="w-5 h-5 sm:w-6 sm:h-6 text-slate-400"></i><span id="war-arms" class="font-mono text-base sm:text-xl text-slate-600 tabular-nums">0</span><span id="war-arms-rate" class="font-mono text-[10px] sm:text-xs text-slate-400"></span></div>
                <div class="flex items-center gap-1 pt-1">
                    <i data-lucide="star" class="w-3 h-3 text-slate-400"></i>
                    <input type="range" min="0" max="100" value="30" class="w-24 sm:w-32" id="arms-slider" aria-label="Factory output: goods vs arms">
                    <i data-lucide="hammer" class="w-3 h-3 text-slate-400"></i>
                </div>
                <div class="flex items-center gap-2"><span id="war-tier" class="font-mono text-xs text-slate-500">I</span><span class="text-slate-300 text-xs">·</span><span id="war-enemy-tier" class="font-mono text-xs text-red-800/70">I</span><span class="text-slate-300 text-xs">·</span><i data-lucide="shield" class="w-3 h-3 text-red-800/60"></i><span id="war-enemy-defence" class="font-mono text-xs text-red-800/70">0</span></div>
            </div>
        </div>

        <!-- Phase 2 DEBUG MENU -->
        <div id="p2-debug-menu">
            <h3>Debug Menu</h3>
            <button class="debug-btn" onclick="debug_addResources('stars', 10000000)">+10M Stars</button>
            <button class="debug-btn" onclick="debug_addResources('science', 100000)">+100k Science</button>
            <hr class="border-slate-500 my-2">
            <button class="debug-btn" onclick="debug_war('start')">Start WAR</button>
            <button class="debug-btn" onclick="debug_war('arms')">+1000 arms</button>
            <button class="debug-btn" onclick="debug_war('tier')">Our tier +1</button>
            <button class="debug-btn" onclick="debug_war('etier')">Enemy tier +1</button>
            <button class="debug-btn" onclick="debug_war('wave')">Wave now</button>
            <button class="debug-btn" onclick="debug_war('leave')">Enemy leaves</button>
            <button class="debug-btn" onclick="debug_war('salvage')">+2000 salvage</button>
            <button class="debug-btn" onclick="debug_war('stage')">Launch: next stage</button>
            <hr class="border-slate-500 my-2">
            <button class="debug-btn" onclick="debug_addPopulation(1000)">+1k Population</button>
            <button class="debug-btn" onclick="debug_addPopulation(50000)">+50k Population</button>
            <hr class="border-slate-500 my-2">
            <button class="debug-btn" onclick="setPhase(phases.INDUSTRY)">Back to Stage 1</button>
        </div>

        <div class="absolute top-4 right-3 sm:top-8 sm:right-4 md:right-8 flex flex-col items-end gap-3 sm:gap-6 z-20">
            <div id="population-ui" class="info-ui flex items-center gap-2 sm:gap-3">
                 <div class="flex flex-col items-end leading-tight">
                     <span id="population-count-total" class="font-mono font-bold text-lg sm:text-2xl text-slate-600">0</span>
                     <span id="population-capacity" class="font-mono text-[10px] sm:text-xs text-slate-400 tabular-nums"></span>
                 </div>
                 <i data-lucide="users" class="w-5 h-5 sm:w-6 sm:h-6 text-slate-500"></i>
            </div>
            <div id="supplies-ui" class="info-ui flex items-center gap-2 sm:gap-3">
                <div class="flex flex-col items-end gap-0.5">
                    <span id="supply-net" class="font-mono text-sm sm:text-base text-slate-600 tabular-nums">+0/s</span>
                    <span id="supply-hint" class="font-mono text-[10px] sm:text-xs text-slate-400 tabular-nums"></span>
                </div>
                <!-- Silo: fill = seconds of food in stock. Click = hand harvest. -->
                <button id="silo-btn" class="silo" aria-label="Food silo — click to hand harvest">
                    <div id="silo-fill" class="silo-fill" style="height: 0%;"></div>
                    <div class="tooltip">
                        <div class="effect"><span id="supply-production">+0</span>/s <i data-lucide='shopping-basket' class='w-4 h-4'></i></div>
                        <div class="effect"><span id="supply-consumption">-0</span>/s <i data-lucide='users' class='w-4 h-4'></i></div>
                        <div class="unlock-req">hand harvest +<span id="harvest-preview">0</span></div>
                    </div>
                </button>
                <span id="harvest-pop" class="harvest-pop" aria-hidden="true"></span>
                <i data-lucide="shopping-basket" class="w-5 h-5 text-slate-400"></i>
            </div>
            <!-- War room: the advisor's feed. Lines stay until pushed out; nothing fades before it is read. -->
            <div id="war-room" class="hidden w-[300px] sm:w-[340px] font-mono text-[11px] leading-snug text-slate-500 select-none pointer-events-none"></div>
        </div>

        <!-- Doomsday clock: how finished the surface is -->
        <div id="doomsday" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-1">
            <div class="relative w-10 h-10 sm:w-12 sm:h-12">
                <svg class="progress-ring w-full h-full" viewBox="0 0 40 40"><circle class="progress-ring-base" cx="20" cy="20" r="18" fill="none" stroke-width="2"></circle><circle id="doomsday-ring" class="progress-ring-fg" cx="20" cy="20" r="18" fill="none" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="113" style="stroke: #0f172a;"></circle></svg>
                <i data-lucide="skull" class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500 absolute inset-0 m-auto"></i>
            </div>
            <span id="salvage" class="font-mono text-[10px] text-slate-400 tabular-nums"></span>
        </div>

        <!-- LAND -->
        <div id="city-area" class="relative w-full h-full flex flex-col items-center justify-center p-4">
            <!-- Islands: wobbly coastlines on the water, behind the plates -->
            <svg id="islands-svg" aria-hidden="true"></svg>
            <!-- Ants: people (and cars, and the enemy) walking the streets between the plates -->
            <canvas id="ants-canvas" aria-hidden="true"></canvas>
            <div id="land-grid" class="grid grid-cols-5 gap-1 sm:gap-4"></div>
            <div id="competitor-island" class="hidden mt-24 sm:mt-28 flex justify-center items-end gap-3">
                <div class="enemy-factory relative w-24 h-24 rounded-xl flex items-center justify-center">
                    <i data-lucide="factory" class="w-12 h-12 text-slate-500"></i>
                </div>
                <div class="enemy-tile enemy-stage-2 relative w-16 h-16 rounded-xl flex items-center justify-center">
                    <i data-lucide="warehouse" class="w-8 h-8 text-slate-500"></i>
                </div>
                <div class="enemy-tile enemy-stage-3 relative w-16 h-16 rounded-xl flex items-center justify-center">
                    <i data-lucide="radar" class="w-8 h-8 text-slate-500"></i>
                </div>
                <div class="enemy-tile enemy-stage-4 relative w-16 h-16 rounded-xl flex items-center justify-center">
                    <i data-lucide="building-2" class="w-8 h-8 text-slate-500"></i>
                </div>
                <div class="enemy-tile enemy-stage-5 relative w-20 h-20 rounded-xl flex items-center justify-center">
                    <i data-lucide="ship" class="w-9 h-9 text-slate-500"></i>
                </div>
                <div class="enemy-tile enemy-rocket relative w-16 h-16 rounded-xl flex items-center justify-center">
                    <i data-lucide="rocket" class="w-8 h-8 text-slate-500"></i>
                </div>
            </div>
        </div>

        <!-- BUILD MENU -->
        <div class="absolute bottom-4 right-3 sm:bottom-8 sm:right-8 flex flex-col items-end gap-2 sm:gap-3 z-20">
            <div id="upgrades-container" class="flex flex-col items-end gap-3">
                 <!-- III · WAR is chosen, like the bank in chapter I. Greyed from the
                      moment the competitor appears, open once they have razed a house. -->
                 <!-- Chapter III controls -->
                 <button class="btn hidden" id="ship-btn" aria-label="Dig down — chapter IV">
                    <i data-lucide="shovel" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="tier-btn" aria-label="Research next weapon tier">
                    <i data-lucide="flame" class="w-7 h-7"></i>
                    <span id="tier-badge" class="btn-badge">I</span>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="intel-btn" aria-label="Intel: see the enemy's weapons and plans">
                    <i data-lucide="eye" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="radar-btn" aria-label="Radar: see where and when the next wave lands">
                    <i data-lucide="radar" class="w-7 h-7"></i>
                    <span id="radar-badge" class="btn-badge hidden"></span>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="raid-btn" aria-label="Raiding party: knock out their defence for a while">
                    <i data-lucide="venetian-mask" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="auto-btn" aria-label="Auto quartermaster">
                    <i data-lucide="repeat" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="strike-btn" aria-label="Strike the enemy">
                    <i data-lucide="crosshair" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="buy-force-btn" aria-label="Buy force">
                    <i data-lucide="swords" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="buy-defence-btn" aria-label="Buy defence">
                    <i data-lucide="shield" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="war-btn" aria-label="Go to war — chapter III">
                    <i data-lucide="swords" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="megastructure-research-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="computer-upgrade-btn">
                    <i data-lucide="computer" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                <button class="btn hidden" id="car-upgrade-btn">
                    <i data-lucide="car" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="apartment-research-btn">
                    <i data-lucide="building" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="store-research-btn">
                    <i data-lucide="shopping-cart" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                 <button class="btn hidden" id="urbanism-research-btn">
                    <i data-lucide="building-2" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                <button class="btn hidden" id="tool-case-upgrade-btn">
                    <i data-lucide="tool-case" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                <button class="btn hidden" id="expand-land-2-btn">
                    <i data-lucide="land-plot" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                <button class="btn hidden" id="expand-land-btn">
                    <i data-lucide="land-plot" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                <button class="btn hidden" id="superconductor-btn">
                     <svg class="progress-ring w-full h-full" viewBox="0 0 40 40"><circle class="progress-ring-base" cx="20" cy="20" r="18" fill="none" stroke-width="2"></circle><circle id="superconductor-ring" class="progress-ring-fg" cx="20" cy="20" r="18" fill="none" stroke-width="4" stroke-dasharray="113" stroke-dashoffset="113" style="stroke: #64748b;"></circle></svg>
                    <i data-lucide="cpu" class="w-7 h-7 absolute"></i>
                    <div class="tooltip"></div>
                </button>
                <button class="btn hidden" id="gmo-upgrade-btn">
                     <svg class="progress-ring w-full h-full" viewBox="0 0 40 40"><circle class="progress-ring-base" cx="20" cy="20" r="18" fill="none" stroke-width="2"></circle><circle id="gmo-ring" class="progress-ring-fg" cx="20" cy="20" r="18" fill="none" stroke-width="4" stroke-dasharray="113" stroke-dashoffset="113" style="stroke: #94a3b8;"></circle></svg>
                    <i data-lucide="flask-conical" class="w-7 h-7 absolute"></i>
                    <div class="tooltip"></div>
                </button>
            </div>
            <div id="build-separator" class="w-full h-px bg-slate-300 my-1 hidden"></div>
            <div id="buildings-container" class="flex flex-col items-end gap-3">
                <button class="btn hidden" id="build-stall-btn">
                    <i data-lucide="wheat" class="w-7 h-7"></i>
                    <span id="stall-count" class="btn-badge hidden">0</span>
                    <div class="tooltip"></div>
                </button>
                <button class="btn" id="build-store-btn">
                    <i data-lucide="store" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
                <button class="btn" id="build-home-btn">
                    <i data-lucide="home" class="w-7 h-7"></i>
                    <div class="tooltip"></div>
                </button>
            </div>
        </div>

    </div>


    <!-- ==================== PHASE 4: THE DEEP ==================== -->
    <div id="phase-deep" class="phase-container hidden">

        <!-- the model fills the window; nothing is framed -->
        <div id="deep-scene"></div>
        <div id="deep-labels"></div>
        <div id="deep-fallback" class="deep-mono">this view needs WebGL</div>

        <!-- the goal: the chance of survival up there, as the colony believes it. Since v1.45.0
             the ring rides on the crust slab in the model; this band is only the fallback for a
             browser without WebGL -->
        <div id="deep-crust"></div>

        <!-- the wake-up replay: what ran, what stopped, what came of it -->
        <div class="deep-chrome" id="deep-replay" hidden></div>

        <!-- time: year large, month and day smaller -->
        <div class="deep-chrome" id="deep-time">
            <div class="deep-mono deep-clock">
                <span class="deep-y" id="deep-year">0</span>
                <span class="deep-sep">·</span>
                <span class="deep-md" id="deep-month">1</span>
                <span class="deep-sep">·</span>
                <span class="deep-md" id="deep-day">1</span>
                <span class="deep-unit">y</span>
                <span></span>
                <span class="deep-unit">m</span>
                <span></span>
                <span class="deep-unit">d</span>
            </div>
        </div>

        <!-- what we hold -->
        <div class="deep-chrome" id="deep-hold">
            <div class="deep-hold-row" id="deep-ore-row">
                <span class="deep-hold-num">
                    <span class="deep-mono deep-amount" id="deep-minerals">0</span>
                    <span class="deep-mono deep-rate" id="deep-minerals-rate"></span>
                </span>
                <i data-lucide="pickaxe" class="w-5 h-5"></i>
                <div class="tooltip deep-tip-wide"></div>
            </div>
            <div class="deep-hold-row" id="deep-stars-row">
                <span class="deep-hold-num">
                    <span class="deep-mono deep-amount" id="deep-stars">0</span>
                    <span class="deep-mono deep-rate" id="deep-stars-rate"></span>
                </span>
                <i data-lucide="star" class="w-5 h-5"></i>
                <div class="tooltip deep-tip-wide"></div>
            </div>
            <div class="deep-mono" id="deep-advisor"></div>
            <div class="deep-mono" id="deep-feed"></div>
        </div>

        <!-- the four columns, the shortest marked -->
        <div class="deep-chrome" id="deep-columns">
            <div class="deep-mono deep-col-heads">
                <span class="deep-col-head" id="deep-head-M">0</span>
                <span class="deep-col-head" id="deep-head-F">0</span>
                <span class="deep-col-head" id="deep-head-E">0</span>
                <span class="deep-col-head" id="deep-head-H">0</span>
            </div>
            <div class="deep-bars">
                <div class="deep-bar" id="deep-bar-M">
                    <span class="deep-delta deep-mono" id="deep-delta-M"></span>
                    <div class="deep-track">
                        <div class="deep-ghost" id="deep-ghost-M"></div>
                        <div class="deep-fill" id="deep-fill-M"></div>
                    </div>
                    <span class="deep-stop-dot hidden" id="deep-dot-M"></span>
                    <div class="tooltip deep-tip-right deep-tip-wide"></div>
                </div>
                <div class="deep-bar" id="deep-bar-F">
                    <span class="deep-delta deep-mono" id="deep-delta-F"></span>
                    <div class="deep-track">
                        <div class="deep-ghost" id="deep-ghost-F"></div>
                        <div class="deep-fill" id="deep-fill-F"></div>
                    </div>
                    <span class="deep-stop-dot hidden" id="deep-dot-F"></span>
                    <div class="tooltip deep-tip-right deep-tip-wide"></div>
                </div>
                <div class="deep-bar" id="deep-bar-E">
                    <span class="deep-delta deep-mono" id="deep-delta-E"></span>
                    <div class="deep-track">
                        <div class="deep-ghost" id="deep-ghost-E"></div>
                        <div class="deep-fill" id="deep-fill-E"></div>
                    </div>
                    <span class="deep-stop-dot hidden" id="deep-dot-E"></span>
                    <div class="tooltip deep-tip-right deep-tip-wide"></div>
                </div>
                <div class="deep-bar" id="deep-bar-H">
                    <span class="deep-delta deep-mono" id="deep-delta-H"></span>
                    <div class="deep-track">
                        <div class="deep-ghost" id="deep-ghost-H"></div>
                        <div class="deep-fill" id="deep-fill-H"></div>
                    </div>
                    <span class="deep-stop-dot hidden" id="deep-dot-H"></span>
                    <div class="tooltip deep-tip-right deep-tip-wide"></div>
                </div>
            </div>
            <div class="deep-mono deep-col-feet">
                <span class="deep-col-foot">M</span>
                <span class="deep-col-foot">F</span>
                <span class="deep-col-foot">E</span>
                <span class="deep-col-foot">H</span>
            </div>
            <!-- what comes in and what goes out of each store in a day -->
            <div class="deep-mono deep-col-flows">
                <span class="deep-col-flow"><span class="in" id="deep-in-M"></span><span class="out" id="deep-out-M"></span></span>
                <span class="deep-col-flow"><span class="in" id="deep-in-F"></span><span class="out" id="deep-out-F"></span></span>
                <span class="deep-col-flow"><span class="in" id="deep-in-E"></span><span class="out" id="deep-out-E"></span></span>
                <span class="deep-col-flow"><span class="in" id="deep-in-H"></span><span class="out" id="deep-out-H"></span></span>
            </div>
            <div class="deep-per-day">
                <span class="deep-mono" id="deep-stars-day">0</span>
                <span class="deep-per-day-mark">
                    <i data-lucide="star" class="w-4 h-4"></i>
                    <span class="deep-mono">/</span>
                    <i data-lucide="sun" class="w-4 h-4"></i>
                </span>
            </div>
        </div>

        <!-- the buttons -->
        <div class="deep-chrome deep-btn-col">
            <button class="btn" id="deep-dig-btn" aria-label="Dig a chamber">
                <i data-lucide="shovel" class="w-7 h-7"></i>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn deep-room-btn" id="deep-room-mine" data-room="mine" aria-label="Mine">
                <i data-lucide="pickaxe" class="w-7 h-7"></i>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn deep-room-btn" id="deep-room-farm" data-room="farm" aria-label="Farm">
                <i data-lucide="sprout" class="w-7 h-7"></i>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn deep-room-btn" id="deep-room-generator" data-room="generator" aria-label="Generator">
                <i data-lucide="zap" class="w-7 h-7"></i>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn deep-room-btn" id="deep-room-dorm" data-room="dorm" aria-label="Dormitory">
                <i data-lucide="bed" class="w-7 h-7"></i>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn" id="deep-level-btn" aria-label="Level the weakest">
                <i data-lucide="chevrons-up" class="w-7 h-7"></i>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn" id="deep-auto-btn" aria-label="Automate the weakest">
                <i data-lucide="repeat" class="w-7 h-7"></i>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn is-locked has-caption" id="deep-cryo-btn" aria-label="Cryo">
                <i data-lucide="snowflake" class="w-7 h-7"></i>
                <span class="deep-badge deep-mono hidden" id="deep-cryo-badge"></span>
                <span class="deep-caption deep-mono" id="deep-cryo-caption"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn hidden" id="deep-wake-btn" aria-label="Wake the colony">
                <i data-lucide="sun" class="w-7 h-7"></i>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn hidden has-caption" id="deep-cryo-up" aria-label="A longer sleep">
                <i data-lucide="chevrons-up" class="w-7 h-7"></i>
                <span class="deep-badge deep-mono" id="deep-cryo-up-badge"></span>
                <span class="deep-caption deep-mono" id="deep-cryo-up-caption"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn hidden" id="deep-probe-btn" aria-label="Send a scout party">
                <i data-lucide="footprints" class="w-7 h-7"></i>
                <span class="deep-badge deep-mono hidden" id="deep-probe-badge"></span>
                <span class="deep-build"></span>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn" id="deep-ascend-btn" aria-label="Try to resurface">
                <i data-lucide="arrow-up-from-line" class="w-7 h-7"></i>
                <div class="tooltip deep-tip-wide"></div>
            </button>
            <button class="btn" id="deep-reset-view" aria-label="Reset the view">
                <i data-lucide="scan" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- v1.47.0: what stays awake while the colony sleeps. Only in the sleep world: a slow
             pulse, a name, a meter, the machines' spare capacity, and now and then a riddle -->
        <div class="deep-chrome" id="deep-watcher" hidden>
            <div class="deep-watcher-head">
                <span class="deep-watcher-pulse"></span>
                <span class="deep-mono deep-watcher-name" id="deep-watcher-name">SYSTEM AWAKE</span>
            </div>
            <div class="deep-watcher-meter">
                <span class="deep-mono deep-watcher-word">STABILITY</span>
                <span class="deep-watcher-track"><span class="deep-watcher-fill" id="deep-stab-fill"></span></span>
                <span class="deep-mono deep-watcher-val" id="deep-stab-val">100</span>
            </div>
            <div class="deep-watcher-cap"><span class="deep-watcher-cap-fill" id="deep-cap-fill"></span></div>
            <div class="deep-puzzle" id="deep-puzzle">
                <span class="deep-mono deep-puzzle-q" id="deep-puzzle-q"></span>
                <input class="deep-mono deep-puzzle-in" id="deep-puzzle-in" type="text" inputmode="numeric"
                    autocomplete="off" spellcheck="false" aria-label="Answer">
                <span class="deep-mono deep-puzzle-said" id="deep-puzzle-said"></span>
            </div>
        </div>

        <div class="deep-chrome" id="deep-mark">IV &middot; THE DEEP</div>
    </div>

    <!-- ==================== SHARED ELEMENTS ==================== -->
    <div id="menu-wrapper" class="fixed bottom-4 left-4">
        <div class="relative">
            <button id="menu-btn" class="btn w-12 h-12 rounded-full bg-white shadow-lg transition-transform hover:scale-110">
                <i data-lucide="menu" class="w-6 h-6 text-slate-600"></i>
            </button>
            <div id="menu-dropdown" class="hidden absolute bottom-14 left-0 bg-white rounded-lg shadow-lg">
                <button id="reset-btn" class="block px-4 py-2 text-sm hover:bg-slate-100 whitespace-nowrap">Reset everything</button>
                <button id="debug-menu-toggle" class="block px-4 py-2 text-sm text-slate-400 hover:bg-slate-100 whitespace-nowrap">Debug menu</button>
                <!-- Test menu (debug on): jump to a checkpoint, or save/load three snapshot slots -->
                <div id="test-menu" class="hidden border-t border-slate-100 px-3 py-2 text-xs text-slate-500 min-w-[260px]">
                    <div class="font-semibold text-slate-400 mb-1">Jump to</div>
                    <div id="checkpoint-list" class="grid grid-cols-2 gap-1 mb-2"></div>
                    <div class="font-semibold text-slate-400 mb-1">Snapshots</div>
                    <div id="slot-list" class="flex flex-col gap-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- War room: the advisor's feed during chapter III (icons over text everywhere else;
         Ola asked for this one place where words explain what is happening) -->
    <div id="version-info" class="fixed bottom-2 left-2 text-[10px] text-slate-400 select-none">v1.47.0</div>
    <div id="tooltip"></div>

    <div id="chapter-card" class="chapter-card" aria-hidden="true">
      <div class="chapter-card__veil"></div>
      <div class="chapter-card__content">
        <div class="chapter-card__roman"></div>
        <div class="chapter-card__title"></div>
        <div class="chapter-card__suffix" hidden>to come</div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
