   Three directions, each in the same three states (TEND, SLEEP, GROW), so they compare:
     A  THE WATCHER'S SCREEN  the colony as a flat plan on the Watcher's monitor (SVG)
     B  STRATA                a cross-section through the earth; time lays down rock (SVG)
     C  STRIPPED 3D           the floors as bare slabs, one light, a close slow camera (three.js)

   ONE PALETTE for all three:
     rock   #0a0d12   the dark, the background, everything cut into a plate
     plate  #d5dbe3   light concrete: slabs, plates, the plan's lit rooms
     flesh  cold and dark (#170d11 with muscle #4a3039..#6a4652, hyphae #b9c4ca, tendon

<script type="module">
import * as THREE from 'three';

/* ======================================================================== the palette */
const ROCK = '#0a0d12', PLATE = '#d5dbe3', LANE = '#7b8595', INK = '#8fa1b6', DIM = '#55637a', SLAB = '#1e2733';
const PULSE = 'var(--pulse)', PULSE_HI = 'var(--pulse-hi)', RED = '#a8132c';
const HYC = '#b9c4ca', MUS = ['#4a3039', '#5b3b46', '#6a4652', '#3f2932'];
const MUS_DK = '#170d11', TENDON = '#a9b2b9', ART = '#2c1219', ART_CORE = '#7d1f2e', STAIN = '#0c1013', BONE = '#d9dad3';
const MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

const DIRS = {
    a: { name: "A · THE WATCHER'S SCREEN", cap: [
        'Du spelar vaktaren och ser kolonin genom en skärm: en ritning ovanifrån, varje våning en egen ruta bredvid de andra.',
        'Sömnen är en skärm som står på i mörkret och räknar år; när sinnet går blir det bildfel, efterbilder och en ruta som inte stämmer.',
        'Köttet tar först över ritningen och sedan själva skärmen: gränsen mellan den som tittar och det som syns försvinner.'] },
    b: { name: 'B · STRATA', cap: [
        'Spelet blir ett snitt genom jorden: kolonin är några kamrar djupt nere, schaktet den enda vägen upp.',
        'Varje sömn lägger nya lager ovanpå; tiden syns som djup, ytan glider bort och vägen ut blir längre för varje natt.',
        'Köttet fyller kamrarna och skjuter rötter och kärl genom berget; uppstigningen är att bryta igenom alla lager som tiden lagt.'] },
    c: { name: 'C · STRIPPED 3D', cap: [
        'Samma våningar som förut men avskalade: tunga plattor utan gångar, hus och ikoner, ett enda ljus och en nära kamera som långsamt glider.',
        'I sömnen slocknar ljuset och djupet faller ner i svart; det enda som syns i mörkret är det som inte finns.',
        'Köttet ersätter plattorna en efter en och maskinens rör blir händer mitt i bilden; man ser kroppen, inte en karta.'] },
};
const STATES = ['tend', 'sleep', 'grow'];
const STATE_NAME = { tend: 'I · TEND', sleep: 'II · SLEEP', grow: 'III · GROW' };
const STATE_NOTE = { tend: 'the machine', sleep: 'the mind', grow: 'the body' };

/* ======================================================================== helpers */
function rng(seed) {
    let a = seed >>> 0;
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const f1 = (v) => v.toFixed(1);
function poly(pts) { return 'M ' + pts.map((p) => f1(p[0]) + ' ' + f1(p[1])).join(' L '); }
function txt(x, y, s, o = {}) {
    return `<text x="${f1(x)}" y="${f1(y)}" font-family="${o.f || MONO}" font-size="${o.s || 11}" fill="${o.c || INK}"` +
        ` text-anchor="${o.a || 'start'}" letter-spacing="${o.ls || '0.12em'}" font-weight="${o.w || 400}"` +
        (o.op !== undefined ? ` opacity="${o.op}"` : '') + (o.st ? ` style="${o.st}"` : '') + `>${s}</text>`;
}
const DEFS = new Map();
function def(id, markup) { if (!DEFS.has(id)) DEFS.set(id, markup); return id; }

/* ---- the tissue, after deep-tree-12: mycelium, sinew, vessels ---- */
function crPts(P, k) {
    const out = [];
    for (let i = 0; i < P.length - 1; i++) {
        const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
        for (let j = 0; j < k; j++) {
            const t = j / k, t2 = t * t, t3 = t2 * t;
            out.push([0, 1].map((c) => 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3)));
        }
    }
    out.push(P[P.length - 1].slice());
    return out;
}
function noiseFn(seed) {
    const r = rng(seed);
    const a = [0, 1, 2].map(() => ({ f: 0.02 + r() * 0.09, p: r() * 6.28, m: 0.4 + r() }));
    return (x) => a.reduce((s, o) => s + o.m * Math.sin(x * o.f + o.p), 0) / 2.2;
}
function normals(pts) {
    return pts.map((p, i) => {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
        return [-dy / L, dx / L];
    });
}
function wob(P, amp, seed, k) {
    const pts = crPts(P, k || 10);
    const n = noiseFn(seed), N = normals(pts);
    let acc = 0;
    return pts.map((p, i) => {
        if (i > 0) acc += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
        const o = amp * n(acc);
        return [p[0] + N[i][0] * o, p[1] + N[i][1] * o];
    });
}
function ribbon(pts, wf) {
    const N = normals(pts), L = [], R = [];
    pts.forEach((p, i) => {
        const t = i / Math.max(1, pts.length - 1), w = wf(t, i) / 2;
        L.push([p[0] + N[i][0] * w, p[1] + N[i][1] * w]);
        R.push([p[0] - N[i][0] * w, p[1] - N[i][1] * w]);
    });
    return poly(L.concat(R.reverse())) + ' Z';
}
function closedPath(pts) {
    const n = pts.length;
    let s = 'M ' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
    for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        s += ' C ' + f1(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + f1(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
            f1(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + f1(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]);
    }
    return s + ' Z';
}
function blobPts(cx, cy, r, irr, seed, n, sx, sy) {
    const R = rng(seed);
    n = n || 11;
    const a0 = R() * 6.28, pts = [];
    for (let i = 0; i < n; i++) {
        const a = a0 + i / n * 6.28 + (R() - 0.5) * 0.4;
        const rr = r * (1 - irr / 2 + R() * irr);
        pts.push([cx + Math.cos(a) * rr * (sx || 1), cy + Math.sin(a) * rr * (sy || 1)]);
    }
    return pts;
}
function blob(cx, cy, r, irr, seed, n, sx, sy) { return closedPath(blobPts(cx, cy, r, irr, seed, n, sx, sy)); }
function pulseOn(path, w, dur, delay, cls) {
    return `<path class="${cls || 'pulse'}" pathLength="100" d="${path}" fill="none" style="stroke:${PULSE_HI};animation-duration:${dur}s;animation-delay:-${delay}s" stroke-width="${w}" stroke-linecap="round"/>`;
}
/* a hypha: a random walk that sometimes branches; fine, pale, mostly see-through */
function hypha(x, y, a, steps, depth, r, out, w, step, op) {
    const pts = [[x, y]], st = step || 3.4;
    for (let i = 0; i < steps; i++) {
        a += (r() - 0.5) * 0.55;
        x += Math.cos(a) * st; y += Math.sin(a) * st;
        pts.push([x, y]);
        if (depth < 3 && r() < 0.07) hypha(x, y, a + (r() < 0.5 ? 0.8 : -0.8) * (0.6 + r() * 0.6), Math.floor(steps * 0.55), depth + 1, r, out, w * 0.7, st, op);
    }
    out.push(`<path d="${poly(pts)}" fill="none" stroke="${HYC}" stroke-width="${Math.max(0.35, w).toFixed(2)}" opacity="${((op || 1) * (0.16 + r() * 0.34)).toFixed(2)}" stroke-linecap="round"/>`);
}
/* an artery, branching into capillaries */
function vein(P, w, seed, depth, out, r, pulse, amp, core) {
    const pts = wob(P, amp === undefined ? 2.4 : amp, seed, 10);
    out.push(`<path d="${ribbon(pts, (t) => w * 1.25 * (1 - 0.65 * t))}" fill="${ART}"/>`);
    out.push(`<path d="${poly(pts)}" fill="none" stroke="${ART_CORE}" stroke-width="${(w * 0.32).toFixed(2)}" opacity="${core === undefined ? 0.85 : core}"/>`);
    out.push(`<path d="${poly(pts)}" fill="none" stroke="#e6d9dc" stroke-width="0.45" opacity="0.28" transform="translate(-0.6,-0.7)"/>`);
    if (pulse) out.push(pulseOn(poly(pts), (w * 0.42).toFixed(2), 6 + (seed % 5) * 0.4, (seed % 11) * 0.6, 'pulse soft'));
    if (depth < 3) {
        for (let k = 2; k < pts.length - 3; k += 4 + Math.floor(r() * 4)) {
            const p = pts[k], q = pts[k + 1];
            const a = Math.atan2(q[1] - p[1], q[0] - p[0]) + (r() < 0.5 ? 1 : -1) * (0.6 + r() * 0.7);
            const L = (12 + r() * 24 * (1 - depth * 0.25)) * Math.max(1, w / 4);
            const e = [p[0] + Math.cos(a) * L, p[1] + Math.sin(a) * L];
            vein([p, [(p[0] + e[0]) / 2 + (r() - 0.5) * 6, (p[1] + e[1]) / 2 + (r() - 0.5) * 6], e], w * 0.5, seed * 7 + k, depth + 1, out, r, false, undefined, core);
        }
    }
    return pts;
}
/* a striated muscle bundle: a belly between two tendons */
function bundle(P, wMid, nF, seed, r, tendon, pulse, amp) {
    const pts = wob(P, amp === undefined ? 2 : amp, seed, 14);
    const prof = (t) => wMid * (0.32 + 0.68 * Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, t))), 0.7));
    let h = `<path d="${ribbon(pts, prof)}" fill="${MUS_DK}"/>`;
    const N = normals(pts);
    for (let k = 0; k < nF; k++) {
        const base = k / (nF - 1) - 0.5;
        const n = noiseFn(seed * 13 + k);
        const fp = pts.map((p, i) => {
            const t = i / (pts.length - 1);
            const o = (base * 0.86 + n(i * 3) * 0.06) * prof(t);
            return [p[0] + N[i][0] * o, p[1] + N[i][1] * o];
        });
        h += `<path d="${poly(fp)}" fill="none" stroke="${MUS[Math.floor(r() * 4)]}" stroke-width="${(0.9 + r() * 0.8) * Math.max(1, wMid / 40)}" stroke-linecap="round"/>`;
    }
    for (let i = 3; i < pts.length - 3; i += 2) {
        if (r() < 0.55) continue;
        const t = i / (pts.length - 1), w = prof(t) * (0.15 + r() * 0.3), p = pts[i], q = N[i];
        const sl = (r() - 0.5) * 3;
        h += `<path d="M ${f1(p[0] + q[0] * w + sl)} ${f1(p[1] + q[1] * w)} L ${f1(p[0] - q[0] * w * (0.6 + r() * 0.4))} ${f1(p[1] - q[1] * w * (0.6 + r() * 0.4) + sl)}" stroke="#0e0d12" stroke-width="0.7" opacity="0.6"/>`;
    }
    h += `<path d="${poly(pts.map((p, i) => { const w = prof(i / (pts.length - 1)) * 0.36; return [p[0] + N[i][0] * w, p[1] + N[i][1] * w]; }))}" fill="none" stroke="#c9cfd8" stroke-width="0.7" opacity="0.3"/>`;
    if (tendon) {
        [[0, 0.16], [0.84, 1]].forEach((rg) => {
            const seg = pts.filter((p, i) => { const t = i / (pts.length - 1); return t >= rg[0] && t <= rg[1]; });
            if (seg.length < 2) return;
            h += `<path d="${ribbon(seg, (t) => { const e = rg[0] === 0 ? 1 - t : t; return wMid * (0.2 + 0.32 * e * e); })}" fill="${TENDON}"/>`;
            h += `<path d="${poly(seg)}" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.5" transform="translate(-0.5,-0.7)"/>`;
        });
    }
    if (pulse) h += pulseOn(poly(pts), Math.max(1.2, wMid * 0.11).toFixed(2), 6.5 + r() * 2, r() * 6, 'pulse soft');
    return h;
}
/* a knot of fibre: an organ; its core beats */
function knot(x, y, scale, seed, r, frac) {
    const f = frac === undefined ? 0.6 : frac;
    const loops = 6 + Math.round(18 * f), tight = 1 - 0.36 * f;
    let h = `<path d="${blob(x, y, 15 * scale * (0.82 + 0.18 * f), 0.5, seed, 10, 1.2, 0.9)}" fill="#141319"/>`;
    for (let k = 0; k < loops; k++) {
        const pts = blobPts(x + (r() - 0.5) * 6 * scale * tight, y + (r() - 0.5) * 5 * scale * tight, (7 + r() * 9) * scale * tight, 0.5, seed + k * 3, 9, 1 + r() * 0.6, 0.5 + r() * 0.5);
        h += `<path d="${closedPath(pts)}" transform="rotate(${(r() * 180).toFixed(1)} ${x} ${y})" fill="none" stroke="${MUS[k % 4]}" stroke-width="${((0.9 + r() * 1.2 + 0.9 * f) * scale).toFixed(2)}"/>`;
    }
    h += `<path class="beat" d="${blob(x + 2, y + 1, (2.5 + 3 * f) * scale, 0.6, seed + 99, 8)}" style="fill:${PULSE}" opacity="${(0.4 + 0.5 * f).toFixed(2)}"/>`;
    return h;
}
/* a tendon hooked over an edge */
function band(P, w, seed) {
    const pts = wob(P, 1.2, seed, 10);
    return `<path d="${ribbon(pts, (t) => w * (0.7 + 0.3 * Math.sin(t * 3 + seed)))}" fill="#9ea8af"/>` +
        `<path d="${poly(pts)}" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.45" transform="translate(-0.4,-0.6)"/>`;
}
/* a mass of tissue covering a cell: dark ground, crossing bellies, a wet rim */
function tissueCell(cx, cy, R, seed, o = {}) {
    const r = rng(seed);
    let h = `<path d="${blob(cx, cy, R * 1.04, 0.2, seed, 12, o.sx || 1, o.sy || 1)}" fill="${MUS_DK}"/>`;
    const n = o.n || 3;
    for (let k = 0; k < n; k++) {
        const a = (o.a !== undefined ? o.a : r() * Math.PI) + k * (0.9 + r() * 0.6);
        const L = R * (1.0 + r() * 0.25);
        const sx = o.sx || 1, sy = o.sy || 1;
        const P = [[cx - Math.cos(a) * L * sx, cy - Math.sin(a) * L * sy],
            [cx + (r() - 0.5) * R * 0.4, cy + (r() - 0.5) * R * 0.4],
            [cx + Math.cos(a) * L * sx, cy + Math.sin(a) * L * sy]];
        h += bundle(P, R * (0.95 - 0.2 * k), 8 + Math.round(R / 8), seed * 7 + k, r, k === 0 && o.tendon !== false, false);
    }
    h += `<path d="${blob(cx, cy, R * 1.0, 0.2, seed + 3, 12, o.sx || 1, o.sy || 1)}" fill="none" stroke="#c9cfd8" stroke-width="0.8" opacity="0.16"/>`;
    return h;
}

/* bellies lying side by side, one way, as muscle does; the way turns from cell to cell */
function bellies(cx, cy, R, seed, r, a) {
    let h = `<path d="${blob(cx, cy, R * 1.02, 0.2, seed, 12)}" fill="${MUS_DK}"/>`;
    const ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;
    const n = 4;
    for (let k = 0; k < n; k++) {

            let x = alongX ? edgeX : P3.pitch + (r() - 0.5) * 2.1, z = alongX ? P3.pitch + (r() - 0.5) * 2.1 : edgeZ;
            let a = alongX ? (r() - 0.5) * 1.2 : Math.PI / 2 + (r() - 0.5) * 1.2;
            const pts = [new THREE.Vector3(x, yy, z)];
            for (let j = 0; j < 6 + r() * 16; j++) { a += (r() - 0.5) * 0.7; x += Math.cos(a) * 0.05; z += Math.sin(a) * 0.05; pts.push(new THREE.Vector3(x, yy, z)); }
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), hyM));
        }
        // the spine: the shaft is flesh down to the next floor
        const sp = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.1, -1.6, 0.05), new THREE.Vector3(-0.05, -3.2, 0), new THREE.Vector3(0, -4.6, 0.04)]);
        scene.add(new THREE.Mesh(new THREE.TubeGeometry(sp, 40, 0.68, 16), fM));
        // the machine's house half eaten; its tubes have become arms, the arms end in hands
        const capM = new THREE.Mesh(sEll(1.12, 0.55, 1.12, 0.4, 0.35, 811, 0.2), fM);
        capM.position.set(0, topY - 0.1, 0); scene.add(capM);
        cam.position.set(Math.sin(0.67) * 18.5, 8.4, Math.cos(0.67) * 18.5);
        cam.updateMatrixWorld();
        const right = new THREE.Vector3(0.78, 0, -0.62).normalize();
        const H = [
            { kind: 'fist', base: [0, -0.55], at: right.clone().multiplyScalar(-1.55).add(new THREE.Vector3(0, 3.15, 0.2)), roll: 0.35 },
            { kind: 'flat', base: [-0.5, 0.32], at: right.clone().multiplyScalar(0.05).add(new THREE.Vector3(0, 4.05, 0.3)), roll: 0.0 },
            { kind: 'two', base: [0.5, 0.32], at: right.clone().multiplyScalar(1.6).add(new THREE.Vector3(0, 3.3, 0.1)), roll: -0.35 },
        ];
        H.forEach((h, i) => {
            const hg = makeHand(h.kind, fM, tendM);
            hg.position.copy(h.at);
            hg.lookAt(cam.position.clone().setY(h.at.y + 0.5));
            hg.rotateZ(h.roll);
            hg.scale.setScalar(1.35);
            scene.add(hg);
            hg.updateMatrixWorld(true);
            const wrist = hg.localToWorld(new THREE.Vector3(0, -0.36, 0));
            const down = hg.localToWorld(new THREE.Vector3(0, -0.9, 0)).sub(wrist).normalize();
            const b0 = new THREE.Vector3(h.base[0], topY + 0.1, h.base[1]);
            const curve = new THREE.CatmullRomCurve3([b0, b0.clone().add(new THREE.Vector3(0, 0.8, 0)), wrist.clone().add(down.multiplyScalar(0.8)), wrist]);
            scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.2, 14), fM));
            for (let k = 0; k < 2; k++) {
                const off = new THREE.Vector3(Math.cos(k * 2.6 + i) * 0.17, 0, Math.sin(k * 2.6 + i) * 0.17);
                const pts = curve.getPoints(40).slice(2, 34).map((p, j) => p.clone().add(off).add(new THREE.Vector3(0, 0, Math.sin(j * 0.4) * 0.02)));
                scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.022, 6), tendM));
            }
        });
        updates.push((t) => {
            const k = t % 1.4;
            const beat = Math.exp(-Math.pow((k - 0.1) / 0.06, 2)) + 0.7 * Math.exp(-Math.pow((k - 0.32) / 0.07, 2));
            fM.emissiveIntensity = 0.12 + 1.1 * beat;
        });
    }
    return {
        scene, cam,
        tick(t) {
            const a = 0.67 + Math.sin(t * 0.05) * 0.06;
            const R = st === 'grow' ? 18.5 : 18, h = st === 'grow' ? 8.4 : 7.2;
            cam.position.set(Math.sin(a) * R, h, Math.cos(a) * R);
            cam.lookAt(target);
            updates.forEach((u) => u(t));
        },
    };
}

/* ======================================================================== the page */
const main = document.getElementById('main');
const params = new URLSearchParams(location.search);
const single = params.get('s');
const C_STAGES = [];

function frameHTML(dir, st) {
    const id = `${dir}-${st}`;
    return `<div class="cell"><div class="lab"><b>${STATE_NAME[st]}</b><span>${STATE_NOTE[st]}</span></div>` +
        `<div class="frame" data-id="${id}"><div class="stage" data-dir="${dir}" data-st="${st}"></div></div></div>`;
}
function dirHTML(dir, stacked) {
    const d = DIRS[dir];
    return `<section class="dir" data-dir="${dir}">${stacked ? `<h2>${d.name}</h2>` : ''}<div class="caption">${d.cap.map((l) => `<div>${l}</div>`).join('')}</div>` +
        `<div class="row">${STATES.map((st) => frameHTML(dir, st)).join('')}</div></section>`;
}
const svgCache = {};
function fillStage(el) {
    const dir = el.dataset.dir, st = el.dataset.st, key = dir + st;
    if (dir === 'c') {
        el.innerHTML = `<canvas width="1440" height="900"></canvas>` + (svgCache[key] || (svgCache[key] = overlayStage(st)));
        C_STAGES.push({ el, canvas: el.querySelector('canvas'), st, r: null, s: null });
    } else {
        el.innerHTML = svgCache[key] || (svgCache[key] = svgStage(dir, st));
    }
}
function render(tab) {
    if (single) {
        const [dir, st] = single.split('-');
        document.body.classList.add('single');
        main.innerHTML = `<section class="dir"><div class="row">${frameHTML(dir, st)}</div></section>`;
    } else if (tab === 'all') {
        main.innerHTML = ['a', 'b', 'c'].map((d) => dirHTML(d, true)).join('');
    } else {
        main.innerHTML = dirHTML(tab, false);
    }
    C_STAGES.length = 0;
    main.querySelectorAll('.stage').forEach(fillStage);
    document.getElementById('defs').innerHTML = [...DEFS.values()].join('');
    fit();
    main.querySelectorAll('.frame').forEach((f) => f.addEventListener('click', () => {
        if (single) location.search = '';
        else location.search = '?s=' + f.dataset.id;
    }));
}
function fit() {
    main.querySelectorAll('.frame').forEach((f) => {
        const st = f.querySelector('.stage');
        if (single) {
            const k = Math.min(innerWidth / 1440, innerHeight / 900);
            st.style.transform = `translate(${(innerWidth - 1440 * k) / 2}px, ${(innerHeight - 900 * k) / 2}px) scale(${k})`;
        } else st.style.transform = `scale(${f.clientWidth / 1440})`;
    });
}
addEventListener('resize', fit);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && single) location.search = ''; });

let tab = 'a';
try { tab = localStorage.getItem('deep-views-13-tab') || 'a'; } catch { /* private window */ }
if (['a', 'b', 'c', 'all'].includes(params.get('tab'))) tab = params.get('tab');
document.querySelectorAll('.tab').forEach((b) => {
    b.classList.toggle('on', b.dataset.tab === tab);
    b.addEventListener('click', () => {
        tab = b.dataset.tab;
        try { localStorage.setItem('deep-views-13-tab', tab); } catch { /* ignore */ }
        document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
        render(tab);
    });
});

await document.fonts.ready;
render(tab);

const t0 = performance.now();
let frames = 0;
function loop() {
    const t = (performance.now() - t0) / 1000;
    C_STAGES.forEach((c) => {
        if (!c.el.isConnected) return;
        const box = c.el.parentElement.getBoundingClientRect();
        if (box.bottom < 0 || box.top > innerHeight) return;
        if (!c.r) {
            c.r = new THREE.WebGLRenderer({ canvas: c.canvas, antialias: true });
            c.r.setPixelRatio(1);
            c.r.setSize(1440, 900, false);
            c.s = buildC(c.st);
        }
        c.s.tick(t);
        c.r.render(c.s.scene, c.s.cam);
    });
    frames++;
    if (frames === 4) window.__ready = true;
    requestAnimationFrame(loop);
}
loop();
</script>
