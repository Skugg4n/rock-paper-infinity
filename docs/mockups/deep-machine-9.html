<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"

</script>
<style>
/* Mockup 9b of chapter IV: the rock, paper, scissors machine, in real 3D.
   Design: docs/superpowers/specs/2026-10-02-chapter-iv-tree-and-bio.md, section 4.
   STATIC: no game logic beyond the toy itself. Every number is by hand.

   One lid plate, as in the game: light plate #d5dbe3 on dark rock #0a0d12, the ring
   lane cut in #7b8595, one lamp above. The machine is plate colour with darker joints
   (#5b6676): a hub on a flywheel, three arms hinged on the hub, each ending in one of
   chapter I's glyphs, and a small ring on a mast in the middle. In turn each arm throws
   its glyph over the ring; the ring throws back (the faint glyph inside it). A win is a
   star, flashed above the ring. Feed it energy and it plays faster; starve it and the
   arms droop. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
    background-color: #0a0d12;
    color: #8fa1b6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

#scene { position: fixed; inset: 0; }
#scene canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* a fist's glyph: chapter I's throw, as the game's star machine draws it today */
.chip {
    display: flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 9999px;
    background: #2b3442; color: #dbe4f0;
    transition: background-color 120ms ease, color 120ms ease;
}
.chip svg { width: 13px; height: 13px; }
.chip.is-win { background: #d9a25f; color: #1e2733; }
/* the ring's throw: fainter, it is the house */
.chip.ring { width: 18px; height: 18px; background: rgba(43, 52, 66, 0.55); color: #7d8fa5; }
.chip.ring svg { width: 10px; height: 10px; }
.chip.ring .rt { display: none; line-height: 0; }
.chip.ring .rt.on { display: block; }
.chip.ring.beat { background: #3c4a5c; color: #dbe4f0; }
.chip.ring.lost { opacity: 0.35; }

.win { opacity: 0; color: #d9a25f; }
.win svg { width: 18px; height: 18px; fill: #d9a25f; }
.win.go { animation: win 760ms ease-out forwards; }
@keyframes win {
    0%   { opacity: 0; transform: translateY(6px) scale(0.4); }
    18%  { opacity: 1; transform: translateY(0) scale(1.25); }
    60%  { opacity: 1; transform: translateY(-10px) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(0.85); }
}

.chrome { position: fixed; z-index: 10; }

#feed { left: 72px; top: 50%; transform: translateY(-50%); width: 240px; }
.word { font-size: 10px; letter-spacing: 0.32em; color: #55637a; }
.row { display: flex; align-items: baseline; justify-content: space-between; }
.big { font-size: 34px; font-weight: 700; color: #dbe4f0; line-height: 1; }
.mid { font-size: 22px; font-weight: 700; color: #c3cfdd; line-height: 1; }
.unit { font-size: 11px; color: #5f6d80; letter-spacing: 0.08em; }

input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px; background: transparent; margin: 10px 0 0; cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 9999px; background: #1e2733; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 9999px; background: #1e2733; }
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 9999px; background: #d5dbe3; margin-top: -6px; border: 0;
}
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 9999px; background: #d5dbe3; border: 0; }

#tip {
    position: fixed; z-index: 30; pointer-events: none; opacity: 0;
    background-color: #2a3442; color: #dbe4f0; padding: 6px 12px; border-radius: 8px;
    font-size: 13px; white-space: nowrap; transition: opacity 0.15s;
}
#tip.on { opacity: 1; }

.chapter-mark { font-family: 'Bebas Neue', system-ui, sans-serif; letter-spacing: 0.06em; font-size: 22px; color: #394453; }

#fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 12px; color: #55637a; }
</style>
</head>
<body>

<div id="scene"></div>
<div id="labels"></div>
<div id="fallback" class="mono">this view needs WebGL</div>
<div id="tip" class="mono"></div>

<div class="chrome mono" id="feed">
    <div class="word">THE MACHINE</div>
    <div class="row" style="margin-top:22px;">
        <span class="word" style="color:#7d8fa5; letter-spacing:0.18em;">energy fed</span>
        <span class="mid" id="energy-val">40</span>
    </div>
    <input type="range" id="energy" min="0" max="100" value="40" aria-label="Energy fed">
    <div class="row" style="margin-top:30px;">
        <span class="big" id="games">0</span>
        <span class="unit">games a day</span>
    </div>
    <div class="row" style="margin-top:16px;">
        <span style="display:flex; align-items:center; gap:8px;">
            <span class="big" id="stars" style="color:#d9a25f;">0</span>
            <i data-lucide="star" style="width:18px;height:18px;color:#d9a25f;"></i>
        </span>
        <span class="unit">stars a day</span>
    </div>
</div>

<div class="chrome" style="left:72px; bottom:34px; display:flex; align-items:baseline; gap:12px;">
    <span class="chapter-mark">IV · THE DEEP</span>
    <span class="mono" style="font-size:11px; color:#2f3949;">the machine</span>
</div>
<div class="chrome mono" style="right:72px; bottom:34px; font-size:10px; color:#2f3949;">mockup 0.9</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const ROCK = 0x0a0d12;
const PLATE = 0xd5dbe3;
const LANE = 0x7b8595;
const JOINT = 0x5b6676;

const PLATE_W = 2.0, PLATE_H = 0.26;
const TOP = PLATE_H / 2;            // the plate's top face
const H0 = 0.58;                    // the shoulders, above the plate's centre
const R0 = 0.2;                     // and how far out from the axle
const L1 = 0.38, L2 = 0.34;         // upper arm, forearm
const RING_Y = H0 + 0.3;            // the ring on its mast
const D2R = Math.PI / 180;
const GLYPHS = ['gem', 'file-text', 'scissors'];      // rock, paper, scissors, as in chapter I

const host = document.getElementById('scene');
const labelHost = document.getElementById('labels');
const slider = document.getElementById('energy');
const tip = document.getElementById('tip');

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('fallback').style.display = 'flex'; }

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

if (renderer) {
    let W = window.innerWidth, H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.setClearColor(ROCK, 1);
    host.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer({ element: labelHost });
    labelRenderer.setSize(W, H);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ROCK);

    const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 100);
    camera.position.set(2.75, 2.05, 3.25);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-0.05, 0.4, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.minDistance = 1.6;
    controls.maxDistance = 9;
    controls.minPolarAngle = 0.3;
    controls.maxPolarAngle = 1.42;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.update();
    controls.addEventListener('start', function () { controls.autoRotate = false; });
    renderer.domElement.addEventListener('wheel', function () { controls.autoRotate = false; }, { passive: true });

    // the game's light: a soft fill and one lamp above, so the tops are brighter than the sides
    scene.add(new THREE.AmbientLight(0xffffff, 0.34));
    const lamp = new THREE.PointLight(0xffffff, 8.5, 0, 1.25);
    lamp.position.set(1.0, 4.0, 1.5);
    scene.add(lamp);

    const plateMat = new THREE.MeshLambertMaterial({ color: PLATE });
    const jointMat = new THREE.MeshLambertMaterial({ color: JOINT });
    const laneMat = new THREE.MeshBasicMaterial({ color: LANE });

    const machineParts = [];
    function add(mesh, parent, isMachine) {
        (parent || scene).add(mesh);
        if (isMachine) machineParts.push(mesh);
        return mesh;
    }

    // ---- the lid plate, and the ring lane cut round it ----
    add(new THREE.Mesh(new THREE.BoxGeometry(PLATE_W, PLATE_H, PLATE_W), plateMat));
    const R = 0.8, LW = 0.14, span = 2 * R + LW;
    [[0, -R, span, LW], [0, R, span, LW], [-R, 0, LW, span], [R, 0, LW, span]].forEach(function (c) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(c[2], 0.02, c[3]), laneMat);
        m.position.set(c[0], TOP + 0.002, c[1]);
        add(m);
    });
    // a lane in from each side, to the doors
    [[0, -(R + 1) / 2, LW, 1 - R], [(R + 1) / 2, 0, 1 - R, LW]].forEach(function (c) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(c[2], 0.02, c[3]), laneMat);
        m.position.set(c[0], TOP + 0.002, c[1]);
        add(m);
    });

    // ---- the flywheel, under the hub ----
    const axle = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.24, 16), jointMat), null, true);
    axle.position.y = TOP + 0.12;
    const fly = new THREE.Group();
    fly.position.y = TOP + 0.11;
    scene.add(fly);
    const rim = add(new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.032, 10, 64), plateMat), fly, true);
    rim.rotation.x = Math.PI / 2;
    for (let i = 0; i < 6; i++) {
        const sp = add(new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.022, 0.035), plateMat), fly, true);
        sp.rotation.y = i * Math.PI / 3;
        sp.position.set(Math.cos(i * Math.PI / 3) * 0.23, 0, -Math.sin(i * Math.PI / 3) * 0.23);
    }
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.05, 20), jointMat), fly, true);
    // a weight on the rim, so you can see it turn
    const weight = add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.07), jointMat), fly, true);
    weight.position.set(0.46, 0, 0);

    // ---- the hub ----
    const hub = add(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 0.36, 24), plateMat), null, true);
    hub.position.y = TOP + 0.31;
    const collar = add(new THREE.Mesh(new THREE.TorusGeometry(0.142, 0.02, 8, 32), jointMat), null, true);
    collar.rotation.x = Math.PI / 2;
    collar.position.y = H0 - 0.035;
    const cap = add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 0.04, 24), jointMat), null, true);
    cap.position.y = TOP + 0.51;

    // ---- the ring, on its mast ----
    const mast = add(new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, RING_Y - (TOP + 0.53), 8), jointMat), null, true);
    mast.position.y = (RING_Y + TOP + 0.53) / 2 - 0.01;
    const ring = add(new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.017, 10, 40), plateMat), null, true);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = RING_Y;
    // the ring's own throw, faint, inside it
    const ringChip = document.createElement('div');
    ringChip.className = 'chip ring';
    ringChip.innerHTML = GLYPHS.map(function (g, k) { return '<span class="rt" data-k="' + k + '"><i data-lucide="' + g + '"></i></span>'; }).join('');
    const ringObj = new CSS2DObject(ringChip);
    ringObj.position.set(0, RING_Y + 0.005, 0);
    scene.add(ringObj);

    // the stars a win throws up
    const stars = [];
    for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'win';
        el.innerHTML = '<i data-lucide="star"></i>';
        const o = new CSS2DObject(el);
        o.position.set(0, RING_Y + 0.2, 0);
        scene.add(o);
        stars.push(el);
    }
    let starNext = 0;
    function flashStar() {
        const el = stars[starNext++ % stars.length];
        el.classList.remove('go');
        void el.offsetWidth;
        el.classList.add('go');
    }

    // ---- the arms: a shoulder on the hub, an elbow, a fist with its glyph ----
    function makeArm(mats, withChip, glyph) {
        const base = new THREE.Group();
        const shoulder = new THREE.Group();
        shoulder.position.set(R0, H0, 0);
        base.add(shoulder);
        const sj = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.1, 16), mats.joint);
        sj.rotation.x = Math.PI / 2;
        shoulder.add(sj);
        const upper = new THREE.Mesh(new THREE.BoxGeometry(L1, 0.05, 0.06), mats.plate);
        upper.position.x = L1 / 2;
        shoulder.add(upper);
        const elbow = new THREE.Group();
        elbow.position.x = L1;
        shoulder.add(elbow);
        const ej = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.085, 14), mats.joint);
        ej.rotation.x = Math.PI / 2;
        elbow.add(ej);
        const fore = new THREE.Mesh(new THREE.BoxGeometry(L2, 0.042, 0.05), mats.plate);
        fore.position.x = L2 / 2;
        elbow.add(fore);
        const wrist = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.07, 12), mats.joint);
        wrist.rotation.x = Math.PI / 2;
        wrist.position.x = L2 - 0.035;
        elbow.add(wrist);
        const fist = new THREE.Mesh(new THREE.SphereGeometry(0.058, 18, 14), mats.plate);
        fist.position.x = L2 + 0.02;
        elbow.add(fist);
        let chip = null;
        if (withChip) {
            chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = '<i data-lucide="' + glyph + '"></i>';
            const o = new CSS2DObject(chip);
            o.position.set(L2 + 0.02, 0.0, 0);
            elbow.add(o);
            [sj, upper, ej, fore, wrist, fist].forEach(function (m) { machineParts.push(m); });
        }
        scene.add(base);
        return { base: base, shoulder: shoulder, elbow: elbow, chip: chip };
    }

    const arms = [], ghosts = [];
    const GHOSTS = 3;
    for (let i = 0; i < 3; i++) {
        const a = makeArm({ plate: plateMat, joint: jointMat }, true, GLYPHS[i]);
        const yaw = i * 2 * Math.PI / 3 + Math.PI / 6;
        a.base.rotation.y = yaw;
        arms.push(a);
        // the blur: the same arm a moment ago, fainter and fainter
        const gs = [];
        for (let k = 0; k < GHOSTS; k++) {
            const pm = new THREE.MeshLambertMaterial({ color: PLATE, transparent: true, opacity: 0, depthWrite: false });
            const jm = new THREE.MeshLambertMaterial({ color: JOINT, transparent: true, opacity: 0, depthWrite: false });
            const g = makeArm({ plate: pm, joint: jm }, false);
            g.base.rotation.y = yaw;
            g.mats = [pm, jm];
            gs.push(g);
        }
        ghosts.push(gs);
    }

    // ---- poses ----
    function ik(x, y) {
        const d2 = x * x + y * y;
        const c = Math.max(-1, Math.min(1, (d2 - L1 * L1 - L2 * L2) / (2 * L1 * L2)));
        const phi = Math.acos(c);
        const theta = Math.atan2(y, x) - Math.atan2(L2 * Math.sin(phi), L1 + L2 * Math.cos(phi));
        return [theta, phi];
    }
    // over the middle of the ring, a hair above it
    const HIT = ik(-R0 + 0.02, RING_Y + 0.07 - H0);

    let energy = 40;
    function rest(i, time) {
        const k = Math.sqrt(energy / 100);
        let th = (-24 + 30 * k) * D2R, ph = (-14 + 10 * k) * D2R;
        th += Math.sin(time * (0.5 + k) + i * 2.1) * (0.5 + 2.5 * k) * D2R;
        return [th, ph];
    }
    const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    const inOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const easeIn = (t) => t * t * t;
    function pose(i, gc, time) {
        const g = Math.floor(gc), p = gc - g;
        const r = rest(i, time);
        if (gc <= 0 || ((g % 3) + 3) % 3 !== i) return r;
        const wind = [r[0] - 12 * D2R, r[1] - 26 * D2R];
        if (p < 0.22) return mix(r, wind, inOut(p / 0.22));
        if (p < 0.48) return mix(wind, HIT, easeIn((p - 0.22) / 0.26));
        if (p < 0.62) {
            const b = Math.sin((p - 0.48) / 0.14 * Math.PI) * 4 * D2R;
            return [HIT[0] + b, HIT[1] - b * 0.6];
        }
        return mix(HIT, r, inOut((p - 0.62) / 0.38));
    }
    function apply(a, ps) { a.shoulder.rotation.z = ps[0]; a.elbow.rotation.z = ps[1]; }

    // ---- what energy buys: a game every so many seconds, and the day's numbers ----
    const period = (e) => (e <= 0 ? Infinity : 6 * Math.pow(0.04, e / 100));
    const gamesADay = (e) => (e <= 0 ? 0 : Math.round(Math.pow(e, 1.5) * 0.9));
    const fmt = (n) => n.toLocaleString('en-US').replace(/,/g, ' ');
    const elGames = document.getElementById('games');
    const elStars = document.getElementById('stars');
    const elVal = document.getElementById('energy-val');
    let shownGames = 0, shownStars = 0;
    function setEnergy(v) {
        energy = v;
        elVal.textContent = String(v);
    }
    slider.addEventListener('input', function () { setEnergy(Number(slider.value)); });
    setEnergy(Number(slider.value));

    // ---- the games ----
    const rnd = mulberry32(20261002);
    let gc = 0;                       // the game clock: whole numbers are games
    let resolved = -1;                // the last game whose throw has landed
    let current = -1;                 // the game the ring has thrown for
    let ringThrow = 0;
    function newGame(g) {
        ringThrow = Math.floor(rnd() * 3);
        ringChip.querySelectorAll('.rt').forEach(function (el) { el.classList.toggle('on', Number(el.dataset.k) === ringThrow); });
        ringChip.classList.remove('beat', 'lost');
        arms.forEach(function (a) { a.chip.classList.remove('is-win'); });
    }
    function land(g) {
        const i = ((g % 3) + 3) % 3;
        const d = (i - ringThrow + 3) % 3;          // 1: the arm wins, 2: the ring wins, 0: a draw
        if (d === 1) {
            arms[i].chip.classList.add('is-win');
            ringChip.classList.add('lost');
            flashStar();
        } else if (d === 2) {
            ringChip.classList.add('beat');
        }
    }

    // ---- hover: the machine says what it is ----
    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoverXY = null;
    renderer.domElement.addEventListener('pointermove', function (e) {
        hoverXY = [e.clientX, e.clientY];
        mouse.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1);
    });
    renderer.domElement.addEventListener('pointerleave', function () { hoverXY = null; });
    function updateTip() {
        if (!hoverXY) { tip.classList.remove('on'); return; }
        ray.setFromCamera(mouse, camera);
        const hit = ray.intersectObjects(machineParts, false)[0];
        if (hit) {
            tip.textContent = 'The machine plays. ' + energy + ' energy a day. Each win is a star.';
            tip.style.left = (hoverXY[0] + 16) + 'px';
            tip.style.top = (hoverXY[1] + 14) + 'px';
            tip.classList.add('on');
        } else {
            tip.classList.remove('on');
        }
    }

    const clock = new THREE.Clock();
    let time = 0;
    function frame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        time += dt;

        // the clock runs on energy; starved, the game in hand is finished slowly and then it stops
        const T = period(energy);
        let rate = isFinite(T) ? 1 / T : 0;
        if (!rate && gc > Math.floor(gc)) rate = 1 / 4;
        const before = gc;
        gc += rate * dt;
        if (!isFinite(T) && Math.floor(gc) > Math.floor(before)) gc = Math.floor(gc);
        // a new game starts at every whole number; its throw lands just before the middle
        const g = Math.floor(gc), p = gc - g;
        if (g !== current) { current = g; newGame(g); }
        if (p >= 0.48 && resolved !== g && gc > 0) { resolved = g; land(g); }

        // the arms, and their blur when the machine runs hot
        const blur = Math.max(0, Math.min(1, (1.0 - T) / 0.7));
        for (let i = 0; i < 3; i++) {
            apply(arms[i], pose(i, gc, time));
            ghosts[i].forEach(function (gh, k) {
                const lag = (k + 1) * 0.055;
                apply(gh, pose(i, gc - lag, time - lag * (isFinite(T) ? T : 1)));
                const o = blur * [0.34, 0.2, 0.1][k];
                gh.mats[0].opacity = o; gh.mats[1].opacity = o;
                gh.base.visible = o > 0.01;
            });
        }

        // the flywheel turns with what it is fed
        fly.rotation.y -= (energy <= 0 ? 0.08 : 0.9 + energy * 0.22) * dt;

        // the numbers climb to where the energy puts them
        const tg = gamesADay(energy), ts = Math.round(tg / 3);
        shownGames += (tg - shownGames) * Math.min(1, dt * 6);
        shownStars += (ts - shownStars) * Math.min(1, dt * 6);
        elGames.textContent = fmt(Math.round(shownGames));
        elStars.textContent = fmt(Math.round(shownStars));

        controls.update();
        updateTip();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        requestAnimationFrame(frame);
    }

    // the labels join the page on the first render; draw their glyphs after that
    frame();
    lucide.createIcons();

    window.addEventListener('resize', function () {
        W = window.innerWidth; H = window.innerHeight;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        renderer.setSize(W, H);
        labelRenderer.setSize(W, H);
    });
}
</script>
</body>
</html>
