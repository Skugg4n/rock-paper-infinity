/* Mockup 8 of the chapter IV board. Mockup 7, with two changes:
   every plate now grows its own map from a seed of its floor and its position,
   so no two plates are alike: a ring around the room, side lanes cut toward the
   edge, and three to seven houses of different sizes standing beside the lanes
   with a short stub to each door. And the shaft is entered on foot: a lane runs
   from the ring in to an opening in the wall, and the people walk in, vanish,
   and walk out of an opening on another floor at the same pace.

   TWO COLOURS:
     rock   #0f141b   the background, the lanes and houses cut into the slabs,
                      the well in the hatch, the openings in the shaft wall
     plate  #1e2733   every slab, every bridge, the shaft, the hatch rim
   One lamp hangs near the way in, so the light falls off with depth. No textures,
   no fog, no gradients, no third colour. The people carry the only other light.
   Every number is by hand. No game logic. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    background-color: #0f141b;
    color: #8fa1b6;

}
.mono {

    font-variant-numeric: tabular-nums;
}

/* the model fills the window; nothing is framed */
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* ---- labels anchored to plates ------------------------------------------ */

.lbl-in {

    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9fb0c4;

}
.lbl-in .lvl {

}
.lbl-in .auto { position: absolute; right: 3px; top: 3px; color: #64748b; }
.dig-ring { animation: dig 9s ease-in-out infinite alternate; }
@keyframes dig { from { stroke-dashoffset: 46; } to { stroke-dashoffset: 38; } }
.ring-base { stroke: #2a3442; }
.ring-fg { transform: rotate(-90deg); transform-origin: 50% 50%; }

/* ---- chrome, floating straight on the model ------------------------------ */
.chrome { position: fixed; z-index: 10; }

.btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    padding: 0.75rem;
    border-radius: 9999px;
    background-color: #1e2733;
    color: #aab8c9;
    transition: all 0.2s ease-in-out;
    cursor: pointer;
    border: 0;
    flex: 0 0 auto;
}
.btn:hover { transform: translateY(-2px); }
.btn.is-locked { opacity: 0.3; cursor: default; }
.btn.is-locked:hover { transform: none; }
.btn-col {
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}
/* the way back to the view we started from, offered only once it is needed */
#reset-view {
    margin-top: 22px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease, transform 0.2s ease-in-out;
}
#reset-view.is-on { opacity: 0.75; pointer-events: auto; }
#reset-view.is-on:hover { opacity: 1; }

.bar { position: relative; width: 24px; }
.track {
    width: 24px;
    height: 160px;
    border-radius: 9999px;

    overflow: hidden;

}

    height: 8px;

}
.col-head { font-size: 12px; color: #93a3b8; width: 24px; text-align: center; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const ROCK = 0x0f141b;
const PLATE = 0x1e2733;
const PEOPLE = 0xdbe4f0;

const PITCH = 2.6;        // cell to cell
const PLATE_W = 2.0;      // a slab is this wide, so the street between two is 0.6
const PLATE_H = 0.26;     // and this thin
const FLOOR_GAP = 3.2;
const SHAFT_R = 0.52;
const WALK_Y = 0.17;      // the people walk just above the lanes
const LANE_W = 0.14;      // a lane is this wide
const SIDE_W = 0.10;      // a side lane is narrower
const STUB_W = 0.07;      // and the stub to a door narrower still
const R_ROOM = 0.55;      // the ring runs at this radius around a room
const R_HUB = 0.80;       // wider on a landing, so it clears the shaft and the hatch
const EDGE = 0.97;        // nothing is cut closer than this to the slab's edge

/* Five floors: the first is the one they have had longest, and each one below
   is thinner. The last is a single landing with the next chamber being dug,
   at the bottom of the shaft. */
const FLOORS = [
    { cells: [
        { x: 0, z: 0, lid: true },
        { x: 0, z: -1, room: 'pickaxe', lvl: 2 },
        { x: -1, z: 0, room: 'sprout', lvl: 1, auto: true },
        { x: 0, z: 1, room: 'bed', lvl: 1 },
        { x: 1, z: 0, room: 'zap', lvl: 2 },
        { x: 2, z: 0, room: 'zap', lvl: 1 },
        { x: 3, z: 0, room: 'zap', lvl: 1 }
    ], people: 26 },
    { cells: [
        { x: 0, z: 0, landing: true },
        { x: 0, z: -1, room: 'snowflake', lvl: 1 },
        { x: -1, z: 0, room: 'pickaxe', lvl: 1 },
        { x: 1, z: 0, room: 'zap', lvl: 1 },
        { x: 0, z: 1, room: 'sprout', lvl: 1, auto: true }
    ], people: 16 },
    { cells: [
        { x: 0, z: 0, landing: true },
        { x: 0, z: -1, room: 'pickaxe', lvl: 1 },
        { x: -1, z: 0, room: 'bed', lvl: 1 },
        { x: 1, z: 0, room: 'zap', lvl: 1 }
    ], people: 10 },
    { cells: [
        { x: 0, z: 0, landing: true },
        { x: 0, z: -1, room: 'pickaxe', lvl: 1 },
        { x: 1, z: 0, room: 'sprout', lvl: 1 }
    ], people: 5 },
    { cells: [
        { x: 0, z: 0, landing: true, dig: true }
    ], people: 0 }
];
FLOORS.forEach(function (f, i) { f.y = -i * FLOOR_GAP; });
const BOTTOM = FLOORS[FLOORS.length - 1].y;

// sides of the ring: 0 north, 1 east, 2 south, 3 west
const SIDE_OUT = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const SIDE_ALONG = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const DIR_SIDE = { '0,-1': 0, '1,0': 1, '0,1': 2, '-1,0': 3 };
// how big a house can be: width along the lane, depth away from it
const HOUSE = [
    [0.16, 0.16], [0.26, 0.18], [0.40, 0.14], [0.20, 0.24],
    [0.32, 0.22], [0.14, 0.22], [0.46, 0.13], [0.22, 0.20]
];

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
// a plate's map is grown from where it is, so it is the same on every reload
// and different from every other plate
function plateSeed(fi, x, z) {
    return mulberry32(((fi + 1) * 73856093 ^ (x + 9) * 19349663 ^ (z + 9) * 83492791) >>> 0);
}

const host = document.getElementById('scene');
const labelHost = document.getElementById('labels');

let renderer;
try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
    document.getElementById('fallback').style.display = 'flex';
}

if (renderer) {
    let W = window.innerWidth, H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.setClearColor(ROCK, 1);
    host.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer({ element: labelHost });
    labelRenderer.setSize(W, H);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ROCK);

    const DEF_POS = new THREE.Vector3(12.5, 6.8, 17);
    const DEF_TGT = new THREE.Vector3(0.8, -4.6, 0);

    const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 400);
    camera.position.copy(DEF_POS);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(DEF_TGT);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = true;                 // right drag
    controls.mouseButtons = {
        LEFT: THREE.MOUSE.ROTATE,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.PAN
    };
    controls.enableZoom = true;
    controls.minDistance = 9;
    controls.maxDistance = 52;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;
    controls.minPolarAngle = 0.42;             // never straight above
    controls.maxPolarAngle = 1.33;             // never under the floors
    controls.update();

    const resetBtn = document.getElementById('reset-view');
    function tookHold() {
        controls.autoRotate = false;
        resetBtn.classList.add('is-on');
    }
    controls.addEventListener('start', tookHold);
    renderer.domElement.addEventListener('wheel', tookHold, { passive: true });

    let tween = null;
    resetBtn.addEventListener('click', function () {
        tween = { p: camera.position.clone(), t: controls.target.clone(), k: 0 };
    });

    // one lamp, hanging where they came in: everything below it falls away
    scene.add(new THREE.AmbientLight(0xffffff, 0.09));
    const lamp = new THREE.PointLight(0xffffff, 44, 0, 1.25);
    lamp.position.set(1.2, 8, 1.6);
    scene.add(lamp);

    const plateMat = new THREE.MeshLambertMaterial({ color: PLATE });
    const rockMat = new THREE.MeshLambertMaterial({ color: ROCK });

    const plateGeo = new THREE.BoxGeometry(PLATE_W, PLATE_H, PLATE_W);
    const solids = [];

    function addPlate(x, y, z) {
        const m = new THREE.Mesh(plateGeo, plateMat);
        m.position.set(x, y, z);
        scene.add(m);
        solids.push(m);
    }

    // a bridge is the floor itself, only narrower: same height, same thickness,
    // so a floor reads as one sharp slab and not as plates with sticks between
    const bridgeGeo = new THREE.BoxGeometry(PITCH - PLATE_W + 0.04, PLATE_H, 0.84);
    function addBridge(ax, az, bx, bz, y) {
        const m = new THREE.Mesh(bridgeGeo, plateMat);
        m.position.set((ax + bx) / 2 * PITCH, y, (az + bz) / 2 * PITCH);
        if (az !== bz) m.rotation.y = Math.PI / 2;
        scene.add(m);
        solids.push(m);
    }

    /* ---- what is cut into a slab ------------------------------------------
       Lanes and houses are cut in rock: the same rock as the background, seen
       through the slab, so the map costs no new colour. */
    const LANE_Y = PLATE_H / 2 + 0.012;
    function cut(cx, y, cz, w, d) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, d), rockMat);
        m.position.set(cx, y + LANE_Y, cz);
        scene.add(m);
    }

    // ---- the shaft: plate colour, and it is also the stairs ----
    const shaftH = -0.05 - BOTTOM;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(SHAFT_R, SHAFT_R, shaftH, 32), plateMat);
    shaft.position.set(0, BOTTOM + shaftH / 2, 0);
    scene.add(shaft);
    solids.push(shaft);

    // ---- labels ----
    const labels = [];
    function makeLabel(html, x, y, z) {
        const wrap = document.createElement('div');
        wrap.className = 'lbl';
        const inner = document.createElement('div');
        inner.className = 'lbl-in';
        inner.innerHTML = html;
        wrap.appendChild(inner);
        const obj = new CSS2DObject(wrap);
        obj.position.set(x, y, z);
        scene.add(obj);
        labels.push({ obj, inner });
    }

    /* ---- the walk graph ---------------------------------------------------
       Corners and junctions on every ring, a node in the middle of every
       bridge, a node at every door, and a node at every opening in the shaft
       wall. The people only ever stand on these. */
    const nodes = [];
    function addNode(x, y, z, kind, floor) {
        nodes.push({ p: new THREE.Vector3(x, y, z), adj: [], kind: kind, floor: floor });
        return nodes.length - 1;
    }
    function link(a, b) { nodes[a].adj.push(b); nodes[b].adj.push(a); }

    function sidePoint(s, t, r) {
        const o = SIDE_OUT[s], a = SIDE_ALONG[s];
        return [o[0] * r - a[0] * r + a[0] * 2 * r * t, o[1] * r - a[1] * r + a[1] * 2 * r * t];
    }
    function overlaps(box, list) {
        for (let i = 0; i < list.length; i++) {
            const b = list[i];
            if (box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1]) return true;
        }
        return false;
    }

    FLOORS.forEach(function (floor, fi) {
        const taken = new Map();
        floor.cells.forEach(function (c) { taken.set(c.x + ',' + c.z, c); });
        floor.doors = [];

        floor.cells.forEach(function (c) {
            const cx = c.x * PITCH, cz = c.z * PITCH, y = floor.y;
            const isHub = c.lid || c.landing;
            const r = isHub ? R_HUB : R_ROOM;
            const rnd = plateSeed(fi, c.x, c.z);
            addPlate(cx, y, cz);

            // the ring
            const span = 2 * r + LANE_W;
            cut(cx, y, cz - r, span, LANE_W);
            cut(cx, y, cz + r, span, LANE_W);
            cut(cx - r, y, cz, LANE_W, span);
            cut(cx + r, y, cz, LANE_W, span);

            // what is already spoken for on this slab
            // what a house may not be cut into. The ring is not in the list:
            // side lanes have to meet it, and a house always sits a stub clear
            // of it by construction.
            const blocked = [];
            const hasBridge = [0, 1, 2, 3].map(function (s) {
                const o = SIDE_OUT[s];
                return taken.has((c.x + o[0]) + ',' + (c.z + o[1]));
            });
            hasBridge.forEach(function (has, s) {
                if (!has) return;
                const o = SIDE_OUT[s];
                const a = (r + 1.0) / 2, h = (1.0 - r) / 2;
                blocked.push([
                    Math.min(o[0] * (a - h), o[0] * (a + h)) - (o[0] ? 0 : LANE_W),
                    Math.min(o[1] * (a - h), o[1] * (a + h)) - (o[1] ? 0 : LANE_W),
                    Math.max(o[0] * (a - h), o[0] * (a + h)) + (o[0] ? 0 : LANE_W),
                    Math.max(o[1] * (a - h), o[1] * (a + h)) + (o[1] ? 0 : LANE_W)
                ]);
            });

            // the ring's nodes: four corners, and whatever is spliced into a side
            const corner = [0, 1, 2, 3].map(function (s) {
                const p = sidePoint(s, 0, r);
                return addNode(cx + p[0], y + WALK_Y, cz + p[1], 'lane', fi);
            });
            const items = [[], [], [], []];
            const mid = [0, 1, 2, 3].map(function (s) {
                const p = sidePoint(s, 0.5, r);
                const n = addNode(cx + p[0], y + WALK_Y, cz + p[1], 'lane', fi);
                items[s].push({ t: 0.5, n: n });
                return n;
            });
            c.mid = mid;

            // side lanes: one or two little cross streets cut toward the edge
            const lanes = [];
            const nLanes = isHub ? 0 : (rnd() < 0.55 ? 2 : 1);
            for (let i = 0; i < nLanes; i++) {
                const s = Math.floor(rnd() * 4);
                const t = rnd() < 0.5 ? 0.14 + rnd() * 0.2 : 0.66 + rnd() * 0.2;
                const o = SIDE_OUT[s], a = SIDE_ALONG[s];
                const base = sidePoint(s, t, r);
                const out = 0.88;
                const len = out - r;
                const midR = (r + out) / 2;
                const box = [
                    Math.min(base[0], base[0] + o[0] * len) - SIDE_W,
                    Math.min(base[1], base[1] + o[1] * len) - SIDE_W,
                    Math.max(base[0], base[0] + o[0] * len) + SIDE_W,
                    Math.max(base[1], base[1] + o[1] * len) + SIDE_W
                ];
                if (overlaps(box, blocked)) continue;
                blocked.push(box);
                const mx = a[0] * (base[0] * a[0] + base[1] * a[1]) + o[0] * midR;
                const mz = a[1] * (base[0] * a[0] + base[1] * a[1]) + o[1] * midR;
                cut(cx + mx, y, cz + mz, o[0] ? len : SIDE_W, o[0] ? SIDE_W : len);
                const nb = addNode(cx + base[0], y + WALK_Y, cz + base[1], 'lane', fi);
                items[s].push({ t: t, n: nb });
                const ex = a[0] * (base[0] * a[0] + base[1] * a[1]) + o[0] * out;
                const ez = a[1] * (base[0] * a[0] + base[1] * a[1]) + o[1] * out;
                const ne = addNode(cx + ex, y + WALK_Y, cz + ez, 'lane', fi);
                link(nb, ne);
                lanes.push({ s: s, endR: out, ex: ex, ez: ez, node: ne, along: a, out: o });
            }

            // the houses: three to seven, each standing beside a lane with a
            // short stub to its door, never touching the lane itself
            const nHouses = isHub ? 0 : 3 + Math.floor(rnd() * 5);
            for (let i = 0; i < nHouses; i++) {
                for (let att = 0; att < 16; att++) {
                    const size = HOUSE[Math.floor(rnd() * HOUSE.length)];
                    const onLane = lanes.length && rnd() < 0.38;
                    let bx, bz, dir, along, gap, host = null;
                    if (onLane) {
                        const L = lanes[Math.floor(rnd() * lanes.length)];
                        const sign = rnd() < 0.5 ? 1 : -1;
                        const pick = 0.45 + rnd() * 0.5;   // how far out along the lane
                        const o = L.out, a = L.along;
                        const proj = (L.ex * a[0] + L.ez * a[1]);
                        const rr = r + (L.endR - r) * pick;
                        bx = a[0] * proj + o[0] * rr;
                        bz = a[1] * proj + o[1] * rr;
                        dir = [a[0] * sign, a[1] * sign];
                        along = o;
                        gap = SIDE_W / 2 + 0.09;
                        host = L.node;
                    } else {
                        const s = Math.floor(rnd() * 4);
                        const t = 0.1 + rnd() * 0.8;
                        const o = SIDE_OUT[s], a = SIDE_ALONG[s];
                        const p = sidePoint(s, t, r);
                        bx = p[0]; bz = p[1];
                        dir = o; along = a;
                        gap = LANE_W / 2 + 0.10;
                        var side = s, sideT = t;
                    }
                    const hw = size[0] / 2, hd = size[1] / 2;
                    const px = bx + dir[0] * (gap + hd);
                    const pz = bz + dir[1] * (gap + hd);
                    const ex = Math.abs(along[0]) * hw + Math.abs(dir[0]) * hd;
                    const ez = Math.abs(along[1]) * hw + Math.abs(dir[1]) * hd;
                    const box = [px - ex - 0.03, pz - ez - 0.03, px + ex + 0.03, pz + ez + 0.03];
                    if (Math.abs(px) + ex > EDGE || Math.abs(pz) + ez > EDGE) continue;
                    if (overlaps(box, blocked)) continue;
                    blocked.push(box);
                    // the house, and the stub from the lane to its door
                    cut(cx + px, y, cz + pz, 2 * ex, 2 * ez);
                    cut(cx + bx + dir[0] * gap / 2, y, cz + bz + dir[1] * gap / 2,
                        dir[0] ? gap : STUB_W, dir[0] ? STUB_W : gap);
                    const dn = addNode(cx + px - dir[0] * hd, y + WALK_Y,
                                       cz + pz - dir[1] * hd, 'spot', fi);
                    if (onLane) {
                        link(dn, host);
                    } else {
                        const bn = addNode(cx + bx, y + WALK_Y, cz + bz, 'lane', fi);
                        items[side].push({ t: sideT, n: bn });
                        link(bn, dn);
                    }
                    break;
                }
            }

            // chain every side: corner, then its items in order, then the next corner
            for (let s = 0; s < 4; s++) {
                items[s].sort(function (a, b) { return a.t - b.t; });
                let prev = corner[s];
                items[s].forEach(function (it) { link(prev, it.n); prev = it.n; });
                link(prev, corner[(s + 1) % 4]);
            }

            if (c.lid) {
                // the way in from chapter III, closed: a raised rim in plate, a
                // well of rock sunk inside it, and the bar laid across. The well
                // is also the head of the stairs down.
                const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.18, 32), plateMat);
                rim.position.set(0, y + PLATE_H / 2 + 0.04, 0);
                scene.add(rim);
                const well = new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.2, 32), rockMat);
                well.position.set(0, y + PLATE_H / 2 + 0.02, 0);
                scene.add(well);
                const bar = new THREE.Mesh(new THREE.BoxGeometry(1.34, 0.14, 0.24), plateMat);
                bar.position.set(0, y + PLATE_H / 2 + 0.14, 0);
                scene.add(bar);
                solids.push(rim, well, bar);
            } else if (c.dig) {
                makeLabel(
                    '<svg viewBox="0 0 40 40" style="width:34px;height:34px;">' +
                    '<circle class="ring-base" cx="20" cy="20" r="18" fill="none" stroke-width="2"></circle>' +
                    '<circle class="ring-fg dig-ring" cx="20" cy="20" r="18" fill="none" stroke-width="3" ' +
                    'stroke-dasharray="113" stroke-dashoffset="43" style="stroke:#7d8fa5;"></circle></svg>',
                    1.02, y + 0.42, 0
                );
            } else if (c.room) {
                let html = '<i data-lucide="' + c.room + '" class="w-7 h-7"></i>';
                html += '<span class="lvl mono">' + c.lvl + '</span>';
                if (c.auto) html += '<i data-lucide="repeat" class="auto w-3.5 h-3.5"></i>';
                makeLabel(html, cx, y + 0.45, cz);
            }

            /* the way into the shaft: on a landing, two or three lanes run from
               the ring straight in to an opening in the wall. Nobody takes the
               stairs anywhere else. */
            if (isHub) {
                const inner = c.lid ? 0.62 : SHAFT_R;      // the rim, or the wall
                const sides = [0, 1, 2, 3].filter(function () { return true; });
                const nDoors = 2 + (rnd() < 0.5 ? 1 : 0);
                const chosen = [];
                while (chosen.length < nDoors) {
                    const s = sides[Math.floor(rnd() * 4)];
                    if (chosen.indexOf(s) < 0) chosen.push(s);
                }
                chosen.forEach(function (s) {
                    const o = SIDE_OUT[s];
                    const from = r - LANE_W / 2, to = inner - 0.02;
                    const len = from - to;
                    const midR = (from + to) / 2;
                    cut(cx + o[0] * midR, y, cz + o[1] * midR,
                        o[0] ? len : SIDE_W, o[0] ? SIDE_W : len);
                    const dr = inner + 0.05;
                    const dn = addNode(cx + o[0] * dr, y + WALK_Y, cz + o[1] * dr, 'door', fi);
                    link(dn, c.mid[s]);
                    floor.doors.push(dn);
                    if (!c.lid) {
                        // a dark opening in the wall of the shaft
                        const op = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.34, 0.12), rockMat);
                        op.position.set(o[0] * (SHAFT_R - 0.05), y + PLATE_H / 2 + 0.17, o[1] * (SHAFT_R - 0.05));
                        if (o[0]) op.rotation.y = Math.PI / 2;
                        scene.add(op);
                    }
                });
            }
        });

        // bridges, and the lane that runs over them
        floor.cells.forEach(function (c) {
            const r = (c.lid || c.landing) ? R_HUB : R_ROOM;
            [[1, 0], [0, 1]].forEach(function (d) {
                const n = taken.get((c.x + d[0]) + ',' + (c.z + d[1]));
                if (!n) return;
                const nr = (n.lid || n.landing) ? R_HUB : R_ROOM;
                addBridge(c.x, c.z, n.x, n.z, floor.y);
                // the spur out of each slab, and the lane across the bridge
                const s1 = DIR_SIDE[d[0] + ',' + d[1]], s2 = DIR_SIDE[(-d[0]) + ',' + (-d[1])];
                const m1 = (r + 1.0) / 2, l1 = 1.0 - r;
                cut(c.x * PITCH + d[0] * m1, floor.y, c.z * PITCH + d[1] * m1,
                    d[0] ? l1 : LANE_W, d[0] ? LANE_W : l1);
                const m2 = (nr + 1.0) / 2, l2 = 1.0 - nr;
                cut(n.x * PITCH - d[0] * m2, floor.y, n.z * PITCH - d[1] * m2,
                    d[0] ? l2 : LANE_W, d[0] ? LANE_W : l2);
                cut((c.x + n.x) / 2 * PITCH, floor.y, (c.z + n.z) / 2 * PITCH,
                    d[0] ? PITCH - PLATE_W + 0.04 : LANE_W,
                    d[0] ? LANE_W : PITCH - PLATE_W + 0.04);
                if (c.auto || n.auto) return;
                const b = addNode((c.x + n.x) / 2 * PITCH, floor.y + WALK_Y,
                                  (c.z + n.z) / 2 * PITCH, 'lane', fi);
                link(b, c.mid[s1]);
                link(b, n.mid[s2]);
            });
        });
    });

    // an automated room is one nobody walks to: cut its slab off the network
    FLOORS.forEach(function (floor, fi) {
        floor.cells.forEach(function (c) {
            if (!c.auto) return;
            nodes.forEach(function (nd) {
                if (nd.floor !== fi) return;
                const dx = nd.p.x - c.x * PITCH, dz = nd.p.z - c.z * PITCH;
                if (Math.abs(dx) < 1.02 && Math.abs(dz) < 1.02) nd.adj.length = 0;
            });
            nodes.forEach(function (nd) {
                nd.adj = nd.adj.filter(function (i) {
                    const o = nodes[i];
                    return !(o.floor === fi &&
                             Math.abs(o.p.x - c.x * PITCH) < 1.02 &&
                             Math.abs(o.p.z - c.z * PITCH) < 1.02);
                });
            });
        });
    });

    // ---- the people: tiny points that keep to the lanes ----
    const rnd = mulberry32(20260921);
    const folk = [];
    FLOORS.forEach(function (floor, fi) {
        const mine = [];
        nodes.forEach(function (n, i) { if (n.floor === fi && n.adj.length) mine.push(i); });
        if (!mine.length) return;
        for (let i = 0; i < floor.people; i++) {
            const at = mine[Math.floor(rnd() * mine.length)];
            folk.push({
                floor: fi, at: at, prev: at, to: at, t: 1, len: 1,
                speed: 0.34 + rnd() * 0.3,
                state: 'walk', clock: 0, dur: 0,
                from3: new THREE.Vector3(), to3: new THREE.Vector3()
            });
        }
    });

    const pos = new Float32Array(folk.length * 3);
    const dots = new THREE.BufferGeometry();
    dots.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const people = new THREE.Points(dots, new THREE.PointsMaterial({ color: PEOPLE, size: 0.06 }));
    people.frustumCulled = false;
    scene.add(people);

    function chooseNext(p) {
        const adj = nodes[p.at].adj;
        if (!adj.length) return;
        let n = adj[Math.floor(rnd() * adj.length)];
        if (adj.length > 1 && n === p.prev && rnd() < 0.75) {
            n = adj[Math.floor(rnd() * adj.length)];
        }
        p.prev = p.at;
        p.to = n;
        p.t = 0;
        p.len = nodes[p.at].p.distanceTo(nodes[n].p);
    }

    function stepPerson(p, dt) {
        if (p.state === 'walk') {
            p.t += p.speed * dt / Math.max(0.12, p.len);
            if (p.t < 1) return;
            p.at = p.to;
            p.t = 1;
            const here = nodes[p.at];
            if (here.kind === 'spot' && rnd() < 0.8) {
                p.state = 'pause'; p.clock = 0; p.dur = 0.5 + rnd() * 2.2;
                return;
            }
            // at an opening in the shaft wall, most take the stairs
            if (here.kind === 'door' && rnd() < 0.8) {
                let next = p.floor + (rnd() < 0.72 ? 1 : -1);
                if (next < 0) next = 1;
                if (next >= FLOORS.length) next = p.floor - 1;
                if (next >= 0 && next !== p.floor && FLOORS[next].doors.length) {
                    p.next = next;
                    p.state = 'enter'; p.clock = 0;
                    p.from3.copy(here.p);
                    p.to3.set(0, FLOORS[p.floor].y - 0.2, 0);
                    p.dur = p.from3.distanceTo(p.to3) / p.speed;
                    return;
                }
            }
            chooseNext(p);
        } else if (p.state === 'pause') {
            p.clock += dt;
            if (p.clock >= p.dur) { p.state = 'walk'; chooseNext(p); }
        } else {
            p.clock += dt;
            if (p.clock < p.dur) return;
            if (p.state === 'enter') {
                // in the shaft now, and out of sight: they walk it at their own pace
                p.state = 'stairs'; p.clock = 0;
                p.from3.set(0, FLOORS[p.floor].y - 0.2, 0);
                p.to3.set(0, FLOORS[p.next].y - 0.2, 0);
                p.dur = p.from3.distanceTo(p.to3) / p.speed;
            } else if (p.state === 'stairs') {
                p.floor = p.next;
                const doors = FLOORS[p.floor].doors;
                p.at = doors[Math.floor(rnd() * doors.length)];
                p.prev = p.at;
                p.state = 'exit'; p.clock = 0;
                p.from3.set(0, FLOORS[p.floor].y - 0.2, 0);
                p.to3.copy(nodes[p.at].p);
                p.dur = p.from3.distanceTo(p.to3) / p.speed;
            } else {
                p.state = 'walk';
                chooseNext(p);
            }
        }
    }

    function personPosition(p, out) {
        if (p.state === 'walk') out.lerpVectors(nodes[p.prev].p, nodes[p.to].p, p.t);
        else if (p.state === 'pause') out.copy(nodes[p.at].p);
        else out.lerpVectors(p.from3, p.to3, Math.min(1, p.clock / p.dur));
    }

    // ---- labels: crisp, sized with the zoom, hidden when something is in front ----
    const ray = new THREE.Raycaster();
    const tmp = new THREE.Vector3();
    function updateLabels() {
        labels.forEach(function (l) {
            l.obj.getWorldPosition(tmp);
            const dist = camera.position.distanceTo(tmp);
            const s = Math.min(1.2, Math.max(0.4, 20 / dist));
            l.inner.style.transform = 'scale(' + s.toFixed(3) + ')';
            ray.set(camera.position, tmp.clone().sub(camera.position).normalize());
            const hit = ray.intersectObjects(solids, false)[0];
            l.inner.style.opacity = (hit && hit.distance < dist - 0.5) ? '0' : '1';
        });
    }

    function ease(k) { return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }

    const clock = new THREE.Clock();
    const p3 = new THREE.Vector3();
    function frame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        for (let i = 0; i < folk.length; i++) {
            stepPerson(folk[i], dt);
            personPosition(folk[i], p3);
            pos[i * 3] = p3.x; pos[i * 3 + 1] = p3.y; pos[i * 3 + 2] = p3.z;
        }
        dots.attributes.position.needsUpdate = true;

        if (tween) {
            tween.k = Math.min(1, tween.k + dt / 1.2);
            const k = ease(tween.k);
            camera.position.lerpVectors(tween.p, DEF_POS, k);
            controls.target.lerpVectors(tween.t, DEF_TGT, k);
            if (tween.k >= 1) { tween = null; resetBtn.classList.remove('is-on'); }
        }

        controls.update();
        updateLabels();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        requestAnimationFrame(frame);
    }
    frame();

    window.addEventListener('resize', function () {
        W = window.innerWidth; H = window.innerHeight;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        renderer.setSize(W, H);
        labelRenderer.setSize(W, H);
    });

    lucide.createIcons();
}
</script>
</body>
</html>
