}

function cost(id, lvl) {

        case 'drill': case 'farm': case 'gen': return [1.0e4, 2.4e6, 1.2e8, 2.0e10][lvl];

        case 'hydro': return 2.0e7;
        case 'watchdog': return 2.0e4; case 'scheduler': return 8.0e4; case 'nightvis': return 3.0e5;

const PARENT = {};
T.forEach(function (t) { PARENT[t[1]] = t[0]; });

const TAGS = [
    ['EXTRACTION', 470, 24, 'middle'],
    ['HABITAT', 108, 199, 'end'],
    ['CULTURE', 108, 434, 'end'],
    ['POWER', 882, 374, 'start'],

/* ---------------------------------------------------------------- the three states
   [level, what the next level is: 'buy' can be bought now, 'lock' cannot yet, 'max' done,
    Surface's ring: 'o' hollow (not ours to open), 'f' filled (Surface opened it)] */
function fill(obj, ids, v) { ids.forEach(function (k) { obj[k] = v; }); }
const STATE = {};
STATE.a = {
    root: [1, 'max'],
    seam: [3, 'buy'], drill: [1, 'lock'], deepseam: [0, 'lock'],
    yield: [2, 'buy'], farm: [1, 'lock'], hydro: [0, 'lock'],

    quiet: [0, 'lock', 'o'], lossless: [0, 'lock', 'o'], cold: [0, 'lock', 'o'],

};

/* ---------------------------------------------------------------- svg helpers */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function text(x, y, s, o) {
    o = o || {};
    return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || 'start') + '" fill="' + (o.c || PL) +
        '" font-size="' + (o.s || 10) + '"' + (o.ls ? ' letter-spacing="' + o.ls + '"' : '') +
        (o.w ? ' font-weight="' + o.w + '"' : '') + (o.op !== undefined ? ' opacity="' + o.op + '"' : '') +
        '>' + esc(s) + '</text>';
}
function poly(pts) { return 'M ' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L '); }
function bez(b, t) {
    const u = 1 - t;
    return [
        u * u * u * b[0][0] + 3 * u * u * t * b[1][0] + 3 * u * t * t * b[2][0] + t * t * t * b[3][0],
        u * u * u * b[0][1] + 3 * u * u * t * b[1][1] + 3 * u * t * t * b[2][1] + t * t * t * b[3][1]
    ];
}
function bezD(b, t) {
    const u = 1 - t;

    for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ' C ' + c1[0].toFixed(1) + ' ' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ' ' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d + ' Z';
}

/* the mass: everything below and right of the question, spilling past the board's edge */
/* its edge runs down the middle of the question and of the relay: half of each is taken */
const MASS = 'M 612 516 C 640 504 690 500 712 499 C 719 486 719 470 722 457 C 762 448 822 470 862 452 ' +
    'C 905 436 924 392 948 360 C 970 330 1012 326 1030 356 C 1048 390 1052 440 1072 470 ' +
    'L 1075 800 L 560 800 C 538 752 520 706 538 662 C 552 630 578 604 598 584 C 610 570 613 548 612 516 Z';

function tissue(sid) {
    let h = '';
    const clip = 'mass-' + sid;
    h += '<defs><clipPath id="' + clip + '"><path d="' + MASS + '"/></clipPath></defs>';

    // tendrils first, so the mass covers their roots
    const tendrils = [
        // along the copper, back toward the colony: the trace from the root to the question
        [[[590, 520], [560, 505], [520, 492], [516, 432]], 11, 2.5, 7],
        // round Cryo I
        [[[575, 610], [545, 640], [500, 628], [462, 600]], 14, 4, 11],
        [[[560, 650], [530, 668], [495, 655], [470, 612]], 7, 2, 12],
        // up to the machine's feed
        [[[908, 436], [902, 408], [882, 384], [852, 374]], 13, 4, 13],
        // over the edge of the board, to the right
        [[[1040, 380], [1060, 360], [1070, 330], [1078, 300]], 12, 3, 14],
        // out of the bottom edge toward Cryo I's row
        [[[600, 760], [560, 770], [520, 760], [480, 745]], 10, 2.5, 15]
    ];
    tendrils.forEach(function (t) { h += tubeSvg(t[0], t[1], t[2], t[3], {}); });

    h += patchesSvg(sid, [0, 1]);
    return h + massSvg(sid, clip);
}
/* growth over the old square nodes: centre, radii, the side the tissue comes from */
const PATCHES = [[466, 588, 12, 17, 0, 21, [1, 0.3]], [847, 371, 13, 17, 0, 22, [1, 0.6]]];
function patchesSvg(sid, which) {
    let h = '';
    which.forEach(function (i) {
        const p = PATCHES[i];
        const d = blobPath(p[0], p[1], p[2], p[3], p[4], p[5], 8);
        const pid = 'patch-' + sid + '-' + i;
        h += '<defs><clipPath id="' + pid + '"><path d="' + d + '"/></clipPath></defs>';
        h += '<path d="' + d + '" fill="url(#gMass)"/>';
        h += '<g clip-path="url(#' + pid + ')">';
        // ribs in rings round the side the tissue comes from, as in the mass
        const ox = p[0] + p[6][0] * 40, oy = p[1] + p[6][1] * 40;
        for (let rr = 8; rr < 80; rr += 5) {
            h += '<circle cx="' + ox + '" cy="' + oy + '" r="' + rr + '" fill="none" stroke="#0f0908" stroke-width="2" opacity="0.55"/>';
            h += '<circle cx="' + (ox - 1.3) + '" cy="' + (oy - 1.3) + '" r="' + rr + '" fill="none" stroke="#a88c7c" stroke-width="0.7" opacity="0.2"/>';
        }
        h += '<path d="' + d + '" fill="none" stroke="#0c0706" stroke-width="6" opacity="0.5"/>';
        h += '</g>';
        h += '<path d="' + d + '" fill="none" stroke="#8d7062" stroke-width="0.8" opacity="0.7"/>';
    });
    return h;
}
function massSvg(sid, clip) {
    let h = '';
    // capillaries creeping out over the board
    const r = rng(9090);
    const starts = [[585, 505, -2.6], [640, 462, -1.9], [700, 456, -1.6], [760, 478, -1.4], [905, 430, -1.2],
                    [1000, 336, -1.9], [548, 640, 3.0], [540, 700, 2.8], [950, 360, -2.3], [820, 470, -1.7]];
    starts.forEach(function (s0) {
        let x = s0[0], y = s0[1], a = s0[2];
        const pts = [[x, y]];
        const steps = 7 + Math.floor(r() * 6);
        for (let i = 0; i < steps; i++) {
            a += (r() - 0.5) * 0.9;
            x += Math.cos(a) * 7; y += Math.sin(a) * 7;
            pts.push([x, y]);
        }
        h += '<path d="' + poly(pts.slice(0, 6)) + '" fill="none" stroke="#8a6a5f" stroke-width="1.3" opacity="0.7" stroke-linecap="round"/>';
        h += '<path d="' + poly(pts.slice(5)) + '" fill="none" stroke="#8a6a5f" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>';
        // and one branch
        const m = pts[3];
        let bx = m[0], by = m[1], ba = a + (r() < 0.5 ? 0.9 : -0.9);
        const bp = [[bx, by]];
        for (let i = 0; i < 4; i++) { ba += (r() - 0.5) * 0.7; bx += Math.cos(ba) * 6; by += Math.sin(ba) * 6; bp.push([bx, by]); }
        h += '<path d="' + poly(bp) + '" fill="none" stroke="#8a6a5f" stroke-width="0.6" opacity="0.45" stroke-linecap="round"/>';
    });

    // the mass, breathing
    h += '<g class="breathe">';
    h += '<path d="' + MASS + '" fill="url(#gMass)"/>';
    h += '<g clip-path="url(#' + clip + ')">';
    // ribbed walls: arcs fanning from the far corner, each with a lit lip
    for (let rr = 30; rr < 680; rr += 9) {
        const cx = 1085, cy = 815, rx = rr * 1.18, ry = rr * 0.82;
        const d = 'M ' + (cx - rx) + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 0 1 ' + cx + ' ' + (cy - ry);
        h += '<path d="' + d + '" fill="none" stroke="#0f0908" stroke-width="' + (2.4 + 1.4 * Math.sin(rr * 0.09)).toFixed(2) + '" opacity="0.5"/>';
        h += '<path d="' + d + '" fill="none" stroke="#a88c7c" stroke-width="0.8" opacity="0.16" transform="translate(-1.6,-1.6)"/>';
    }
    // tubes running inside the wall, unlit
    h += tubeSvg([[575, 780], [640, 700], [700, 790], [790, 760]], 9, 6, 31, { dim: 1 });
    h += tubeSvg([[640, 520], [700, 540], [760, 500], [840, 498]], 6, 5, 32, { dim: 1 });
    h += tubeSvg([[1065, 470], [1010, 520], [1040, 600], [1068, 640]], 10, 8, 33, { dim: 1 });
    // the spine: vertebrae down a curve and off the board
    const spine = [[700, 640], [655, 672], [600, 712], [592, 805]];
    const samples = [];
    for (let i = 0; i <= 400; i++) samples.push(bez(spine, i / 400));
    let acc = 0, last = samples[0], k = 0;
    for (let i = 1; i < samples.length; i++) {
        acc += Math.hypot(samples[i][0] - last[0], samples[i][1] - last[1]);
        last = samples[i];
        const sc = 0.82 - (i / 400) * 0.3;
        if (acc >= 15 * sc + 2) {
            acc = 0; k++;
            const d = bezD(spine, i / 400);
            const ang = Math.atan2(d[1], d[0]) * 180 / Math.PI;
            h += '<use href="#vert" x="-22" y="-22" width="44" height="44" transform="translate(' + samples[i][0].toFixed(1) + ',' + samples[i][1].toFixed(1) + ') rotate(' + ang.toFixed(1) + ') scale(' + sc.toFixed(2) + ')" opacity="0.92"/>';
        }
    }
    // a wet shadow just inside the rim
    h += '<path d="' + MASS + '" fill="none" stroke="#0c0706" stroke-width="10" opacity="0.55"/>';
    h += '</g>';
    h += '<path d="' + MASS + '" fill="none" stroke="#8d7062" stroke-width="1.6"/>';
    h += '<path d="' + MASS + '" fill="none" stroke="#e2cdb8" stroke-width="0.6" opacity="0.4" transform="translate(-0.8,-0.8)"/>';
    h += '</g>';
    return h;
}

/* the bought and the open vessels between the cells, with their pulse */
function vessels() {
    let h = '';
    VESSELS.forEach(function (v, i) {
        const dim = !v[5] && (BIO[v[1]].sf === 'o' || v[1] === 'substrate');
        h += tubeSvg(v[2], v[3], v[4], 41 + i * 7, { pulse: !!v[5], dim: dim });
    });
    return h;
}

function bioCell(sid, id) {
    const b = BIO[id];
    const x = b.x, y = b.y, r = b.r;
    const live = b.lvl > 0, open = b.buy, locked = !live && !open;
    const grad = live ? 'gBone' : open ? 'gBoneMid' : 'gBoneDim';
    let h = '<g class="node" data-id="' + id + '"' + (locked ? ' opacity="0.72"' : '') + '>';
    const cid = 'cell-' + sid + '-' + id;
    if (b.kind === 'vat') {
        // a vat: a ribbed capsule standing on end, something curled inside it
        const w = r * 1.35, hgt = r * 2.3;
        const d = 'M ' + (x - w / 2) + ' ' + (y - hgt / 2 + w / 2) + ' A ' + (w / 2) + ' ' + (w / 2) + ' 0 0 1 ' + (x + w / 2) + ' ' + (y - hgt / 2 + w / 2) +
                  ' L ' + (x + w / 2) + ' ' + (y + hgt / 2 - w / 2) + ' A ' + (w / 2) + ' ' + (w / 2) + ' 0 0 1 ' + (x - w / 2) + ' ' + (y + hgt / 2 - w / 2) + ' Z';
        h += '<defs><clipPath id="' + cid + '"><path d="' + d + '"/></clipPath></defs>';
        h += '<path d="' + d + '" fill="url(#gVat)" stroke="#1a110f" stroke-width="1.4"/>';
        h += '<g clip-path="url(#' + cid + ')">';
        // the curled one
        h += '<path d="M ' + (x + 2) + ' ' + (y - 6) + ' C ' + (x + 10) + ' ' + (y - 2) + ' ' + (x + 8) + ' ' + (y + 12) + ' ' + (x - 1) + ' ' + (y + 11) +
             ' C ' + (x - 8) + ' ' + (y + 10) + ' ' + (x - 7) + ' ' + (y + 2) + ' ' + (x - 3) + ' ' + (y + 1) + '" fill="none" stroke="#d9c6ae" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>';
        h += '<circle cx="' + (x - 1) + '" cy="' + (y - 9) + '" r="4.2" fill="#d9c6ae" opacity="0.5"/>';
        for (let k = -6; k <= 6; k++) {
            h += '<path d="M ' + (x - w) + ' ' + (y + k * 4) + ' Q ' + x + ' ' + (y + k * 4 + 3) + ' ' + (x + w) + ' ' + (y + k * 4) + '" fill="none" stroke="#120b09" stroke-width="0.9" opacity="0.55"/>';
        }
        h += '<rect x="' + (x - w / 2 + 3) + '" y="' + (y - hgt / 2 + 4) + '" width="2.2" height="' + (hgt - 10) + '" fill="#ffffff" opacity="0.22"/>';
        h += '</g>';
        // bone collars top and bottom
        h += '<ellipse cx="' + x + '" cy="' + (y - hgt / 2 + 3) + '" rx="' + (w / 2 + 3) + '" ry="3.4" fill="url(#gBone)" stroke="#1a110f" stroke-width="0.8"/>';
        h += '<ellipse cx="' + x + '" cy="' + (y + hgt / 2 - 3) + '" rx="' + (w / 2 + 3) + '" ry="3.4" fill="url(#gBone)" stroke="#1a110f" stroke-width="0.8"/>';
    } else {
        // the processes, mirrored: a vertebra seen from the front
        const L = function (sx) {
            return 'M ' + (x + sx * r * 0.72) + ' ' + (y - r * 0.18) +
                ' C ' + (x + sx * r * 1.25) + ' ' + (y - r * 0.6) + ' ' + (x + sx * r * 1.55) + ' ' + (y - r * 0.4) + ' ' + (x + sx * r * 1.95) + ' ' + (y - r * 1.0) +
                ' C ' + (x + sx * r * 1.55) + ' ' + (y - r * 0.05) + ' ' + (x + sx * r * 1.25) + ' ' + (y + r * 0.32) + ' ' + (x + sx * r * 0.76) + ' ' + (y + r * 0.36) + ' Z';
        };
        const lower = function (sx) {
            return 'M ' + (x + sx * r * 0.35) + ' ' + (y + r * 0.78) +
                ' C ' + (x + sx * r * 0.5) + ' ' + (y + r * 1.2) + ' ' + (x + sx * r * 0.62) + ' ' + (y + r * 1.32) + ' ' + (x + sx * r * 0.82) + ' ' + (y + r * 1.42) +
                ' C ' + (x + sx * r * 0.6) + ' ' + (y + r * 1.1) + ' ' + (x + sx * r * 0.62) + ' ' + (y + r * 0.9) + ' ' + (x + sx * r * 0.6) + ' ' + (y + r * 0.62) + ' Z';
        };
        [-1, 1].forEach(function (sx) {
            h += '<path d="' + L(sx) + '" fill="url(#gProc)" stroke="#170f0d" stroke-width="0.9"/>';
            h += '<path d="' + lower(sx) + '" fill="url(#gProc)" stroke="#170f0d" stroke-width="0.8"/>';
        });
        if (b.kind === 'core') {
            // a ribbed collar round the core
            h += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + (r * 1.32) + '" ry="' + (r * 1.12) + '" fill="none" stroke="#2a1c18" stroke-width="7"/>';
            h += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + (r * 1.32) + '" ry="' + (r * 1.12) + '" fill="none" stroke="#a88c78" stroke-width="5" stroke-dasharray="1.6 3.2" opacity="0.8"/>';
        }
        h += '<defs><clipPath id="' + cid + '"><ellipse cx="' + x + '" cy="' + y + '" rx="' + r + '" ry="' + (r * 0.9) + '"/></clipPath></defs>';
        h += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + r + '" ry="' + (r * 0.9) + '" fill="url(#' + grad + ')" stroke="#1d1310" stroke-width="1.3"/>';
        h += '<g clip-path="url(#' + cid + ')">';
        for (let k = -4; k <= 4; k++) {
            const yy = y + k * r * 0.2;
            h += '<path d="M ' + (x - r) + ' ' + yy.toFixed(1) + ' Q ' + x + ' ' + (yy + r * 0.16).toFixed(1) + ' ' + (x + r) + ' ' + yy.toFixed(1) + '" fill="none" stroke="#2c1d18" stroke-width="1.1" opacity="0.5"/>';
            h += '<path d="M ' + (x - r) + ' ' + (yy - 1.2).toFixed(1) + ' Q ' + x + ' ' + (yy + r * 0.16 - 1.2).toFixed(1) + ' ' + (x + r) + ' ' + (yy - 1.2).toFixed(1) + '" fill="none" stroke="#f2e6d6" stroke-width="0.6" opacity="0.22"/>';
        }
        h += '</g>';
        // the slit, and what glows in it when it lives
        const slit = 'M ' + x + ' ' + (y - r * 0.6) + ' Q ' + (x + r * 0.2) + ' ' + y + ' ' + x + ' ' + (y + r * 0.6) + ' Q ' + (x - r * 0.2) + ' ' + y + ' ' + x + ' ' + (y - r * 0.6) + ' Z';
        h += '<path d="' + slit + '" fill="#120a09" stroke="#e3d2bc" stroke-width="0.7" opacity="0.9"/>';
        if (live) h += '<path class="slit-glow" d="' + slit + '" fill="url(#gSlit)" style="animation-delay:-' + (r % 4) + 's"/>';
        h += '<ellipse cx="' + (x - r * 0.38) + '" cy="' + (y - r * 0.46) + '" rx="' + (r * 0.26) + '" ry="' + (r * 0.11) + '" transform="rotate(-24 ' + (x - r * 0.38) + ' ' + (y - r * 0.46) + ')" fill="#ffffff" opacity="0.32"/>';
        if (open) {
            // what can be grown now gets the bright rim, in bone
            h += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + (r + 3.5) + '" ry="' + (r * 0.9 + 3.5) + '" fill="none" stroke="#f1e4d2" stroke-width="1.2"/>';
        }
    }
    // Surface's ring
    if (b.sf) {
        const rx = x + r * 0.95, ry = y - r * 1.05;
        h += b.sf === 'f'
            ? '<circle cx="' + rx + '" cy="' + ry + '" r="3.8" fill="' + WARM + '"/>'
            : '<circle cx="' + rx + '" cy="' + ry + '" r="3.8" fill="none" stroke="' + WARM + '" stroke-width="1.1" opacity="0.8"/>';
    }
    // pips: beads under the cell
    let below = y + (b.kind === 'vat' ? r * 1.15 : r * 0.9) + 8;
    if (b.max > 1) {
        const span = (b.max - 1) * 6.5;
        for (let i = 0; i < b.max; i++) {
            const px = x - span / 2 + i * 6.5;
            h += i < b.lvl
                ? '<circle cx="' + px + '" cy="' + below + '" r="2.3" fill="#dccdb6"/>'
                : '<circle cx="' + px + '" cy="' + below + '" r="2" fill="#2a1c19" stroke="#8a6a5f" stroke-width="0.7"/>';
        }
        below += 6;
    }
    // the label, in bone
    const nameC = locked ? '#7d6a60' : open && !live ? '#f1e4d2' : '#cdbcae';
    let price = null;
    if (b.sf !== 'o' && b.lvl < b.max && b.cost) price = [star(b.cost[0]), '+ ' + b.cost[1] + ' people'];
    if (b.lab === 'l') {
        h += text(x - r * 1.9 - 6, y + 2, b.name, { a: 'end', c: nameC, ls: '0.06em' });
    } else {
        h += text(x, below + 12, b.name, { a: 'middle', c: nameC, ls: '0.06em' });
        if (price) price.forEach(function (pl, k) { h += text(x, below + 24 + k * 11, pl, { a: 'middle', c: open ? '#f1e4d2' : '#a08b80' }); });
    }
    return h + '</g>';
}

/* ---------------------------------------------------------------- one state */
const PINNED = { a: ['seam', 'r', 0], b: ['lossless', 'r', -4], c: ['wetware', 'box', [742, 682]] };
const MECH_IDS = Object.keys(N);

function render(svg) {
    const sid = svg.dataset.state;
    const st = STATE[sid];
    let h = '';
    h += '<rect x="0" y="0" width="1440" height="840" fill="' + RK + '"/>';
    h += '<g transform="translate(' + BX + ',' + BY + ')">';
    h += boardBase(sid);
    h += traces(st);
    h += tags(st);
    h += '</g>';

    let log = null;
    if (sid !== 'a') log = nightLog(sid, sid === 'b' ? 4 : 9);

    if (sid === 'b') h += logTraces(log.traces, sid);

    h += '<g transform="translate(' + BX + ',' + BY + ')">';
    MECH_IDS.forEach(function (id) { if (st[id]) h += mechNode(st, id, sid); });
    if (sid === 'c') {
        h += tissue(sid);
        // the half-taken nodes keep their names on top of the tissue
        ['question', 'lossless'].forEach(function (id) {
            (mechNode(st, id, sid).match(/<text[^>]*>[^<]*<\/text>/g) || []).forEach(function (t) { h += t; });
        });
        h += text(760, 778, 'BIOLOGICAL', { s: 9, c: '#b9a594', ls: '0.32em', op: 0.85 });
    }
    h += '</g>';

    if (sid === 'c') {
        h += logTraces(log.traces, sid);
        h += '<g transform="translate(' + BX + ',' + BY + ')">';
        h += vessels();
        Object.keys(BIO).forEach(function (id) { h += bioCell(sid, id); });
        h += '</g>';
    }

    if (log) h += log.svg;
    h += legend();

    const pin = PINNED[sid];
    h += tipSvg(sid, pin[0], pin[1], pin[2]);
    h += '<g class="hover-layer"></g>';
    svg.innerHTML = h;

    // hover: any node shows its tooltip, the pinned one stays open
    const layer = svg.querySelector('.hover-layer');
    svg.querySelectorAll('.node').forEach(function (g) {
        const id = g.dataset.id;
        if (id === pin[0]) return;
        g.addEventListener('mouseenter', function () {
            const isBio = !!BIO[id];
            const node = isBio ? BIO[id] : N[id];
            const side = (node.x + BX) > 1080 ? 'l' : 'r';
            layer.innerHTML = tipSvg(sid, id, side, 0);
        });
        g.addEventListener('mouseleave', function () { layer.innerHTML = ''; });
    });
}

document.querySelectorAll('svg.board').forEach(render);

/* ---------------------------------------------------------------- tabs */
const tabs = document.querySelectorAll('.tab');
tabs.forEach(function (t) {
    t.addEventListener('click', function () {
        document.getElementById('state-' + t.dataset.to).scrollIntoView({ behavior: 'smooth' });
    });
});
const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        const k = e.target.id.slice(6);
        tabs.forEach(function (t) { t.classList.toggle('on', t.dataset.to === k); });
    });
}, { threshold: 0.55 });
document.querySelectorAll('section.state').forEach(function (s) { io.observe(s); });
})();
</script>
