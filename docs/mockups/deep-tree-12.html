/* ---------------------------------------------------------------- the tissue: mycelium, sinew and vessels
   Grown over a machine. Fine hyphae creep along the copper and across it; tendons and striated
   muscle hook round the won squares and pull; arteries and capillaries carry the pulse. Nothing
   mirrored, nothing ruled. Level is the knot: denser, tighter fibre and one feeding artery a level. */
const HYC = '#b9c4ca';                         // hyphae: cold, pale
const MUS = ['#4a3039', '#5b3b46', '#6a4652', '#3f2932'];   // muscle: dark, blood under the cold
const MUS_DK = '#170d11', TENDON = '#a9b2b9', ART = '#2c1219', ART_CORE = '#7d1f2e', STAIN = '#0c1013';

        const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
        for (let j = 0; j < k; j++) {
            const t = j / k, t2 = t * t, t3 = t2 * t;
            out.push([0, 1].map(function (c) {
                return 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3);
            }));

    return function (x) { return a.reduce(function (s, o) { return s + o.m * Math.sin(x * o.f + o.p); }, 0) / 2.2; };

        s += ' C ' + f(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + f(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
             f(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + f(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f(p2[0]) + ' ' + f(p2[1]);

/* a hypha: a random walk that sometimes branches; fine, pale, mostly see-through */
function hypha(x, y, a, steps, depth, r, out, w, step) {

    h += '<defs><pattern id="dots-d" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="9.5" y="9.5" width="1" height="1" fill="' + op(0.1) + '"/></pattern></defs>';
    h += '<rect x="330" y="110" width="780" height="580" fill="url(#dots-d)"/>';
    h += '<rect x="330.5" y="110.5" width="779" height="579" fill="none" stroke="' + op(0.16) + '"/>';
    h += text(350, 135, 'POWER', { s: 9, c: op(0.34), ls: '0.32em' });
    h += '<g id="f-steps"></g><g id="f-stage"></g>';
    h += infoBoxSvg();
    svg.innerHTML = h;
    const stage = svg.querySelector('#f-stage');
    const stepsG = svg.querySelector('#f-steps');
    const STEPS = ['1 won', '2 reached', '3 drawn together', '4 fused'];

    function bigSquare(x, y, rot, alpha, lvl, max) {
        let s = '<g transform="rotate(' + rot.toFixed(2) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')" opacity="' + alpha.toFixed(2) + '">';
        s += '<rect x="' + (x - SZ / 2) + '" y="' + (y - SZ / 2) + '" width="' + SZ + '" height="' + SZ + '" fill="' + PL + '"/>';
        s += '<rect x="' + (x - SZ / 2 + 6) + '" y="' + (y - SZ / 2 + 6) + '" width="7" height="7" fill="' + RK + '"/>';
        for (let i = 0; i < max; i++) {
            const px = x + SZ / 2 + 6 + Math.floor(i / 5) * 11, py = y - SZ / 2 + 2 + (i % 5) * 12;
            s += i < lvl ? '<rect x="' + px + '" y="' + py + '" width="8" height="8" fill="' + PL + '"/>'
                         : '<rect x="' + (px + 0.5) + '" y="' + (py + 0.5) + '" width="7" height="7" fill="none" stroke="' + op(0.32) + '"/>';
        }
        return s + '</g>';
    }
    const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const clamp = (t) => Math.max(0, Math.min(1, t));
    const seg = (t, a, b) => clamp((t - a) / (b - a));
    const LOOP = 10.5;
    const FIX = new URLSearchParams(location.search).get('t');
    let lastHold = false;

    function frame(now) {
        // ?t=7 holds the loop at one moment (for a still)
        const t = FIX !== null ? Number(FIX) : (now / 1000) % LOOP;
        const k = ease(seg(t, 0.8, 2.4));                 // the growth spreads up the board
        const reach = ease(seg(t, 2.0, 3.8));             // capillaries and tendons reach the squares
        const pull = ease(seg(t, 3.8, 5.8));              // the muscle contracts: drawn together
        const fuse = ease(seg(t, 5.4, 6.6));              // the knot forms between them
        const fade = 1 - ease(seg(t, 9.4, 10.2));
        const hold = t >= 6.7 && t < 9.4;
        const step = t < 2.0 ? 0 : t < 3.8 ? 1 : t < 5.6 ? 2 : 3;
        stepsG.innerHTML = STEPS.map(function (w, i) {
            return text(350 + i * 150, 92, w, { s: 10, c: i === step ? BR : op(0.3), ls: '0.1em' });
        }).join('');
        if (hold && lastHold) { requestAnimationFrame(frame); return; }
        lastHold = hold;

        const ax = A0[0] + (C[0] - 62 - A0[0]) * pull, ay = A0[1] + (C[1] - A0[1]) * pull;
        const bx = B0[0] + (C[0] + 62 - B0[0]) * pull, by = B0[1] + (C[1] - B0[1]) * pull;
        let s = '<g opacity="' + fade.toFixed(3) + '">';
        s += '<path d="M ' + ax + ' ' + ay + ' L ' + bx + ' ' + by + '" stroke="' + op(0.78 * (1 - fuse)) + '" stroke-width="2"/>';
        // the stain and the threads, spreading up from the bottom of the board
        if (k > 0) {
            const top = 690 - 330 * k;
            [[720, 690, 330, 1.1, 0.5], [600, 660, 140, 1, 0.8], [860, 650, 150, 1, 0.8]].forEach(function (b, i) {
                s += '<path d="' + blob(b[0], b[1], b[2], 0.35, 900 + i, 13, b[3], b[4] * k) + '" fill="' + STAIN + '" opacity="0.6"/>';
            });
            const hy = [];
            // the same threads every frame; only those below the growing edge are shown
            const rh = rng(4712);
            for (let j = 0; j < 130; j++) {
                const x = 360 + rh() * 720, y = 690 - rh() * 330;
                const a = -Math.PI / 2 + (rh() - 0.5) * 2.2, st = 8 + Math.floor(rh() * 14);
                const tmp = [];
                hypha(x, y, a, st, 1, rh, tmp, 0.7);
                if (y >= top) hy.push.apply(hy, tmp);
            }
            s += hy.join('');
        }
        s += '</g>';
        s += '<g opacity="' + fade.toFixed(3) + '">';
        s += bigSquare(ax, ay, -9 * pull, 1 - 0.3 * pull - 0.12 * fuse, 10, 10);
        s += bigSquare(bx, by, 8 * pull, 1 - 0.3 * pull - 0.12 * fuse, 6, 8);
        s += text(ax + SZ / 2, ay + SZ / 2 + 22, 'OUTPUT', { a: 'end', c: op(0.9 * (1 - fuse)), ls: '0.06em', s: 12 });
        s += text(bx - SZ / 2, by + SZ / 2 + 22, 'THE MACHINE: FEED', { a: 'start', c: op(0.9 * (1 - fuse)), ls: '0.06em', s: 12 });
        const out = [];
        if (reach > 0) {
            // capillaries climb to each square, and reach across the gap between them
            vein([[600, 610], [590, 520], [ax + 10, ay + 90], [ax + 4, ay + SZ / 2]], 6, 921, 1, out, rng(921), reach, hold);
            vein([[840, 610], [850, 520], [bx - 10, by + 90], [bx - 4, by + SZ / 2]], 6, 922, 1, out, rng(922), reach, hold);
            vein([[ax + SZ / 2, ay - 14], [ax + 60, ay - 50], [bx - 60, by - 50], [bx - SZ / 2, by - 14]], 4, 923, 2, out, rng(923), Math.min(1, reach * 1.2), hold);
            // threads web over the near half of each square
            const hy = [], rw = rng(4713), shown = Math.round(60 * reach);
            for (let j = 0; j < 60; j++) {
                const tmp = [];
                hypha(ax + rw() * SZ * 0.5, ay - SZ * 0.3 + rw() * SZ * 0.6, (rw() - 0.5) * 2, 5 + Math.floor(rw() * 8), 2, rw, tmp, 0.6);
                hypha(bx - rw() * SZ * 0.5, by - SZ * 0.3 + rw() * SZ * 0.6, Math.PI + (rw() - 0.5) * 2, 5 + Math.floor(rw() * 8), 2, rw, tmp, 0.6);
                if (j < shown) hy.push.apply(hy, tmp);
            }
            out.push(hy.join(''));
        }
        s += out.join('');
        if (reach > 0.2) {
            // the tendons hook round the near corners; the muscle between them contracts
            const ta = Math.min(1, (reach - 0.2) / 0.5);
            s += '<g opacity="' + ta.toFixed(2) + '">';
            s += band([[ax + SZ / 2 + 30, ay + 10], [ax + 20, ay - 22], [ax - 4, ay - SZ / 2 - 6], [ax - 22, ay - 30]], 9, 931);
            s += band([[ax + SZ / 2 + 26, ay + 26], [ax + 18, ay + SZ / 2 + 8], [ax - 10, ay + SZ / 2 + 4]], 7, 932);
            s += band([[bx - SZ / 2 - 30, by + 6], [bx - 20, by - 24], [bx + 6, by - SZ / 2 - 6], [bx + 24, by - 28]], 9, 933);
            s += band([[bx - SZ / 2 - 26, by + 24], [bx - 16, by + SZ / 2 + 8], [bx + 12, by + SZ / 2 + 2]], 7, 934);
            const gap = bx - ax;
            const thick = 12 + 22 * pull;                  // shorter and thicker as it contracts
            s += bundle([[ax + SZ / 2 + 4, ay + 6], [ax + gap * 0.35, ay + 16 + 10 * (1 - pull)], [bx - gap * 0.35, by + 12 + 10 * (1 - pull)], [bx - SZ / 2 - 4, by + 4]], thick, 14, 935, rng(935), true, hold);
            s += '</g>';
        }
        if (k > 0.05) {
            // muscles from the ground up, each hooked under the outer corner of its square
            const g = Math.min(1, k * 1.2);
            s += bundle([[400, 690], [430, 600], [ax - SZ / 2 - 30, ay + 120], [ax - SZ / 2 + 4, ay + SZ / 2 + 2]], 24 * g, 13, 910, rng(910), true, hold);
            s += bundle([[1100, 600], [1066, 520], [bx + SZ / 2 + 56, by + 64], [bx + SZ / 2 - 6, by + SZ / 2 - 4]], 16 * g, 10, 911, rng(911), true, hold);
        }
        if (fuse > 0) {
            s += '<g opacity="' + fuse.toFixed(3) + '">';
            if (fuse > 0.5) s += feeders(C[0], C[1] + 4, 2, fuse, 46, 941);
            s += knot(C[0], C[1] + 4, 0.6 + 1.4 * fuse, 940, rng(940), 0.3 + 0.6 * fuse);
            s += text(C[0], C[1] + 104, 'ORGANOID CELL', { a: 'middle', c: '#d9dad3', ls: '0.1em', s: 13, w: 700 });
            s += '</g>';
        }
        s += '</g>';
        stage.innerHTML = s;

        if (fuse > 0.6) setInfo(svg, { name: 'ORGANOID CELL', lvl: 'fused: Output 10/10 + The machine: feed 6/8', cost: 'grown',
            eff: 'generators and the machine are one organ: energy ×20, games ×4', x: 'the machine needs no feeding now; it is fed', xc: '#d9dad3', bio: 1 });
        else if (t > 2.0) setInfo(svg, { name: 'OUTPUT + THE MACHINE: FEED', lvl: '10 / 10 + 6 / 8', cost: 'both won', eff: 'the muscle is drawing them together', bio: 1 });
        else setInfo(svg, null);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();


/* ---------------------------------------------------------------- tabs */
const tabs = document.querySelectorAll('.tab');
tabs.forEach(function (t) {
    t.addEventListener('click', function () {
        document.getElementById('state-' + t.dataset.to).scrollIntoView({ behavior: 'smooth' });
    });
});
const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        const k = e.target.id.slice(6);
        tabs.forEach(function (t) { t.classList.toggle('on', t.dataset.to === k); });
    });
}, { threshold: 0.55 });
document.querySelectorAll('section.state').forEach(function (s) { io.observe(s); });

})();
</script>
</body>
</html>
