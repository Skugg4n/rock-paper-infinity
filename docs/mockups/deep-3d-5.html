<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV · THE DEEP · 3D mockup 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<style>
/* Mockup 5 of the chapter IV board: Ola's Photoshop sketch built as a real 3D
   model. The model turns slowly and can be zoomed and dragged, and nothing in it
   is clickable: every purchase and every number lives in the flat chrome around it.

   TWO COLOURS, as in mockups 3 and 4:
     rock   #0f141b   the background, and the disc that seals the shaft
     plate  #1e2733   every plate, every corridor, and the shaft itself
   One directional light and a low ambient do the rest: a plate's top is bright,
   its sides fall to nearly nothing, and the shaft reads as a cylinder because the
   light wraps around it. No textures, no fog, no gradients, no third colour.
   The people are the only self lit thing in the scene. Every number is by hand. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background-color: #070a0e;
    color: #8fa1b6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
}
.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
}

.hdr {
    width: 1440px;
    margin: 0 auto;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 72px;
    background: #070a0e;
}
.chapter-mark {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    letter-spacing: 0.06em;
    font-size: 22px;
    color: #55637a;
}
.hint { font-size: 11px; color: #37424f; }
.ver { margin-left: auto; font-size: 10px; color: #2f3949; }

.stage {
    position: relative;
    width: 1440px;
    height: 900px;
    margin: 0 auto 26px;
    background: #0f141b;
    overflow: hidden;
}
/* the model sits in the middle; the chrome is laid over it and never overlaps it */
#scene { position: absolute; inset: 0; }
#scene canvas { display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ---- labels anchored to plates ------------------------------------------ */
.lbl { position: absolute; pointer-events: none; }
.lbl-in {
    position: relative;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9fb0c4;
    transition: opacity 250ms ease;
}
.lbl-in .lvl {
    position: absolute;
    left: 2px;
    bottom: 2px;
    min-width: 17px;
    height: 17px;
    padding: 0 5px;
    border-radius: 9px;
    background: #3c4a5c;
    color: #dbe4f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 17px;
    text-align: center;
}
.lbl-in .auto { position: absolute; right: 3px; top: 3px; color: #64748b; }
.dig-ring { animation: dig 9s ease-in-out infinite alternate; }
@keyframes dig { from { stroke-dashoffset: 46; } to { stroke-dashoffset: 38; } }
.ring-base { stroke: #2a3442; }
.ring-fg { transform: rotate(-90deg); transform-origin: 50% 50%; }

/* ---- chrome, the same as mockups 3 and 4 --------------------------------- */
.btn {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    padding: 0.75rem;
    border-radius: 9999px;
    background-color: #1e2733;
    color: #aab8c9;
    transition: all 0.2s ease-in-out;
    cursor: pointer;
    border: 0;
    z-index: 10;
}
.btn:hover { transform: translateY(-2px); }
.btn.is-locked { opacity: 0.3; cursor: default; }
.btn.is-locked:hover { transform: none; }

.bar { position: relative; width: 24px; }
.track {
    width: 24px;
    height: 160px;
    border-radius: 9999px;
    background: #1e2733;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
}
.fill { width: 100%; border-radius: 9999px; background: #7d8fa5; }
.stop-dot {
    position: absolute;
    left: 50%;
    margin-left: -4px;
    width: 8px;
    height: 8px;
    border-radius: 9999px;
    background: #dc2626;
}
.col-head { font-size: 12px; color: #93a3b8; width: 24px; text-align: center; }
.col-foot { font-size: 11px; color: #55637a; width: 24px; text-align: center; letter-spacing: 0.08em; }
.caption { position: absolute; left: 72px; bottom: 22px; font-size: 11px; color: #37424f; z-index: 10; }
.chrome { z-index: 10; }

#fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #55637a;
}
</style>
</head>
<body>

<header class="hdr">
    <span class="chapter-mark">IV · THE DEEP</span>
    <span class="hint mono">drag to turn, scroll to zoom, the model is not clickable</span>
    <span class="ver mono">mockup 0.5</span>
</header>

<div class="stage">
    <div id="scene"></div>
    <div id="labels"></div>
    <div id="fallback" class="mono">this view needs WebGL</div>

    <!-- time -->
    <div class="chrome" style="position:absolute; left:72px; top:76px;">
        <div class="mono" style="display:grid; grid-template-columns:auto 16px auto 16px auto; align-items:baseline; column-gap:4px;">
            <span style="font-size:48px; font-weight:700; color:#dbe4f0; line-height:1;">0</span>
            <span style="font-size:18px; color:#3b4757; text-align:center;">·</span>
            <span style="font-size:24px; color:#5f6d80; line-height:1;">4</span>
            <span style="font-size:18px; color:#3b4757; text-align:center;">·</span>
            <span style="font-size:24px; color:#5f6d80; line-height:1;">12</span>
            <span style="font-size:9px; color:#3b4757; letter-spacing:0.18em; text-align:center;">y</span>
            <span></span>
            <span style="font-size:9px; color:#3b4757; letter-spacing:0.18em; text-align:center;">m</span>
            <span></span>
            <span style="font-size:9px; color:#3b4757; letter-spacing:0.18em; text-align:center;">d</span>
        </div>
    </div>

    <!-- what we hold -->
    <div class="chrome" style="position:absolute; right:72px; top:76px; display:flex; flex-direction:column; align-items:flex-end; gap:14px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <span class="mono" style="font-size:22px; font-weight:700; color:#c3cfdd;">420</span>
            <i data-lucide="gem" class="w-5 h-5" style="color:#5f6d80;"></i>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <span class="mono" style="font-size:22px; font-weight:700; color:#c3cfdd;">1 260</span>
            <i data-lucide="star" class="w-5 h-5" style="color:#5f6d80;"></i>
        </div>
    </div>

    <!-- the four columns, the shortest marked -->
    <div class="chrome" style="position:absolute; left:80px; top:392px;">
        <div class="mono" style="display:flex; gap:20px; margin-bottom:6px;">
            <span class="col-head">18</span><span class="col-head">23</span><span class="col-head">11</span><span class="col-head">16</span>
        </div>
        <div style="display:flex; gap:20px;">
            <div class="bar"><div class="track"><div class="fill" style="height:108px;"></div></div></div>
            <div class="bar"><div class="track"><div class="fill" style="height:132px;"></div></div></div>
            <div class="bar">
                <div class="track"><div class="fill" style="height:64px;"></div></div>
                <span class="stop-dot" style="bottom:74px;"></span>
            </div>
            <div class="bar"><div class="track"><div class="fill" style="height:96px;"></div></div></div>
        </div>
        <div class="mono" style="display:flex; gap:20px; margin-top:8px;">
            <span class="col-foot">M</span><span class="col-foot">F</span><span class="col-foot">E</span><span class="col-foot">H</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; margin-top:26px; color:#7d8fa5;">
            <span class="mono" style="font-size:20px; font-weight:700;">110</span>
            <span style="display:flex; align-items:center;">
                <i data-lucide="star" class="w-4 h-4"></i>
                <span class="mono" style="font-size:12px; margin:0 2px;">/</span>
                <i data-lucide="sun" class="w-4 h-4"></i>
            </span>
        </div>
    </div>

    <!-- the buttons -->
    <button class="btn" style="left:1312px; top:300px;" aria-label="Dig">
        <i data-lucide="shovel" class="w-7 h-7"></i>
    </button>
    <button class="btn" style="left:1312px; top:372px;" aria-label="Build a room">
        <i data-lucide="hammer" class="w-7 h-7"></i>
    </button>
    <button class="btn" style="left:1312px; top:444px;" aria-label="Level">
        <i data-lucide="chevrons-up" class="w-7 h-7"></i>
    </button>
    <button class="btn is-locked" style="left:1312px; top:516px;" aria-label="Cryo">
        <i data-lucide="snowflake" class="w-7 h-7"></i>
    </button>

    <span class="caption mono">5 min</span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const ROCK = 0x0f141b;
const PLATE = 0x1e2733;
const PEOPLE = 0xdbe4f0;

const PITCH = 2.6;      // cell to cell
const PLATE_W = 2.0;    // a plate is this wide, so the street between two is 0.6
const PLATE_H = 0.26;   // and this thin

/* Ola's sketch: floor 1 is a cross with a long east arm of three generators,
   floors 2 and 3 are crosses, and a landing hangs on the shaft between two
   floors with a chamber being dug on it. */
const FLOORS = [
    { y: 0, cells: [
        { x: 0, z: 0, lid: true },
        { x: 0, z: -1, room: 'pickaxe', lvl: 2 },
        { x: -1, z: 0, room: 'sprout', lvl: 1, auto: true },
        { x: 0, z: 1, room: 'bed', lvl: 1 },
        { x: 1, z: 0, room: 'zap', lvl: 2 },
        { x: 2, z: 0, room: 'zap', lvl: 1 },
        { x: 3, z: 0, room: 'zap', lvl: 1 }
    ] },
    { y: -3.2, cells: [
        { x: 0, z: 0, landing: true },
        { x: 0, z: -1, room: 'snowflake', lvl: 1 },
        { x: -1, z: 0, room: 'pickaxe', lvl: 1 },
        { x: 1, z: 0, room: 'zap', lvl: 1 },
        { x: 0, z: 1, room: 'sprout', lvl: 1, auto: true }
    ] },
    { y: -6.4, cells: [
        { x: 0, z: 0, landing: true },
        { x: 0, z: -1, room: 'pickaxe', lvl: 1 },
        { x: -1, z: 0, room: 'bed', lvl: 1 },
        { x: 1, z: 0, room: 'zap', lvl: 1 },
        { x: 0, z: 1, room: 'sprout', lvl: 1 }
    ] }
];
const SHAFT_TOP = -0.05;
const SHAFT_BOTTOM = -8.2;
const DIG = { x: 1.95, y: -4.8, z: 0 };   // the chamber being dug, on the shaft

const host = document.getElementById('scene');
const labelHost = document.getElementById('labels');

let renderer;
try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
    document.getElementById('fallback').style.display = 'flex';
}

if (renderer) {
    const W = host.clientWidth, H = host.clientHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.setClearColor(ROCK, 1);
    host.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer({ element: labelHost });
    labelRenderer.setSize(W, H);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ROCK);

    const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
    camera.position.set(11.5, 6.8, 13.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.8, -3.3, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.minDistance = 8;
    controls.maxDistance = 34;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;          // slow
    controls.minPolarAngle = 0.42;            // never straight above
    controls.maxPolarAngle = 1.33;            // never under the floors
    controls.update();

    // one light, and just enough ambient that a plate's side is not a hole
    scene.add(new THREE.AmbientLight(0xffffff, 0.22));
    const key = new THREE.DirectionalLight(0xffffff, 3.1);
    key.position.set(7, 14, 6);
    scene.add(key);

    const plateMat = new THREE.MeshLambertMaterial({ color: PLATE });
    const rockMat = new THREE.MeshLambertMaterial({ color: ROCK });
    const peopleMat = new THREE.MeshBasicMaterial({ color: PEOPLE });

    const plateGeo = new RoundedBoxGeometry(PLATE_W, PLATE_H, PLATE_W, 3, 0.1);
    const solids = [];          // everything a label can hide behind

    function addPlate(x, y, z, scale) {
        const m = new THREE.Mesh(plateGeo, plateMat);
        m.position.set(x, y, z);
        if (scale) m.scale.set(scale, 1, scale);
        scene.add(m);
        solids.push(m);
        return m;
    }

    // corridors: a thinner slab laid in the street between two neighbouring plates
    const corridorGeo = new RoundedBoxGeometry(PITCH - PLATE_W + 0.2, PLATE_H * 0.55, 0.95, 2, 0.05);
    function addCorridor(ax, az, bx, bz, y) {
        const m = new THREE.Mesh(corridorGeo, plateMat);
        m.position.set((ax + bx) / 2 * PITCH, y - PLATE_H * 0.2, (az + bz) / 2 * PITCH);
        if (az !== bz) m.rotation.y = Math.PI / 2;
        scene.add(m);
        solids.push(m);
    }

    // ---- the shaft: plate colour, so the light alone makes it a cylinder ----
    const shaftH = SHAFT_TOP - SHAFT_BOTTOM;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, shaftH, 28), plateMat);
    shaft.position.set(0, SHAFT_BOTTOM + shaftH / 2, 0);
    scene.add(shaft);
    solids.push(shaft);

    // ---- the floors ----
    const labels = [];
    function makeLabel(html, x, y, z) {
        const wrap = document.createElement('div');
        wrap.className = 'lbl';
        const inner = document.createElement('div');
        inner.className = 'lbl-in';
        inner.innerHTML = html;
        wrap.appendChild(inner);
        const obj = new CSS2DObject(wrap);
        obj.position.set(x, y, z);
        scene.add(obj);
        labels.push({ obj, inner });
        return obj;
    }

    const antSegments = [];
    FLOORS.forEach(function (floor) {
        const taken = new Map();
        floor.cells.forEach(function (c) { taken.set(c.x + ',' + c.z, c); });

        floor.cells.forEach(function (c) {
            addPlate(c.x * PITCH, floor.y, c.z * PITCH);

            if (c.lid) {
                // the way in from chapter III, closed: rock cut into the plate,
                // and the bar laid across it is the plate again
                const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 28), rockMat);
                disc.position.set(0, floor.y + PLATE_H / 2, 0);
                scene.add(disc);
                const bar = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.14, 0.3, 2, 0.06), plateMat);
                bar.position.set(0, floor.y + PLATE_H / 2 + 0.06, 0);
                scene.add(bar);
                solids.push(disc, bar);
            } else if (c.room) {
                let html = '<i data-lucide="' + c.room + '" class="w-7 h-7"></i>';
                html += '<span class="lvl mono">' + c.lvl + '</span>';
                if (c.auto) html += '<i data-lucide="repeat" class="auto w-3.5 h-3.5"></i>';
                makeLabel(html, c.x * PITCH, floor.y + 0.45, c.z * PITCH);
            }
        });

        // one corridor per neighbouring pair, and the people may use it only if
        // neither end is automated: an automated room is one nobody walks to
        floor.cells.forEach(function (c) {
            [[1, 0], [0, 1]].forEach(function (d) {
                const n = taken.get((c.x + d[0]) + ',' + (c.z + d[1]));
                if (!n) return;
                addCorridor(c.x, c.z, n.x, n.z, floor.y);
                if (!c.auto && !n.auto) {
                    antSegments.push({
                        a: new THREE.Vector3(c.x * PITCH, floor.y + 0.22, c.z * PITCH),
                        b: new THREE.Vector3(n.x * PITCH, floor.y + 0.22, n.z * PITCH)
                    });
                }
            });
        });
    });

    // ---- the chamber being dug, hanging on the shaft between two floors ----
    addPlate(DIG.x, DIG.y, DIG.z, 0.78);
    const spur = new THREE.Mesh(new RoundedBoxGeometry(1.1, PLATE_H * 0.55, 0.8, 2, 0.05), plateMat);
    spur.position.set(DIG.x - 1.0, DIG.y - PLATE_H * 0.2, DIG.z);
    scene.add(spur);
    solids.push(spur);
    makeLabel(
        '<svg viewBox="0 0 40 40" style="width:34px;height:34px;">' +
        '<circle class="ring-base" cx="20" cy="20" r="18" fill="none" stroke-width="2"></circle>' +
        '<circle class="ring-fg dig-ring" cx="20" cy="20" r="18" fill="none" stroke-width="3" ' +
        'stroke-dasharray="113" stroke-dashoffset="43" style="stroke:#7d8fa5;"></circle></svg>',
        DIG.x, DIG.y + 0.45, DIG.z
    );

    // ---- the people: the only thing in the scene that carries its own light ----
    function mulberry32(a) {
        return function () {
            a |= 0; a = a + 0x6D2B79F5 | 0;
            let t = Math.imul(a ^ a >>> 15, 1 | a);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }
    const rnd = mulberry32(20260921);
    const antGeo = new THREE.SphereGeometry(0.075, 8, 6);
    const ants = [];
    for (let i = 0; i < 30; i++) {
        // round robin over the streets, so nobody piles up in one corridor
        const seg = antSegments[i % antSegments.length];
        const m = new THREE.Mesh(antGeo, peopleMat);
        scene.add(m);
        ants.push({
            mesh: m,
            seg: seg,
            t: rnd(),
            dir: rnd() < 0.5 ? 1 : -1,
            speed: 0.10 + rnd() * 0.16
        });
    }

    // ---- labels: keep them crisp, size them with the zoom, hide the hidden ----
    const ray = new THREE.Raycaster();
    const tmp = new THREE.Vector3();
    function updateLabels() {
        labels.forEach(function (l) {
            l.obj.getWorldPosition(tmp);
            const dist = camera.position.distanceTo(tmp);
            const s = Math.min(1.25, Math.max(0.45, 17 / dist));
            l.inner.style.transform = 'scale(' + s.toFixed(3) + ')';
            ray.set(camera.position, tmp.clone().sub(camera.position).normalize());
            const hit = ray.intersectObjects(solids, false)[0];
            l.inner.style.opacity = (hit && hit.distance < dist - 0.5) ? '0' : '1';
        });
    }

    const clock = new THREE.Clock();
    function frame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        ants.forEach(function (a) {
            a.t += a.dir * a.speed * dt;
            if (a.t > 1) { a.t = 1; a.dir = -1; }
            if (a.t < 0) { a.t = 0; a.dir = 1; }
            // they keep to the street between two plates, never over a room
            a.mesh.position.lerpVectors(a.seg.a, a.seg.b, 0.24 + a.t * 0.52);
        });
        controls.update();
        updateLabels();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        requestAnimationFrame(frame);
    }
    frame();

    window.addEventListener('resize', function () {
        const w = host.clientWidth, h = host.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        labelRenderer.setSize(w, h);
    });

    lucide.createIcons();
}
</script>
</body>
</html>
