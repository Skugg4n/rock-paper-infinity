<style>
/* Mockup 3 of the chapter IV board. The side view is gone: this is the chapter II
   plate board, inverted. The hole dug at the end of III is the sealed centre plate,
   chambers are dug outward from it, and the gaps between plates are the corridors
   the people walk, exactly as the streets in II.

   ONE LIGHT. Two fills and nothing else:
     rock   #0f141b   the background, and anything not dug
     plate  #1e2733   a dug chamber, and the round buttons, which are plates too
   No gradients, no shadows, no borders, no third tone. What is not dug is simply
   not drawn. Every number is placed by hand. No game logic. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background-color: #070a0e;
    color: #8fa1b6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
}
.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
}

/* ---- header with the three tabs ---------------------------------------- */
.hdr {
    position: sticky;
    top: 0;
    z-index: 30;
    width: 1440px;
    margin: 0 auto;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 72px;
    background: #070a0e;
}
.chapter-mark {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    letter-spacing: 0.06em;
    font-size: 22px;
    color: #55637a;
}
.tabs { display: flex; gap: 8px; }
.tab {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: #55637a;
    background: transparent;
    border: 0;
    border-radius: 9999px;
    padding: 5px 12px;
    cursor: pointer;
    transition: color 0.2s ease, background-color 0.2s ease;
}
.tab:hover { color: #93a3b8; }
.tab.is-active { color: #dbe4f0; background: #1e2733; }
.ver { margin-left: auto; font-size: 10px; color: #2f3949; }

/* ---- board -------------------------------------------------------------- */
.board {
    position: relative;
    width: 1440px;
    height: 740px;
    margin: 0 auto 26px;
    background: #0f141b;
    overflow: hidden;
    scroll-margin-top: 60px;
}

/* ---- plates: the only light on the board -------------------------------- */
.plate {
    position: absolute;
    width: 92px;
    height: 92px;
    border-radius: 16px;
    background: #1e2733;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8fa1b6;
}
.plate.stalled { color: #46525f; }
.plate .lvl {
    position: absolute;
    left: 8px;
    bottom: 8px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: #3c4a5c;
    color: #dbe4f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 18px;
    text-align: center;
}
.plate .auto { position: absolute; right: 9px; top: 8px; color: #64748b; }
.plate .fault {
    position: absolute;
    right: 10px;
    top: 10px;
    width: 7px;
    height: 7px;
    border-radius: 9999px;
    background: #b45309;
}

/* The way in from chapter III, closed behind us: the shaft is cut out of the
   plate in rock, and the bar laid across it is the plate again. */
.hatch-disc {
    position: absolute;
    width: 56px;
    height: 56px;
    border-radius: 9999px;
    background: #0f141b;
}
.hatch-bar {
    position: absolute;
    width: 62px;
    height: 9px;
    border-radius: 9999px;
    background: #1e2733;
}

/* ---- people: dots in the corridors, as in II ---------------------------- */
.ant {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 9999px;
    background: #c9d6e6;
    animation: ant-step 11s ease-in-out infinite alternate;
}
.ant.vertical { animation-name: ant-step-v; }
@keyframes ant-step { from { transform: translateX(0); } to { transform: translateX(16px); } }
@keyframes ant-step-v { from { transform: translateY(0); } to { transform: translateY(18px); } }

/* ---- rings -------------------------------------------------------------- */
.ring-base { stroke: #2a3442; }
.ring-fg { transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring-estimate { stroke: #64748b; opacity: 0.4; transform: rotate(-90deg); transform-origin: 50% 50%; }
.dig-ring { animation: dig 9s ease-in-out infinite alternate; }
@keyframes dig { from { stroke-dashoffset: 46; } to { stroke-dashoffset: 38; } }

/* ---- buttons: plates too ------------------------------------------------- */
.btn {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    padding: 0.75rem;
    border-radius: 9999px;
    background-color: #1e2733;
    color: #aab8c9;
    transition: all 0.2s ease-in-out;
    cursor: pointer;
    border: 0;
}
.btn:hover { transform: translateY(-2px); }
.btn.is-locked { opacity: 0.3; cursor: default; }
.btn.is-locked:hover { transform: none; }
.btn-badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: #3c4a5c;
    color: #dbe4f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 18px;
    text-align: center;
}

/* ---- resource columns ---------------------------------------------------- */
.bar { position: relative; width: 24px; }
.track {
    width: 24px;
    height: 160px;
    border-radius: 9999px;
    background: #1e2733;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
}
.fill { width: 100%; border-radius: 9999px; background: #7d8fa5; }
.stop-dot {
    position: absolute;
    left: 50%;
    margin-left: -4px;
    width: 8px;
    height: 8px;
    border-radius: 9999px;
    background: #dc2626;
}
.col-head { font-size: 12px; color: #93a3b8; width: 24px; text-align: center; }
.col-foot { font-size: 11px; color: #55637a; width: 24px; text-align: center; letter-spacing: 0.08em; }

/* ---- replay strip -------------------------------------------------------- */
.replay-line { position: absolute; height: 2px; border-radius: 2px; background: #1e2733; }
.tick { position: absolute; width: 1px; background: #1a222c; }
.replay-ico { position: absolute; color: #8fa1b6; }
.replay-ico.stalled { color: #3e4a58; }
.replay-ico .flag {
    position: absolute;
    right: -3px;
    top: -3px;
    width: 6px;
    height: 6px;
    border-radius: 9999px;
    background: #b45309;
}

/* ---- the one place with sentences ---------------------------------------- */
.advisor { width: 340px; text-align: left; font-size: 11px; line-height: 1.45; color: #93a3b8; }
.caption { position: absolute; left: 72px; bottom: 22px; font-size: 11px; color: #37424f; }

@media (prefers-reduced-motion: reduce) {
    .ant, .dig-ring { animation: none !important; }
}
</style>
</head>

<script>
// The tabs jump between the three states; scrolling moves the tab.
(function () {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
    var boards = tabs.map(function (t) { return document.getElementById(t.dataset.target); });
    tabs.forEach(function (t) {
        t.addEventListener('click', function () {
            document.getElementById(t.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });
    function mark() {
        var best = 0, bestD = Infinity;
        boards.forEach(function (b, i) {
            var d = Math.abs(b.getBoundingClientRect().top - 60);
            if (d < bestD) { bestD = d; best = i; }
        });
        tabs.forEach(function (t, i) { t.classList.toggle('is-active', i === best); });
    }
    window.addEventListener('scroll', mark, { passive: true });
    mark();
})();

lucide.createIcons();
</script>
