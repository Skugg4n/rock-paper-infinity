<html lang="en">
<head>

<style>
/* Mockup 2 of the chapter IV board, after Ola's notes on mockup 1.
   Dark chapter: rock is near black, the dug rooms are lighter flat plates,
   the people are the brightest thing on screen. Flat fills only: no gradients,
   no drop shadows, no borders. Three states of the same board, so what is on
   screen at minute 0 and what is on screen at the first wake-up can be compared.
   Every number is placed by hand. No game logic. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background-color: #05080c;
    color: #8fa1b6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
}
.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
}

/* ---- header with the three tabs ---------------------------------------- */
.hdr {
    position: sticky;
    top: 0;
    z-index: 30;
    width: 1440px;
    margin: 0 auto;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 72px;
    background: #05080c;
}
.chapter-mark {
    font-family: 'Bebas Neue', system-ui, sans-serif;
    letter-spacing: 0.06em;
    font-size: 22px;
    color: #55637a;
}
.tabs { display: flex; gap: 8px; }
.tab {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: #55637a;
    background: transparent;
    border: 0;
    border-radius: 9999px;
    padding: 5px 12px;
    cursor: pointer;
    transition: color 0.2s ease, background-color 0.2s ease;
}
.tab:hover { color: #93a3b8; }
.tab.is-active { color: #dbe4f0; background: #1b2431; }
.ver { margin-left: auto; font-size: 10px; color: #333e4d; }

/* ---- board -------------------------------------------------------------- */
.board {
    position: relative;
    width: 1440px;
    height: 700px;
    margin: 0 auto 26px;
    background: #0e131b;
    overflow: hidden;
    scroll-margin-top: 60px;
}
.layer { position: absolute; inset: 0; pointer-events: none; }

/* The tone ladder does all the work: rock, then what has been opened,
   then the shaft, then the rooms, which are the lightest thing but the people. */
.rock-open rect { fill: #141c26; }   /* opened but not finished: the chamber being dug */
.shaft rect     { fill: #1a2330; }
.plate rect     { fill: #26323f; }
.plate rect.stalled { fill: #1a222d; }
.rubble rect    { fill: #232c39; }

/* ---- rooms -------------------------------------------------------------- */
.room {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8fa1b6;
}
.room.stalled { color: #46525f; }
.room .lvl {
    position: absolute;
    left: 12px;
    bottom: 10px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: #3c4a5c;
    color: #dbe4f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 18px;
    text-align: center;
}
.room .auto { position: absolute; right: 12px; top: 10px; color: #64748b; }
.room .fault {
    position: absolute;
    right: 12px;
    top: 12px;
    width: 7px;
    height: 7px;
    border-radius: 9999px;
    background: #b45309;
}

/* ---- people: the light -------------------------------------------------- */
.ant {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 9999px;
    background: #e8eef7;
    animation: ant-step 11s ease-in-out infinite alternate;
}
@keyframes ant-step { from { transform: translateX(0); } to { transform: translateX(13px); } }

/* ---- rings -------------------------------------------------------------- */
.ring-base { stroke: #2a3442; }
.ring-fg { transform: rotate(-90deg); transform-origin: 50% 50%; }
/* The first reading of the surface is a guess: a wide, soft band, not a value. */
.ring-estimate { stroke: #64748b; opacity: 0.4; transform: rotate(-90deg); transform-origin: 50% 50%; }
.dig-ring { animation: dig 9s ease-in-out infinite alternate; }
@keyframes dig { from { stroke-dashoffset: 46; } to { stroke-dashoffset: 38; } }

/* ---- buttons ------------------------------------------------------------ */
.btn {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    padding: 0.75rem;
    border-radius: 9999px;
    background-color: #1e2733;
    color: #aab8c9;
    transition: all 0.2s ease-in-out;
    cursor: pointer;
    border: 0;
}
.btn:hover { transform: translateY(-2px); background-color: #27323f; }
.btn.is-locked { opacity: 0.3; cursor: default; }
.btn.is-locked:hover { transform: none; background-color: #1e2733; }
.btn-badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: #3c4a5c;
    color: #dbe4f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 18px;
    text-align: center;
}

/* ---- resource columns ---------------------------------------------------- */
.bar { position: relative; width: 24px; }
.track {
    width: 24px;
    height: 160px;
    border-radius: 9999px;
    background: #182029;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
}
.fill { width: 100%; border-radius: 9999px; background: #7d8fa5; }
.stop-dot {
    position: absolute;
    left: 50%;
    margin-left: -4px;
    width: 8px;
    height: 8px;
    border-radius: 9999px;
    background: #dc2626;
}
.col-head { font-size: 12px; color: #93a3b8; width: 24px; text-align: center; }
.col-foot { font-size: 11px; color: #55637a; width: 24px; text-align: center; letter-spacing: 0.08em; }

/* ---- replay strip -------------------------------------------------------- */
.replay-line { position: absolute; height: 2px; border-radius: 2px; background: #2a3442; }
.tick { position: absolute; width: 1px; background: #212b37; }
.replay-ico { position: absolute; color: #8fa1b6; }
.replay-ico.stalled { color: #3e4a58; }
.replay-ico .flag {
    position: absolute;
    right: -3px;
    top: -3px;
    width: 6px;
    height: 6px;
    border-radius: 9999px;
    background: #b45309;
}

/* ---- text: the advisor is the only sentence in the chapter --------------- */
.advisor {
    width: 340px;
    text-align: left;
    font-size: 11px;
    line-height: 1.45;
    color: #93a3b8;
}
.caption { position: absolute; left: 72px; bottom: 26px; font-size: 11px; color: #3b4757; }

@media (prefers-reduced-motion: reduce) {
    .ant, .dig-ring { animation: none !important; }
}
</style>
</head>

<script>
// The underside of the crust is broken rock, not a ruler line. Fixed jag, no randomness.
(function () {
    var jag = [6, 14, 4, 11, 18, 7, 3, 12, 9, 16, 5, 10, 13, 4, 8, 15, 6, 11, 3, 9, 14, 5, 12, 7];
    var d = 'M1440,0 L1440,38';
    for (var i = 0; i < jag.length; i++) {
        var x = 1440 - (i + 1) * 60;
        d += ' L' + (x + 30) + ',' + (38 + jag[i]);
        d += ' L' + x + ',' + (38 + (jag[(i + 5) % jag.length] >> 1));
    }
    d += ' L0,0 Z';
    Array.prototype.forEach.call(document.querySelectorAll('.crust-path'), function (p) {
        p.setAttribute('d', d);
    });
})();

// The tabs jump between the three states; scrolling moves the tab.
(function () {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
    var boards = tabs.map(function (t) { return document.getElementById(t.dataset.target); });
    tabs.forEach(function (t) {
        t.addEventListener('click', function () {
            document.getElementById(t.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });
    function mark() {
        var best = 0, bestD = Infinity;
        boards.forEach(function (b, i) {
            var d = Math.abs(b.getBoundingClientRect().top - 60);
            if (d < bestD) { bestD = d; best = i; }
        });
        tabs.forEach(function (t, i) { t.classList.toggle('is-active', i === best); });
    }
    window.addEventListener('scroll', mark, { passive: true });
    mark();
})();

lucide.createIcons();
</script>
