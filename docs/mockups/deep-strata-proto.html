<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>IV · the strata (prototype)</title>
<!-- deep-strata: THE STRATA VIEW (direction B) as a standalone module, driven through the whole act
     with a fake but realistic state. It runs the real modules: src/phase4/strata-view.js (the view),
     strata.js (where things sit), growth.js (the body, its graph built with sectionPlace so it is the
     row the player sees), deep.js (a fresh state), machine-model.js, flesh.js, hands.js.
     The instrument panel's place on the left is left empty, so it composes like the game.
     Serve the repo root (python3 -m http.server 8127) and open /docs/mockups/deep-strata-proto.html.
     ?shot=tend|sleep|grow|hands|rise jumps to the states the screenshots were taken at. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<style>
:root { --rock: #0a0d12; --plate: #d5dbe3; --dim: #7b8595; --ink: #8fa1b6; }
html, body { margin: 0; height: 100%; background: var(--rock); color: var(--plate); overflow: hidden; }
body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
#view { position: fixed; inset: 0; }
/* the instrument panel's place: left empty on purpose */
.panel { position: fixed; left: 0; top: 0; bottom: 0; width: 300px; background: linear-gradient(90deg, #07090c, #0b0e13); pointer-events: none; }
.panel .frame { position: absolute; left: 24px; top: 24px; width: 250px; height: 676px; border-radius: 10px;
    background: linear-gradient(160deg, #1a212b, #11161d); border: 1px solid #262f3b; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 30px rgba(0,0,0,0.6); }
.panel .frame b { position: absolute; left: 32px; top: 32px; font-size: 17px; letter-spacing: 0.08em; color: #55637a; font-weight: 700; }
.panel .frame i { position: absolute; left: 32px; right: 32px; top: 300px; font-style: normal; font-size: 10px; letter-spacing: 0.24em; color: #33404f; text-align: center; }
/* the counter of the sleep (HUD, not the view's: here only so the shot composes like the game) */
.counter { position: fixed; top: 186px; left: calc(300px + (100vw - 300px - 118px) / 2); width: 280px; height: 280px; margin-left: -140px;
    border-radius: 50%; border: 1px solid rgba(213,219,227,0.18); background: radial-gradient(circle, rgba(10,13,18,0.82) 55%, rgba(10,13,18,0.35) 72%, rgba(10,13,18,0) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.8s; }
.counter.is-on { opacity: 1; }
.counter .tape { background: #1d242d; color: #e7ecf2; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; padding: 4px 9px; box-shadow: 0 1px 0 #000; }
.counter .num { margin: 16px 0 10px; display: flex; gap: 4px; }
.counter .num span { display: inline-block; width: 38px; height: 58px; line-height: 58px; text-align: center; font-size: 42px; font-weight: 700;
    background: linear-gradient(#11161d, #0a0d12 50%, #11161d); border-radius: 4px; color: #e7ecf2; box-shadow: inset 0 0 0 1px #262f3b; }
.counter .num span.gap { width: 10px; background: none; box-shadow: none; }
.counter .yrs { font-size: 10px; letter-spacing: 0.4em; color: var(--dim); }
.bar { position: fixed; left: 316px; right: 130px; bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.bar button { font: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--plate);
    background: rgba(10,13,18,0.86); border: 1px solid #2a313b; padding: 7px 10px; cursor: pointer; white-space: nowrap; }
.bar button:hover { border-color: var(--dim); }
.bar.is-hidden { display: none; }
.deep-machine-star { opacity: 0; line-height: 0; pointer-events: none; }
.deep-machine-star svg { width: 16px; height: 16px; fill: #d9a25f; }
.deep-machine-star.is-go { animation: deep-machine-win 760ms ease-out forwards; }
@keyframes deep-machine-win {
    0% { opacity: 0; transform: translateY(6px) scale(0.4); }
    18% { opacity: 1; transform: translateY(0) scale(1.25); }
    60% { opacity: 1; transform: translateY(-10px) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(0.85); }
}
</style>
</head>
<body>
<div id="view"></div>
<div class="panel"><div class="frame"><b>IV · THE DEEP</b><i>THE INSTRUMENT PANEL</i></div></div>
<div class="counter" id="counter"><span class="tape">THE COLONY HAS SLEPT</span><div class="num" id="num"></div><span class="yrs">YEARS</span></div>
<div class="bar" id="bar">
    <button data-a="tend">TEND state</button>
    <button data-a="sleep">sleep</button>
    <button data-a="deep">deep sleep x6</button>
    <button data-a="halluc">hallucinate</button>
    <button data-a="snap">snap</button>
    <button data-a="grow">grow: the question</button>
    <button data-a="take">take plates</button>
    <button data-a="starve">starve</button>
    <button data-a="feed">feed</button>
    <button data-a="machine">reach the machine</button>
    <button data-a="rise">rise</button>
    <button data-a="home">home</button>
</div>
<script type="module">
import { createStrataView } from '../../src/phase4/strata-view.js';
import { sectionPlace } from '../../src/phase4/strata.js';
import { initialDeepState } from '../../src/phase4/deep.js';
import * as G from '../../src/phase4/growth.js';

const params = new URLSearchParams(location.search);
const view = createStrataView(document.getElementById('view'), { insetLeft: 300 });
window.view = view;

/* a colony two and a bit floors deep, mid-chapter */
const ROOMS = ['mine', 'farm', 'generator', 'dorm'];
const BIG = params.get('big') ? Array.from({ length: Number(params.get('big')) }, (_, i) => (i === 9 ? 'cryo' : i % 17 === 5 ? null : ROOMS[i % 4])) : null;
const SLOTS = BIG || [
    'mine', 'farm', 'generator', 'dorm', 'mine', 'farm', 'generator', 'mine', 'farm', 'cryo', 'dorm', 'generator',
    'farm', 'mine', 'dorm', 'generator', 'mine', null, 'farm', 'mine', 'generator', 'dorm', null, 'mine',
    'mine', null,
];
function tendState() {
    const s = initialDeepState({ people: 90 });
    s.day = 412;
    s.chambers = SLOTS.length;
    s.rooms = { mine: 0, farm: 0, generator: 0, dorm: 0, cryo: 0 };
    for (const t of SLOTS) if (t) s.rooms[t]++;
    s.humans = 92;
    s.builds = [
        { kind: 'room', type: 'farm', slot: 22, startDay: 409, doneDay: 414 },
        { kind: 'dig', startDay: 410, doneDay: 418 },
    ];
    s.watcher = { sleptYears: 0, sleeps: 0 };
    return s;
}
let state = tendState();
let layout = { slots: SLOTS.slice() };
let graph = null, growth = null;
view.setState(state, layout);
view.setMachine({ throws: 1.3, drive: 0.6, quiet: 0.4 });

/* the counter (HUD) */
const counterEl = document.getElementById('counter'), numEl = document.getElementById('num');
function showCounter(years) {
    const s = String(Math.floor(years)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    numEl.innerHTML = [...s].map((c) => (c === ' ' ? '<span class="gap"></span>' : `<span>${c}</span>`)).join('');
}

/* the frame loop */
let last = performance.now();
let dive = null;
function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (dive) {
        dive.t += dt;
        const rate = dive.base * Math.min(3, 0.15 + dive.t / 6 + Math.max(0, dive.t - 6) / 25);
        state.watcher.sleptYears += rate * dt;
        state.day += rate * dt * 365;
        showCounter(state.watcher.sleptYears);
        if (dive.t >= dive.dur) { const d = dive; dive = null; d.done(); }
    }
    view.step(dt);
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* the acts */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function sleep(seconds = 6) {
    if (state.asleep) return;
    await view.gather(1.5);
    state.asleep = true;
    state.watcher.sleeps += 1;
    view.setState(state, layout);
    counterEl.classList.add('is-on');
    const tier = Math.min(6, state.watcher.sleeps - 1);
    await new Promise((done) => { dive = { t: 0, dur: seconds, base: 600 * Math.pow(2.6, tier), done }; });
    await wait(400);
    state.asleep = false;
    view.setState(state, layout);
    counterEl.classList.remove('is-on');
    await view.release(1.2);
}
function deepSleeps(n) {
    // n sleeps at once, each deeper than the last (the cryo tiers)
    for (let i = 0; i < n; i++) {
        state.watcher.sleeps += 1;
        view.setState(state, layout);
        const tier = Math.min(6, state.watcher.sleeps - 1);
        state.watcher.sleptYears += 1400 * Math.pow(2.3, tier) * (0.8 + 0.4 * ((i * 7) % 5) / 4);
        view.setState(state, layout);
    }
}
let hall = 0;
const KINDS = ['lamp', 'figure', 'afterimage', 'breathe', 'wrong'];
function hallucinate() {
    const k = KINDS[hall++ % KINDS.length];
    view.hallucinate(k, true);
}
function startGrow() {
    graph = G.graphFromSlots(layout.slots, sectionPlace);
    growth = G.createGrowth(graph);
    // dormitories in the body become vats; the empty chambers are body too, once taken
    syncBody();
}
function syncBody() {
    view.setBody(growth.body, growth.necrotic, G.reachable(graph, growth));
}
function take(n = 3) {
    if (!growth) startGrow();
    for (let i = 0; i < n; i++) {
        const r = G.reachable(graph, growth).filter((id) => id !== G.MACHINE);
        if (!r.length) break;
        // nearest the shaft first, floor by floor: the front walks out along the corridor
        r.sort((a, b) => order(a) - order(b));
        growth = G.take(graph, growth, r[0]);
    }
    syncBody();
}
function order(id) {
    const n = graph.nodes.find((q) => q.id === id);
    return n.floor * 100 + Math.abs(n.x) * 2 + (n.x > 0 ? 1 : 0);
}
function starve(years = 4) {
    if (!growth) return;
    for (let i = 0; i < years; i++) growth = G.tick(graph, growth, 0).state;
    syncBody();
}
function feed(years = 4) {
    if (!growth) return;
    for (let i = 0; i < years; i++) growth = G.tick(graph, growth, 1e6).state;
    syncBody();
}
function reachMachine() {
    if (!growth) startGrow();
    while (!G.floorFull(graph, growth, 0)) {
        const r = G.reachable(graph, growth).filter((id) => graph.nodes.find((q) => q.id === id).floor === 0);
        if (!r.length) break;
        r.sort((a, b) => order(a) - order(b));
        growth = G.take(graph, growth, r[0]);
    }
    growth = G.take(graph, growth, G.MACHINE);
    syncBody();
    view.setHands(true);
}
function rise() {
    view.rise(() => { document.title = 'IV · risen'; });
}
window.proto = { sleep, deepSleeps, hallucinate, take, starve, feed, reachMachine, rise, startGrow, get state() { return state; }, get growth() { return growth; }, showCounter, counterEl };

document.getElementById('bar').addEventListener('click', async (e) => {
    const a = e.target.closest('button')?.dataset.a;
    if (!a) return;
    if (a === 'tend') { state = tendState(); view.setState(state, layout); }
    if (a === 'sleep') sleep();
    if (a === 'deep') deepSleeps(6);
    if (a === 'halluc') hallucinate();
    if (a === 'snap') view.snapClear();
    if (a === 'grow') startGrow();
    if (a === 'take') take(3);
    if (a === 'starve') starve(3);
    if (a === 'feed') feed(3);
    if (a === 'machine') reachMachine();
    if (a === 'rise') rise();
    if (a === 'home') view.resetView();
});

/* the screenshot states */
const shot = params.get('shot');
if (shot) document.getElementById('bar').classList.add('is-hidden');
if (shot === 'sleep') {
    deepSleeps(9);
    view.gather(0.05);
    state.asleep = true;
    view.setState(state, layout);
    showCounter(state.watcher.sleptYears);
    counterEl.classList.add('is-on');
    setTimeout(() => { view.hallucinate('lamp', true); view.hallucinate('figure', true); view.hallucinate('afterimage', true); }, 300);
}
if (shot === 'grow' || shot === 'hands' || shot === 'rise') {
    deepSleeps(9);
    view.setState(state, layout);
    startGrow();
    const nodes = graph.nodes.filter((n) => n.kind !== 'machine').length;
    take(Math.round(nodes / 3) - 1);
    if (shot === 'grow') setTimeout(() => starve(1), 2500);
    if (shot !== 'grow') reachMachine();
    if (shot === 'rise') setTimeout(rise, 4200);
}
window.protoReady = true;
</script>
</body>
</html>
