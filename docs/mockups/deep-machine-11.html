/* Mockup 11b of chapter IV: the rock, paper, scissors machine. Mockup 10 with Ola's notes
   ("Ola on mockups 10" in docs/superpowers/specs/2026-10-02-chapter-iv-tree-and-bio.md):
   - ENERGY CLIMBS THROUGH CABLES: armoured cables come up out of the floor from the colony
     below, run along the deck under bolted brackets and climb into the hub's junction box and
     to each arm's shoulder. The energy is seen inside: a glowing core between the armour
     rings, pulses travelling up it, faster and brighter when fed; later, a steady glow
   - THE TOP SCREEN IS FIXED: bolted to its mast, facing one way
   - MORE MACHINE: a bolted deck, a big gear under the hub meshing with two smaller ones (real
     teeth, the same module so they mesh), a chain from the small gear's pulley to a spoked
     flywheel, a piston under each arm that throws it, a ring of bolts, an inspection plate, a
     heat sink and an exhaust stack that puffs. A 1950s factory machine built for a child's game
   - kept: its own room, the hand-hewn passage, CRT heads, sparks, the star, "later ×50" (gears
     blur, the cables glow steady)
   STATIC: no game logic beyond the toy itself. Every number is by hand.
   Two colours as the colony (light plate #d5dbe3, dark rock #0a0d12), darker joints #5b6676 and
   armour #3a434f, the crust #353e4a, and one metal accent: brass #a98a58 for the gears.
   Phosphor, energy blue and the star's amber are the only lights. */

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const ROCK = 0x0a0d12;
const PLATE = 0xd5dbe3;
const LANE = 0x7b8595;
const JOINT = 0x5b6676;
const CRUST = 0x353e4a;
const RUBBLE = 0x4a5361;
const ENERGY = 0x4f9bff;
const BRASS = 0xa98a58;          // the one metal accent: the gears and the chain

const PLATE_W = 2.0, PLATE_H = 0.26;
const TOP = PLATE_H / 2;
const H0 = 0.58;                    // the shoulders
const R0 = 0.2;
const L1 = 0.38, L2 = 0.34;
const RING_Y = H0 + 0.3;
const CRT_Y = 1.24;                 // the screen at the top
const D2R = Math.PI / 180;
const GLYPHS = ['gem', 'file-text', 'scissors'];

/* lucide's own paths for chapter I's three glyphs, drawn on the screens */
const PATHS = {
    'gem': ['M6 3h12l4 6-10 13L2 9Z', 'M11 3 8 9l4 13 4-13-3-6', 'M2 9h20'],
    'file-text': ['M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z', 'M14 2v4a2 2 0 0 0 2 2h4', 'M10 9H8', 'M16 13H8', 'M16 17H8'],
    'scissors': ['M9 6a3 3 0 1 1-6 0a3 3 0 1 1 6 0', 'M9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0', 'M20 4 8.12 15.88', 'M14.47 14.48 20 20', 'M8.12 8.12 12 12']
};
const P2D = {};
Object.keys(PATHS).forEach(function (k) { P2D[k] = PATHS[k].map(function (d) { return new Path2D(d); }); });

const host = document.getElementById('scene');
const labelHost = document.getElementById('labels');
const slider = document.getElementById('energy');
const tip = document.getElementById('tip');

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('fallback').style.display = 'flex'; }

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

if (renderer) {
    let W = window.innerWidth, H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.setClearColor(ROCK, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer({ element: labelHost });
    labelRenderer.setSize(W, H);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ROCK);

    const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 100);
    camera.position.set(3.9, 2.55, 4.7);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.6, 0.62, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.minDistance = 1.6;
    controls.maxDistance = 11;
    controls.minPolarAngle = 0.3;
    controls.maxPolarAngle = 1.75;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;
    controls.update();
    controls.addEventListener('start', function () { controls.autoRotate = false; });
    renderer.domElement.addEventListener('wheel', function () { controls.autoRotate = false; }, { passive: true });

    scene.add(new THREE.AmbientLight(0xffffff, 0.34));
    const lamp = new THREE.PointLight(0xffffff, 9, 0, 1.25);
    lamp.position.set(1.0, 4.2, 1.6);
    scene.add(lamp);

    const plateMat = new THREE.MeshLambertMaterial({ color: PLATE });
    const jointMat = new THREE.MeshLambertMaterial({ color: JOINT });
    const laneMat = new THREE.MeshBasicMaterial({ color: LANE });
    const crustMat = new THREE.MeshLambertMaterial({ color: CRUST, flatShading: true, side: THREE.DoubleSide });
    const rubbleMat = new THREE.MeshLambertMaterial({ color: RUBBLE, flatShading: true });

    const machineParts = [];
    function add(mesh, parent, isMachine) {
        (parent || scene).add(mesh);
        if (isMachine) machineParts.push(mesh);
        return mesh;
    }

    /* ---------------------------------------------------------------- the room */
    add(new THREE.Mesh(new THREE.BoxGeometry(PLATE_W, PLATE_H, PLATE_W), plateMat));
    const R = 0.8, LW = 0.14, span = 2 * R + LW;
    [[0, -R, span, LW], [0, R, span, LW], [-R, 0, LW, span], [R, 0, LW, span],
     [(R + 0.97) / 2, 0, 0.97 - R, LW]].forEach(function (c) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(c[2], 0.02, c[3]), laneMat);
        m.position.set(c[0], TOP + 0.002, c[1]);
        add(m);
    });
    // low walls, cut away: tall at the corners, low along the middle; a doorway on the passage side
    const WT = 0.06, TALL = 0.4, LOW = 0.12;
    function wall(cx, cz, len, alongX, h) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(alongX ? len : WT, h, alongX ? WT : len), plateMat);
        m.position.set(cx, TOP + h / 2, cz);
        add(m);
    }
    const E = PLATE_W / 2 - WT / 2;
    [[0, -E, true], [0, E, true], [-E, 0, false], [E, 0, false]].forEach(function (w, k) {
        const along = w[2];
        [[-0.75, 0.5, TALL], [0, 1.0, LOW], [0.75, 0.5, TALL]].forEach(function (sg) {
            if (k === 3 && sg[1] === 1.0) return;              // the doorway to the passage
            wall(along ? sg[0] : w[0], along ? w[1] : sg[0], sg[1], along, sg[2]);
        });
    });

    /* ---------------------------------------------------------------- the crust and the passage up */
    const crust = add(new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.3, 1.05, 6, 1, 6), crustMat));
    crust.position.set(1.86, 1.96, 0);
    {
        const pos = crust.geometry.attributes.position;
        const r = mulberry32(44);
        for (let i = 0; i < pos.count; i++) {
            if (pos.getY(i) > 0) pos.setY(i, pos.getY(i) + (r() - 0.5) * 0.06);
        }
        crust.geometry.computeVertexNormals();
    }
    // hand-hewn: a lumpy tube, every vertex pushed by hand, faceted
    const passCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0.98, TOP + 0.12, 0.0),
        new THREE.Vector3(1.28, TOP + 0.22, 0.05),
        new THREE.Vector3(1.52, 0.68, -0.08),
        new THREE.Vector3(1.66, 1.18, 0.07),
        new THREE.Vector3(1.78, 1.68, -0.05),
        new THREE.Vector3(1.84, 2.2, 0.02)
    ]);
    const passGeo = new THREE.TubeGeometry(passCurve, 46, 0.12, 8, false);
    {
        const pos = passGeo.attributes.position, nor = passGeo.attributes.normal;
        const r = mulberry32(77);
        const ring = 9;
        // one push per ring and per vertex: lumps along it and round it, never a clean bore
        const ringPush = [];
        for (let i = 0; i <= 46; i++) ringPush.push((r() - 0.5) * 0.05);
        for (let i = 0; i < pos.count; i++) {
            const k = (r() - 0.5) * 0.06 + ringPush[Math.floor(i / ring)];
            pos.setXYZ(i, pos.getX(i) + nor.getX(i) * k, pos.getY(i) + nor.getY(i) * k, pos.getZ(i) + nor.getZ(i) * k);
        }
        passGeo.computeVertexNormals();
    }
    add(new THREE.Mesh(passGeo, crustMat));
    // a rough landing outside the doorway, and rubble round the mouth
    {
        const r = mulberry32(91);
        for (let i = 0; i < 4; i++) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.16 + r() * 0.1, 0.08 + r() * 0.05, 0.16 + r() * 0.12), crustMat);
            m.position.set(1.05 + r() * 0.2, TOP - 0.02 + r() * 0.04, -0.12 + r() * 0.24);
            m.rotation.set((r() - 0.5) * 0.3, r() * 3, (r() - 0.5) * 0.3);
            add(m);
        }
        for (let i = 0; i < 14; i++) {
            const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.035 + r() * 0.06, 0), rubbleMat);
            const a = r() * Math.PI * 2, d = 0.15 + r() * 0.22;
            m.position.set(1.84 + Math.cos(a) * d, 2.14 + r() * 0.04, Math.sin(a) * d);
            m.rotation.set(r() * 3, r() * 3, r() * 3);
            add(m);
        }
    }

    /* ---------------------------------------------------------------- screens */
    function makeScreen(glyph, ring) {
        const c = document.createElement('canvas');
        c.width = 128; c.height = 96;
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        const mat = new THREE.MeshBasicMaterial({ map: tex });
        return { c: c, ctx: c.getContext('2d'), tex: tex, mat: mat, glyph: glyph, win: 0, noise: 0, roll: Math.random(), ring: ring };
    }
    function drawScreen(sc, time) {
        const ctx = sc.ctx, w = 128, h = 96;
        const hot = sc.win > 0;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = hot ? '#2a1b07' : '#06110f';
        ctx.fillRect(0, 0, w, h);
        if (sc.noise > 0) {
            for (let i = 0; i < 260; i++) {
                ctx.fillStyle = 'rgba(207,238,230,' + (Math.random() * 0.7).toFixed(2) + ')';
                ctx.fillRect(Math.random() * w, Math.random() * h, 2, 1);
            }
        } else {
            const col = hot ? '#ffd27e' : '#cdeee5';
            ctx.save();
            const k = 2.6;
            ctx.translate(w / 2 - 12 * k, h / 2 - 12 * k);
            ctx.scale(k, k);
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = col;
            ctx.shadowColor = col;
            ctx.shadowBlur = 6;
            P2D[sc.glyph].forEach(function (p) { ctx.stroke(p); });
            ctx.restore();
        }
        // scanlines, a rolling band, the dark round the edge of the glass
        ctx.fillStyle = 'rgba(0,0,0,0.38)';
        for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
        const y0 = ((time * 34 + sc.roll * 120) % 130) - 18;
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(0, y0, w, 12);
        const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, w * 0.66);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        sc.tex.needsUpdate = true;
    }

    /* ---------------------------------------------------------------- the machine: a deck, a gear train, a flywheel and a belt
       Everything is bolted down. The hub turns nothing; the big gear under it does, and it meshes
       with two smaller ones. The small one on the right carries a pulley; a chain runs from it to
       the flywheel at the back. Gears are the one metal accent (brass). */
    const brassMat = new THREE.MeshLambertMaterial({ color: BRASS });
    const dirOf = function (a) { return new THREE.Vector3(Math.cos(a), 0, -Math.sin(a)); };
    function bolt(parent, x, y, z, s, mat) {
        const b = add(new THREE.Mesh(new THREE.CylinderGeometry(0.013 * (s || 1), 0.013 * (s || 1), 0.012, 6), mat || plateMat), parent, true);
        b.position.set(x, y, z);
        return b;
    }
    const DECK_H = 0.04;
    const DECK = TOP + DECK_H;             // the deck's top face
    const deck = add(new THREE.Mesh(new THREE.BoxGeometry(1.22, DECK_H, 1.22), jointMat), null, true);
    deck.position.y = TOP + DECK_H / 2;
    [[-0.56, -0.56], [0.56, -0.56], [-0.56, 0.56], [0.56, 0.56], [0, -0.58], [0, 0.58], [-0.58, 0], [0.58, 0]].forEach(function (p) {
        bolt(null, p[0], DECK + 0.006, p[1], 1.3);
    });

    const MOD = 0.02;                       // every gear has the same tooth, so they can mesh
    function gearGeo(n, depth) {
        const r = MOD * n / 2, ro = r + MOD, rr = r - 1.25 * MOD;
        const sh = new THREE.Shape();
        const p = Math.PI * 2 / n;
        for (let i = 0; i < n; i++) {
            const a = i * p;
            [[rr, a - p * 0.5], [rr, a - p * 0.26], [ro, a - p * 0.12], [ro, a + p * 0.12], [rr, a + p * 0.26]].forEach(function (q, k) {
                const x = Math.cos(q[1]) * q[0], y = Math.sin(q[1]) * q[0];
                if (i === 0 && k === 0) sh.moveTo(x, y); else sh.lineTo(x, y);
            });
        }
        sh.closePath();
        const hole = new THREE.Path();
        hole.absarc(0, 0, Math.max(0.018, r * 0.14), 0, Math.PI * 2, true);
        sh.holes.push(hole);
        if (n >= 16) {
            for (let k = 0; k < 5; k++) {
                const a = k / 5 * Math.PI * 2, hp = new THREE.Path();
                hp.absarc(Math.cos(a) * r * 0.56, Math.sin(a) * r * 0.56, r * 0.19, 0, Math.PI * 2, true);
                sh.holes.push(hp);
            }
        }
        const g = new THREE.ExtrudeGeometry(sh, { depth: depth, bevelEnabled: false, curveSegments: 10 });
        g.translate(0, 0, -depth / 2);
        g.rotateX(-Math.PI / 2);
        return { geo: g, r: r, ro: ro };
    }
    const GEAR_Y = DECK + 0.06;
    function makeGear(n, at, depth) {
        const gg = gearGeo(n, depth);
        const grp = new THREE.Group();
        grp.position.copy(at);
        scene.add(grp);
        add(new THREE.Mesh(gg.geo, brassMat), grp, true);
        add(new THREE.Mesh(new THREE.CylinderGeometry(gg.r * 0.24, gg.r * 0.24, depth * 1.6, 12), jointMat), grp, true);
        // a hub bolt circle, so it reads as bolted to its shaft
        for (let k = 0; k < 4; k++) {
            const a = k / 4 * Math.PI * 2 + 0.4;
            bolt(grp, Math.cos(a) * gg.r * 0.33, depth * 0.8, -Math.sin(a) * gg.r * 0.33, 0.7, jointMat);
        }
        // the blur when it spins too fast to see the teeth
        const blurMat = new THREE.MeshLambertMaterial({ color: BRASS, transparent: true, opacity: 0, depthWrite: false });
        const blur = new THREE.Mesh(new THREE.CylinderGeometry(gg.ro, gg.ro, depth * 1.08, 40), blurMat);
        scene.add(blur);
        blur.position.copy(at);
        return { grp: grp, n: n, r: gg.r, blur: blurMat, theta: 0 };
    }
    // the big gear on the main axle, under the hub
    const axle = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.12, 16), jointMat), null, true);
    axle.position.y = DECK + 0.06;
    const G1 = makeGear(28, new THREE.Vector3(0, GEAR_Y, 0), 0.034);
    const A2 = -30 * D2R, A3 = 210 * D2R;
    const G2 = makeGear(12, dirOf(A2).multiplyScalar(MOD * (28 + 12) / 2).setY(GEAR_Y), 0.034);
    const G3 = makeGear(10, dirOf(A3).multiplyScalar(MOD * (28 + 10) / 2).setY(GEAR_Y), 0.034);
    G2.phi = A2; G3.phi = A3;

    // shafts with bearing blocks; the right one runs up to a pulley
    const PUL_Y = DECK + 0.27;
    function shaft(at, top) {
        const s = add(new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, top - DECK, 10), jointMat), null, true);
        s.position.set(at.x, (top + DECK) / 2, at.z);
        const blk = add(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.035, 0.09), jointMat), null, true);

    const chainCurve = (function () {
        const pts = [];
        [[pulley2.position, R_P2 + 0.006], [pulley1.position, R_P1 + 0.006]].forEach(function (c) {
            for (let k = 0; k < 48; k++) { const a = k / 48 * Math.PI * 2; pts.push([c[0].x + Math.cos(a) * c[1], c[0].z + Math.sin(a) * c[1]]); }
        });
        // convex hull: the chain's path
        pts.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
        const cross = function (o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); };

        pts.forEach(function (p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); });
        pts.slice().reverse().forEach(function (p) { while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); });
        const hull = lo.slice(0, -1).concat(hi.slice(0, -1));

    /* ---------------------------------------------------------------- the arms, with CRT heads */
    function makeArm(mats, withHead, glyph) {

    function ik(x, y) {
        const d2 = x * x + y * y;
        const c = Math.max(-1, Math.min(1, (d2 - L1 * L1 - L2 * L2) / (2 * L1 * L2)));
        const phi = Math.acos(c);
        const theta = Math.atan2(y, x) - Math.atan2(L2 * Math.sin(phi), L1 + L2 * Math.cos(phi));
        return [theta, phi];
    }
    // the head comes down beside the ring, under the screen
    const HIT = ik(-R0 + 0.15, RING_Y + 0.06 - H0);

    let energy = 40;
    let later = false;
    function rest(i, time) {
        const k = Math.sqrt(energy / 100);
        let th = (-24 + 30 * k) * D2R, ph = (-14 + 10 * k) * D2R;
        th += Math.sin(time * (0.5 + k) + i * 2.1) * (0.5 + 2.5 * k) * D2R;
        return [th, ph];
    }
    const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    const inOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const easeIn = (t) => t * t * t;
    function pose(i, gc, time) {
        const g = Math.floor(gc), p = gc - g;
        const r = rest(i, time);
        if (gc <= 0 || ((g % 3) + 3) % 3 !== i) return r;
        const wind = [r[0] - 12 * D2R, r[1] - 26 * D2R];
        if (p < 0.22) return mix(r, wind, inOut(p / 0.22));
        if (p < 0.48) return mix(wind, HIT, easeIn((p - 0.22) / 0.26));
        if (p < 0.62) {
            const b = Math.sin((p - 0.48) / 0.14 * Math.PI) * 4 * D2R;
            return [HIT[0] + b, HIT[1] - b * 0.6];
        }
        return mix(HIT, r, inOut((p - 0.62) / 0.38));
    }
    function apply(a, ps) { a.shoulder.rotation.z = ps[0]; a.elbow.rotation.z = ps[1]; }

    /* ---------------------------------------------------------------- energy, through cables
       Armoured cables come up out of the floor from the colony below, run along the deck under
       brackets and climb into the hub's junction box and to each arm's shoulder. The energy is
       seen INSIDE: a glowing core through the gaps between the armour rings, pulses travelling
       up it, faster and brighter the more the machine is fed; later, a steady glow. */
    const sheathMat = new THREE.MeshLambertMaterial({ color: 0x3a434f });
    const cableUniforms = [];
    const UP = new THREE.Vector3(0, 1, 0);
    const P = function (r, y, a) { return new THREE.Vector3(Math.cos(a) * r, y, -Math.sin(a) * r); };
    function makeCable(points, rs) {
        const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
        const len = curve.getLength();
        const u = {
            uFlow: { value: Math.random() }, uGlow: { value: 0 }, uBright: { value: 0.5 },
            uLen: { value: len }, uColor: { value: new THREE.Color(ENERGY) }
        };
        cableUniforms.push(u);
        const mat = new THREE.ShaderMaterial({
            uniforms: u,
            vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
            fragmentShader: [
                'uniform float uFlow, uGlow, uBright, uLen; uniform vec3 uColor; varying vec2 vUv;',
                'void main(){',
                '  float s = vUv.x * uLen;',
                '  float ph = fract((s - uFlow) / 0.45);',
                '  float p = smoothstep(0.0, 0.05, ph) * (1.0 - smoothstep(0.05, 0.3, ph));',
                '  float k = mix(0.16 + 1.7 * p, 1.25, uGlow) * uBright;',
                '  gl_FragColor = vec4(uColor * k + vec3(0.6, 0.8, 1.0) * p * uBright * 0.35 * (1.0 - uGlow), 1.0);',
                '}'
            ].join('\n')
        });
        add(new THREE.Mesh(new THREE.TubeGeometry(curve, Math.ceil(len * 70), rs * 0.6, 8, false), mat));
        // the armour: rings with gaps, the core shows between them
        const RING = rs * 1.15, STEP = rs * 1.9;
        const n = Math.floor(len / STEP);
        const rings = new THREE.InstancedMesh(new THREE.CylinderGeometry(rs, rs, RING, 12), sheathMat, n);
        const m = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1);
        for (let i = 0; i < n; i++) {
            const t = (i + 0.5) * STEP / len;
            q.setFromUnitVectors(UP, curve.getTangentAt(t));
            m.compose(curve.getPointAt(t), q, one);
            rings.setMatrixAt(i, m);
        }
        scene.add(rings);
        return { curve: curve, len: len, rs: rs };
    }
    // a grommet where a cable comes through the deck, and brackets bolted over its run
    function grommet(at, rs) {
        const g = add(new THREE.Mesh(new THREE.TorusGeometry(rs + 0.012, 0.011, 8, 20), jointMat));
        g.rotation.x = Math.PI / 2;
        g.position.set(at.x, DECK + 0.004, at.z);
    }
    function bracket(cab, t) {
        const p = cab.curve.getPointAt(t), tan = cab.curve.getTangentAt(t);
        const a = Math.atan2(-tan.z, tan.x);
        const grp = new THREE.Group();
        grp.position.set(p.x, DECK, p.z);
        grp.rotation.y = a;
        scene.add(grp);
        const h = cab.rs * 2 + 0.014, w = cab.rs * 2 + 0.03;
        const top = add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.01, w), plateMat), grp);
        top.position.y = h;
        [-1, 1].forEach(function (s) {
            const leg = add(new THREE.Mesh(new THREE.BoxGeometry(0.03, h, 0.01), plateMat), grp);
            leg.position.set(0, h / 2, s * w / 2);
            const foot = add(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.006, 0.03), plateMat), grp);
            foot.position.set(0, 0.003, s * (w / 2 + 0.014));
            bolt(grp, 0, 0.01, s * (w / 2 + 0.016), 0.6, jointMat);
        });
    }
    const CABLES = [];
    // the main feed: up through the deck front right, along it, into the junction box on the hub
    {
        const a = 300 * D2R, rs = 0.03;
        const jb = add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.09), jointMat), null, true);
        jb.position.copy(P(0.21, DECK + 0.04, a));
        jb.rotation.y = a;
        bolt(null, jb.position.x, DECK + 0.085, jb.position.z, 0.9);
        const cab = makeCable([
            P(2.1, -2.8, a + 0.32), P(1.5, -1.6, a + 0.22), P(0.98, -0.62, a + 0.08), P(0.74, -0.15, a),
            P(0.72, DECK - 0.02, a), P(0.69, DECK + rs + 0.02, a - 0.01), P(0.58, DECK + rs, a + 0.02),
            P(0.42, DECK + rs, a - 0.015), P(0.3, DECK + rs + 0.004, a), P(0.26, DECK + 0.04, a)
        ], rs);
        grommet(P(0.72, DECK, a), rs);
        bracket(cab, 0.79); bracket(cab, 0.88);
        CABLES.push(cab);
    }
    // one to each arm's shoulder, up through the deck beside it and up the side of the hub
    for (let i = 0; i < 3; i++) {
        const ay = i * 2 * Math.PI / 3 + Math.PI / 6;
        const a = ay + 0.26, rs = 0.019;
        const sh = P(R0, H0, ay), tg = new THREE.Vector3(Math.sin(ay), 0, Math.cos(ay));
        const end = sh.clone().addScaledVector(tg, 0.06);
        const cab = makeCable([
            P(1.9, -2.8, a + 0.4 + i * 0.1), P(1.3, -1.5, a + 0.2), P(0.86, -0.55, a + 0.06), P(0.66, -0.12, a),
            P(0.64, DECK - 0.02, a), P(0.62, DECK + rs + 0.02, a - 0.01), P(0.52, DECK + rs, a + 0.01), P(0.42, DECK + rs, a),
            P(0.36, DECK + 0.12, a - 0.04), P(0.3, DECK + 0.26, a - 0.12), end.clone().addScaledVector(tg, 0.05).setY(H0 - 0.08), end
        ], rs);

    /* ---------------------------------------------------------------- the pistons that throw the arms */
    const pistons = [];
    for (let i = 0; i < 3; i++) {
        const ay = i * 2 * Math.PI / 3 + Math.PI / 6;
        const base = P(0.37, DECK + 0.03, ay);
        const clevis = add(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.05), jointMat), null, true);
        clevis.position.set(base.x, DECK + 0.02, base.z);
        clevis.rotation.y = ay;
        bolt(null, base.x + Math.sin(ay) * 0.035, DECK + 0.045, base.z + Math.cos(ay) * 0.035, 0.7);
        bolt(null, base.x - Math.sin(ay) * 0.035, DECK + 0.045, base.z - Math.cos(ay) * 0.035, 0.7);
        const sleeve = add(new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.024, 0.17, 12), jointMat), null, true);
        const rod = add(new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 1, 8), plateMat), null, true);
        const eye = add(new THREE.Mesh(new THREE.SphereGeometry(0.016, 10, 8), jointMat), null, true);
        pistons.push({ base: base, sleeve: sleeve, rod: rod, eye: eye, arm: i });
    }
    const pv = new THREE.Vector3(), pdir = new THREE.Vector3(), pq = new THREE.Quaternion();
    function updatePistons() {
        pistons.forEach(function (p) {
            arms[p.arm].shoulder.localToWorld(pv.set(0.14, -0.03, 0));
            pdir.copy(pv).sub(p.base);
            const dist = pdir.length();
            pdir.normalize();
            pq.setFromUnitVectors(UP, pdir);
            p.sleeve.quaternion.copy(pq);
            p.sleeve.position.copy(p.base).addScaledVector(pdir, 0.085);
            const rl = Math.max(0.02, dist - 0.05);
            p.rod.quaternion.copy(pq);
            p.rod.scale.set(1, rl, 1);
            p.rod.position.copy(pv).addScaledVector(pdir, -rl / 2);
            p.eye.position.copy(pv);
        });
    }

    /* ---------------------------------------------------------------- exhaust */
    const puffs = [];
    const puffMat = new THREE.MeshBasicMaterial({ color: 0x8a97a8, transparent: true, depthWrite: false });
    for (let i = 0; i < 14; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), puffMat.clone());
        m.visible = false;
        scene.add(m);
        puffs.push({ m: m, life: 0, max: 1 });
    }
    let puffNext = 0, puffClock = 0;

    /* ---------------------------------------------------------------- the drive, every frame */
    let chainPos = 0;
    const lm = new THREE.Matrix4(), lq = new THREE.Quaternion(), lone = new THREE.Vector3(1, 1, 1), lp = new THREE.Vector3();
    function meshAngle(g, theta1) {
        // rolling, and a gap of this gear always where a tooth of the big one comes round
        return -(28 / g.n) * (theta1 - g.phi) + g.phi + Math.PI + Math.PI / g.n;
    }
    function updateDrive(dt) {
        const e = energy / 100;
        const w1 = (energy <= 0 ? 0.05 : 0.35 + 2.4 * e) * (later ? 24 : 1);
        G1.theta += w1 * dt;
        G1.grp.rotation.y = G1.theta;
        G2.grp.rotation.y = meshAngle(G2, G1.theta);
        G3.grp.rotation.y = meshAngle(G3, G1.theta);
        const w2 = w1 * 28 / 12;
        pulley2.rotation.y = G2.grp.rotation.y;
        const v = w2 * R_P2;
        chainPos += v * dt;
        pulley1.rotation.y -= (v / R_P1) * dt;
        fly.rotation.y = pulley1.rotation.y;
        const gb = Math.max(0, Math.min(0.85, (w1 - 6) / 14));
        G1.blur.opacity = gb; G2.blur.opacity = Math.max(0, Math.min(0.85, (w2 - 6) / 14)); G3.blur.opacity = G2.blur.opacity;
        flyBlurMat.opacity = Math.max(0, Math.min(0.7, (v / R_P1 - 6) / 16));
        for (let i = 0; i < N_LINKS; i++) {
            const t = (((i * 0.03 + chainPos) / CHAIN_LEN) % 1 + 1) % 1;
            chainCurve.getPointAt(t, lp);
            lq.setFromUnitVectors(new THREE.Vector3(1, 0, 0), chainCurve.getTangentAt(t));
            lm.compose(lp, lq, lone);
            links.setMatrixAt(i, lm);
        }
        links.instanceMatrix.needsUpdate = true;
        // the cables: pulses climbing, faster and brighter when fed; later, a steady glow
        const speed = (energy <= 0 ? 0.05 : 0.25 + 1.8 * e) * (later ? 3 : 1);
        cableUniforms.forEach(function (u) {
            u.uFlow.value += speed * dt;
            u.uBright.value = energy <= 0 ? 0.35 : 0.5 + 0.9 * e;
            u.uGlow.value += ((later && energy > 0 ? 1 : 0) - u.uGlow.value) * Math.min(1, dt * 3);
        });
        // exhaust: a puff now and then, often when it works hard
        puffClock += dt;
        const every = energy <= 0 ? Infinity : later ? 0.07 : 1.6 - 1.25 * e;
        if (puffClock > every) {
            puffClock = 0;
            const p = puffs[puffNext++ % puffs.length];
            p.life = p.max = 1.4 + Math.random() * 0.6;
            p.m.position.copy(EX_TOP);
            p.m.visible = true;
            p.drift = new THREE.Vector3((Math.random() - 0.3) * 0.05, 0.22 + Math.random() * 0.08, (Math.random() - 0.5) * 0.05);
        }
        puffs.forEach(function (p) {
            if (p.life <= 0) { p.m.visible = false; return; }
            p.life -= dt;
            const k = 1 - p.life / p.max;
            p.m.position.addScaledVector(p.drift, dt);
            p.m.scale.setScalar(0.025 + k * 0.07);
            p.m.material.opacity = 0.35 * (1 - k);
        });
        updatePistons();
    }

    /* ---------------------------------------------------------------- sparks */
    const NSP = 600;
    const spPos = new Float32Array(NSP * 3), spCol = new Float32Array(NSP * 3);
    const spVel = new Float32Array(NSP * 3), spLife = new Float32Array(NSP), spMax = new Float32Array(NSP);
    for (let i = 0; i < NSP; i++) spPos[i * 3 + 1] = -100;
    const spGeo = new THREE.BufferGeometry();
    spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
    spGeo.setAttribute('color', new THREE.BufferAttribute(spCol, 3));
    const sparks = new THREE.Points(spGeo, new THREE.PointsMaterial({
        size: 0.035, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    sparks.frustumCulled = false;
    scene.add(sparks);
    let spNext = 0;
    const tmpV = new THREE.Vector3();
    function burst(at, n) {
        for (let k = 0; k < n; k++) {
            const i = spNext++ % NSP;
            spPos[i * 3] = at.x; spPos[i * 3 + 1] = at.y; spPos[i * 3 + 2] = at.z;
            const a = Math.random() * Math.PI * 2, u = Math.random() * 2 - 1, s = 0.6 + Math.random() * 1.1;
            const rr = Math.sqrt(1 - u * u);
            spVel[i * 3] = Math.cos(a) * rr * s; spVel[i * 3 + 1] = Math.abs(u) * s + 0.5; spVel[i * 3 + 2] = Math.sin(a) * rr * s;
            spMax[i] = spLife[i] = 0.35 + Math.random() * 0.45;
        }
    }
    function updateSparks(dt) {
        for (let i = 0; i < NSP; i++) {
            if (spLife[i] <= 0) continue;
            spLife[i] -= dt;
            spVel[i * 3 + 1] -= 3.2 * dt;
            spPos[i * 3] += spVel[i * 3] * dt; spPos[i * 3 + 1] += spVel[i * 3 + 1] * dt; spPos[i * 3 + 2] += spVel[i * 3 + 2] * dt;
            const f = Math.max(0, spLife[i] / spMax[i]);
            // hot white to the star's amber, then out
            spCol[i * 3] = f; spCol[i * 3 + 1] = f * (0.55 + 0.4 * f); spCol[i * 3 + 2] = f * f * 0.6;
            if (spLife[i] <= 0) { spPos[i * 3 + 1] = -100; spCol[i * 3] = spCol[i * 3 + 1] = spCol[i * 3 + 2] = 0; }
        }
        spGeo.attributes.position.needsUpdate = true;
        spGeo.attributes.color.needsUpdate = true;
    }

    /* ---------------------------------------------------------------- what energy buys */
    const period = (e) => (e <= 0 ? Infinity : 6 * Math.pow(0.04, e / 100) / (later ? 50 : 1));
    const gamesADay = (e) => (e <= 0 ? 0 : Math.round(Math.pow(e, 1.5) * 0.9 * (later ? 50 : 1)));
    const fmt = (n) => n.toLocaleString('en-US').replace(/,/g, ' ');
    const elGames = document.getElementById('games');
    const elStars = document.getElementById('stars');
    const elVal = document.getElementById('energy-val');
    let shownGames = 0, shownStars = 0;
    function setEnergy(v) { energy = v; elVal.textContent = String(v); }
    slider.addEventListener('input', function () { setEnergy(Number(slider.value)); });
    setEnergy(Number(slider.value));
    document.querySelectorAll('.range button').forEach(function (b) {
        b.addEventListener('click', function () {
            later = b.dataset.r === 'later';
            document.body.classList.toggle('later', later);
            document.querySelectorAll('.range button').forEach(function (x) { x.classList.toggle('on', x === b); });
        });
    });

    /* ---------------------------------------------------------------- the games */
    const rnd = mulberry32(20261002);
    let gc = 0;
    let ringThrow = 0;
    function newGame() {
        ringThrow = Math.floor(rnd() * 3);
        mainScreen.glyph = GLYPHS[ringThrow];
    }
    let bursts = 0;
    function land(g, time) {
        const i = ((g % 3) + 3) % 3;
        const d = (i - ringThrow + 3) % 3;              // 1: the arm wins, 2: the screen wins, 0: a draw
        if (d === 1) {
            arms[i].screen.win = 0.35;
            mainScreen.noise = 0.18;
            if (bursts < 3) {
                bursts++;
                arms[i].head.getWorldPosition(tmpV);
                burst(tmpV, later ? 10 : 22);
                glass.getWorldPosition(tmpV);
                burst(tmpV, later ? 8 : 16);
            }
            flashStar(time);
        }
    }

    /* ---------------------------------------------------------------- hover */
    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoverXY = null;
    renderer.domElement.addEventListener('pointermove', function (e) {
        hoverXY = [e.clientX, e.clientY];
        mouse.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1);
    });
    renderer.domElement.addEventListener('pointerleave', function () { hoverXY = null; });
    function updateTip() {
        if (!hoverXY) { tip.classList.remove('on'); return; }
        ray.setFromCamera(mouse, camera);
        const hit = ray.intersectObjects(machineParts, false)[0];
        if (hit) {
            tip.textContent = 'The machine plays. ' + energy + ' energy a day. Each win is a star.';
            tip.style.left = (hoverXY[0] + 16) + 'px';
            tip.style.top = (hoverXY[1] + 14) + 'px';
            tip.classList.add('on');
        } else tip.classList.remove('on');
    }

    const clock = new THREE.Clock();
    let time = 0, screenClock = 0;
    newGame();
    function frame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        time += dt;
        bursts = 0;

        const T = period(energy);
        let rate = isFinite(T) ? 1 / T : 0;
        if (!rate && gc > Math.floor(gc)) rate = 1 / 4;
        const before = gc;
        gc += rate * dt;
        if (!isFinite(T) && Math.floor(gc) > Math.floor(before)) gc = Math.floor(gc);
        // every game that started or landed in this frame, the last few of them only
        const gFrom = Math.max(Math.floor(before), Math.floor(gc) - 6);
        for (let g = gFrom; g <= Math.floor(gc); g++) {
            if (g > Math.floor(before)) newGame();
            if (g + 0.48 > before && g + 0.48 <= gc) land(g, time);
        }

        const blur = Math.max(0, Math.min(1, (1.0 - T) / 0.7));
        for (let i = 0; i < 3; i++) {
            apply(arms[i], pose(i, gc, time));
            ghosts[i].forEach(function (gh, k) {
                const lag = (k + 1) * 0.055;
                apply(gh, pose(i, gc - lag, time - lag * (isFinite(T) ? T : 1)));
                const o = blur * [0.34, 0.2, 0.1][k];
                gh.mats[0].opacity = o; gh.mats[1].opacity = o;
                gh.base.visible = o > 0.01;
            });
        }


        // the screens: redrawn thirty times a second, flickering always, a little more when fed
        screenClock += dt;
        screens.forEach(function (sc) {
            sc.win = Math.max(0, sc.win - dt);
            sc.noise = Math.max(0, sc.noise - dt);
            const dip = Math.random() < 0.02 ? 0.55 : 1;
            sc.mat.color.setScalar((0.84 + Math.random() * 0.16) * dip);
        });
        if (screenClock > 1 / 30) {
            screenClock = 0;
            screens.forEach(function (sc) { drawScreen(sc, time); });
        }

        updateDrive(dt);
        updateSparks(dt);

        const tg = gamesADay(energy), ts = Math.round(tg / 3);
        shownGames += (tg - shownGames) * Math.min(1, dt * 4);
        shownStars += (ts - shownStars) * Math.min(1, dt * 4);
        elGames.textContent = fmt(Math.round(shownGames));
        elStars.textContent = fmt(Math.round(shownStars));

        controls.update();
        updateTip();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        requestAnimationFrame(frame);
    }
    frame();
    lucide.createIcons();

    window.addEventListener('resize', function () {
        W = window.innerWidth; H = window.innerHeight;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        renderer.setSize(W, H);
        labelRenderer.setSize(W, H);
    });
}
</script>
</body>
</html>
