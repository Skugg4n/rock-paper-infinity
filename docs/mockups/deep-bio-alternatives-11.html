<!DOCTYPE html>
<html lang="en">

<title>IV · THE DEEP · five tissues, mockup 11</title>
<style>
/* Mockup 11a of chapter IV: five alternatives for the biological growth, side by side.
   Ola on mockup 10 (docs/superpowers/specs/2026-10-02-chapter-iv-tree-and-bio.md): the
   organic look read as a face and was digital after all. Every panel shows the SAME scene:
   a patch of the square board with four won nodes and their traces; tissue grows in from the
   lower right corner; two nodes are overgrown, two are being fused into one, one pure growth
   stands at level 3 of 6, and vessels join them with a slow pulse.
   Rules for all five: no bilateral symmetry, no horns or spikes, no gauges, ticks or bars,
   no eyes or slits, no beige. Level is only how swollen, full or branched a growth is.
   Every shape is grown: jittered paths, varying thickness, nothing ruled. Dark, wet, cold,
   one pulse colour (arterial red, or cold teal with the toggle) so only FORM differs.
   STATIC: no game logic. The board keeps the game's rock #0a0d12 and plate #d5dbe3. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0a0d12; color: #d5dbe3; }
body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body[data-pulse="red"]  { --pulse: #a8132c; --pulse-hi: #ff4a60; }
body[data-pulse="teal"] { --pulse: #1bb9a6; --pulse-hi: #93fff0; }

header { padding: 34px 40px 10px; display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.32em; color: rgba(213, 219, 227, 0.55); }
header .rules { font-size: 11px; color: rgba(213, 219, 227, 0.35); letter-spacing: 0.04em; }
.toggle { margin-left: auto; display: flex; gap: 14px; font-size: 11px; letter-spacing: 0.1em; }
.toggle button {
    font: inherit; letter-spacing: inherit; background: none; border: 0; cursor: pointer;
    color: rgba(213, 219, 227, 0.42); padding: 4px 0; border-bottom: 1px solid transparent;
}
.toggle button.on { color: #ffffff; border-bottom-color: #ffffff; }
.toggle .sw { display: inline-block; width: 8px; height: 8px; margin-right: 7px; }

main { display: grid; grid-template-columns: repeat(2, minmax(520px, 1fr)); gap: 28px 28px; padding: 18px 40px 50px; }
figure { margin: 0; }
figure svg { display: block; width: 100%; height: auto; border: 1px solid rgba(213, 219, 227, 0.08); }
figcaption { display: flex; gap: 14px; align-items: baseline; padding: 10px 2px 0; font-size: 12px; letter-spacing: 0.24em; }
figcaption .l { color: #ffffff; font-weight: 700; }
figcaption .w { color: rgba(213, 219, 227, 0.6); }
figcaption .lv { margin-left: auto; font-size: 10px; letter-spacing: 0.08em; color: rgba(213, 219, 227, 0.32); }
.key { border: 1px solid rgba(213, 219, 227, 0.08); padding: 26px 28px; font-size: 11px; line-height: 1.9; color: rgba(213, 219, 227, 0.5); align-self: start; }
.key b { color: rgba(213, 219, 227, 0.85); font-weight: 400; letter-spacing: 0.12em; }

svg text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@keyframes pulse { to { stroke-dashoffset: -100; } }
.pulse { stroke-dasharray: 6 94; animation: pulse 6.5s linear infinite; }
.pulse.soft { stroke-dasharray: 14 86; }
@keyframes pd { to { stroke-dashoffset: -50; } }
.pdots { stroke-dasharray: 0.5 7 0.5 15 0.5 4 0.5 21; animation: pd 7s linear infinite; }
@keyframes pore { 0%, 100% { opacity: 0.12; } 45% { opacity: 1; } }
.pore { animation: pore 4.5s ease-in-out infinite; }
@keyframes beat { 0%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.beat { animation: beat 4.5s ease-in-out infinite; }
@keyframes slosh { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(1.2px, 0.8px); } }
.slosh { animation: slosh 5s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1.4deg); } }
</style>

<body data-pulse="red">

<header>
    <h1>IV · THE DEEP · FIVE TISSUES · MOCKUP 11</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <radialGradient id="gSac" cx="0.34" cy="0.3" r="0.8">

<main id="sheet"></main>

<script>
(function () {
'use strict';

/* ---------------------------------------------------------------- the shared scene */
const W = 600, H = 420;
const PL = '#d5dbe3', RK = '#0a0d12';
const op = (a) => 'rgba(213,219,227,' + a + ')';
const PULSE = 'var(--pulse)', PULSE_HI = 'var(--pulse-hi)';
const SQ = 34;
/* four won squares: two to be fused (drawn pulled in and tilted), two overgrown */
const F1 = { x: 130, y: 135, dx: 17, dy: 7, rot: 8, l: 'OUTPUT' };
const F2 = { x: 270, y: 135, dx: -19, dy: 5, rot: -5, l: 'FEED' };
const O1 = { x: 440, y: 178, l: 'YIELD' };
const O2 = { x: 300, y: 300, l: 'BEDS' };
const HY = [199, 150];          // where the two become one
const BIO = [484, 322];          // the pure growth, level 3 of 6
const CORNER = [600, 420];
const TRACES = [
    [[0, 135], [130, 135]], [[130, 135], [270, 135]], [[270, 135], [440, 135], [440, 178]],
    [[130, 135], [130, 300], [300, 300]], [[300, 300], [380, 300], [380, 420]],
    [[440, 178], [560, 178], [560, 0]], [[270, 135], [270, 0]]
];
/* the vessels' courses: the same in every panel, each style grows its own along them */
const V = [
    [[600, 420], [566, 388], [524, 352], [494, 330]],
    [[474, 326], [420, 334], [356, 320], [318, 306]],
    [[490, 306], [502, 262], [474, 214], [452, 194]],
    [[292, 288], [262, 232], [232, 186], [212, 160]],
    [[430, 172], [384, 154], [300, 158], [220, 152]],
    [[600, 352], [566, 334], [530, 330], [502, 326]],
    [[548, 420], [520, 386], [500, 356], [488, 338]]
];

/* ---------------------------------------------------------------- hand tools */
function rng(seed) {
    let a = seed >>> 0;
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
const f1 = (n) => n.toFixed(1);
function crPts(P, k) {
    const out = [];
    for (let i = 0; i < P.length - 1; i++) {
        const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
        for (let j = 0; j < k; j++) {
            const t = j / k, t2 = t * t, t3 = t2 * t;
            out.push([0, 1].map(function (c) {
                return 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3);
            }));
        }
    }
    out.push(P[P.length - 1].slice());
    return out;
}
function noiseFn(seed) {
    const r = rng(seed);
    const a = [0, 1, 2].map(function () { return { f: 0.02 + r() * 0.09, p: r() * 6.28, m: 0.4 + r() }; });
    return function (x) { return a.reduce(function (s, o) { return s + o.m * Math.sin(x * o.f + o.p); }, 0) / 2.2; };
}
function normals(pts) {
    return pts.map(function (p, i) {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
        return [-dy / L, dx / L];
    });
}
/* a hand-drawn course: through the points, with a wander across it */
function wob(P, amp, seed, k) {
    const pts = crPts(P, k || 10);
    const n = noiseFn(seed), N = normals(pts);
    let acc = 0;
    return pts.map(function (p, i) {
        if (i > 0) acc += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
        const o = amp * n(acc);
        return [p[0] + N[i][0] * o, p[1] + N[i][1] * o];
    });
}
function d(pts) { return 'M ' + pts.map(function (p) { return f1(p[0]) + ' ' + f1(p[1]); }).join(' L '); }
function ribbon(pts, wf, shift) {
    const N = normals(pts), L = [], R = [];
    pts.forEach(function (p, i) {
        const t = i / (pts.length - 1), w = wf(t, i) / 2, s = shift ? shift(t, i) : 0;
        L.push([p[0] + N[i][0] * (w + s), p[1] + N[i][1] * (w + s)]);
        R.push([p[0] - N[i][0] * (w - s), p[1] - N[i][1] * (w - s)]);
    });
    return d(L.concat(R.reverse())) + ' Z';
}
function closed(pts) {
    const n = pts.length;
    let s = 'M ' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
    for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        s += ' C ' + f1(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + f1(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
             f1(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + f1(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]);
    }
    return s + ' Z';
}
/* never round, never mirrored */
function blobPts(cx, cy, r, irr, seed, n, sx, sy) {
    const R = rng(seed);
    n = n || 11;
    const a0 = R() * 6.28, pts = [];
    for (let i = 0; i < n; i++) {
        const a = a0 + i / n * 6.28 + (R() - 0.5) * 0.4;
        const rr = r * (1 - irr / 2 + R() * irr);
        pts.push([cx + Math.cos(a) * rr * (sx || 1), cy + Math.sin(a) * rr * (sy || 1)]);
    }
    return pts;
}
function blob(cx, cy, r, irr, seed, n, sx, sy) { return closed(blobPts(cx, cy, r, irr, seed, n, sx, sy)); }
function pulseOn(path, w, dur, delay, cls) {
    return '<path class="' + (cls || 'pulse') + '" pathLength="100" d="' + path + '" fill="none" style="stroke:' + PULSE_HI +
        ';animation-duration:' + dur + 's;animation-delay:-' + delay + 's" stroke-width="' + w + '" stroke-linecap="round"/>';
}
function sqPos(s) { return s.dx !== undefined ? [s.x + s.dx, s.y + s.dy] : [s.x, s.y]; }

/* ---------------------------------------------------------------- the board under it all */
function board(id) {
    let h = '<rect width="' + W + '" height="' + H + '" fill="' + RK + '"/>';
    h += '<defs><pattern id="dots-' + id + '" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="9.5" y="9.5" width="1" height="1" fill="' + op(0.1) + '"/></pattern></defs>';
    h += '<rect width="' + W + '" height="' + H + '" fill="url(#dots-' + id + ')"/>';
    TRACES.forEach(function (t) {
        h += '<path d="' + d(t) + '" fill="none" stroke="' + op(0.7) + '" stroke-width="2"/>';
        for (let i = 1; i < t.length - 1; i++) h += '<rect x="' + (t[i][0] - 3.5) + '" y="' + (t[i][1] - 3.5) + '" width="7" height="7" fill="' + RK + '" stroke="' + op(0.7) + '" stroke-width="1.5"/>';
    });
    // where the two fused squares used to sit
    [F1, F2].forEach(function (s) {
        h += '<rect x="' + (s.x - SQ / 2) + '" y="' + (s.y - SQ / 2) + '" width="' + SQ + '" height="' + SQ + '" fill="none" stroke="' + op(0.18) + '" stroke-dasharray="2 3"/>';
    });
    return h;
}
function square(s, alpha) {
    const p = sqPos(s), rot = s.rot || 0;
    let h = '<g transform="rotate(' + rot + ' ' + p[0] + ' ' + p[1] + ')" opacity="' + (alpha === undefined ? 1 : alpha) + '">';
    h += '<rect x="' + (p[0] - SQ / 2) + '" y="' + (p[1] - SQ / 2) + '" width="' + SQ + '" height="' + SQ + '" fill="' + PL + '"/>';
    h += '<rect x="' + (p[0] - SQ / 2 + 4) + '" y="' + (p[1] - SQ / 2 + 4) + '" width="4" height="4" fill="' + RK + '"/>';
    return h + '</g>';
}
function labels() {
    let h = '';
    [[F1, -1], [F2, 1], [O1, 0], [O2, 0]].forEach(function (q) {
        const s = q[0], p = sqPos(s);
        const x = q[1] < 0 ? p[0] - 22 : q[1] > 0 ? p[0] + 22 : p[0] + 24;
        const a = q[1] < 0 ? 'end' : 'start';
        const y = q[1] !== 0 ? p[1] - 26 : p[1] - 22;
        h += '<text x="' + x + '" y="' + y + '" text-anchor="' + a + '" font-size="9" letter-spacing="0.08em" fill="' + op(0.55) + '">' + s.l + '</text>';
    });
    return h;
}

/* ================================================================ A · MYCELIUM
   Fine hyphae creeping along and across the traces; cords (rhizomorphs) carry the pulse as
   beads; nodes are clustered nodules, some of which have fruited. Level: how many fruited. */
function hypha(x, y, a, steps, depth, r, out, w) {
    const pts = [[x, y]];
    for (let i = 0; i < steps; i++) {
        a += (r() - 0.5) * 0.55;
        x += Math.cos(a) * 3.4; y += Math.sin(a) * 3.4;
        pts.push([x, y]);
        if (depth < 3 && r() < 0.07) hypha(x, y, a + (r() < 0.5 ? 0.8 : -0.8) * (0.6 + r() * 0.6), Math.floor(steps * 0.55), depth + 1, r, out, w * 0.7);
    }
    out.push('<path d="' + d(pts) + '" fill="none" stroke="#b7c2c8" stroke-width="' + f1(Math.max(0.35, w)) + '" opacity="' + (0.18 + r() * 0.35).toFixed(2) + '" stroke-linecap="round"/>');
}
function nodule(x, y, r, seed, fruit, R) {
    let h = '';
    if (fruit) {
        // a stalk leaning its own way, and a cap that is never round
        const lean = (R() - 0.3) * 1.4, len = r * (2.2 + R() * 1.4);
        const top = [x + Math.sin(lean) * len, y - Math.cos(lean) * len];
        const stalk = wob([[x, y], [x + Math.sin(lean) * len * 0.5 + (R() - 0.5) * 4, y - len * 0.5], top], 1.2, seed, 8);
        h += '<path d="' + ribbon(stalk, function (t) { return r * (0.9 - 0.45 * t); }) + '" fill="#5b666d"/>';
        const cap = blobPts(top[0] + r * 0.2, top[1], r * 1.5, 0.55, seed + 1, 9, 1.25, 0.62);
        h += '<path d="' + closed(cap) + '" fill="#9aa5ab" stroke="#1a2024" stroke-width="0.8"/>';
        h += '<path d="' + blob(top[0] + r * 0.4, top[1] + r * 0.35, r * 0.95, 0.5, seed + 2, 8, 1.2, 0.35) + '" fill="#2a3237"/>';
        h += '<path d="' + blob(top[0] - r * 0.25, top[1] - r * 0.35, r * 0.4, 0.6, seed + 3, 7, 1.6, 0.5) + '" fill="#ffffff" opacity="0.35"/>';
        h += '<path class="beat" d="' + blob(x, y + 1, r * 0.75, 0.5, seed + 4, 8) + '" style="fill:' + PULSE + ';animation-delay:-' + (seed % 9) * 0.5 + 's"/>';
    } else {
        h += '<path d="' + blob(x, y, r, 0.6, seed, 8, 1.1, 0.85) + '" fill="#232a2f" stroke="#59646b" stroke-width="0.6"/>';
        h += '<path d="' + blob(x - r * 0.3, y - r * 0.3, r * 0.3, 0.6, seed + 5, 6) + '" fill="#ffffff" opacity="0.25"/>';
    }
    return h;
}
function styleA() {
    const r = rng(101);
    let under = '', over = '';
    under += '<path d="' + blob(560, 392, 96, 0.5, 11, 13, 1.35, 1) + '" fill="#0d1215" opacity="0.95"/>';
    const hy = [];
    // along every vessel course, and across the traces
    V.forEach(function (v, i) {
        const pts = wob(v, 3, 20 + i, 10);
        for (let k = 1; k < pts.length - 1; k += 2) {
            const p = pts[k], q = pts[k + 1];
            const a = Math.atan2(q[1] - p[1], q[0] - p[0]);
            hypha(p[0], p[1], a + (r() - 0.5) * 2.2, 8 + Math.floor(r() * 10), 1, r, hy, 0.7);
        }
    });
    // a fan out of the corner
    for (let k = 0; k < 48; k++) hypha(600 - r() * 30, 420 - r() * 30, Math.PI + 0.1 + r() * 1.4, 18 + Math.floor(r() * 20), 0, r, hy, 0.9);
    // the two overgrown squares: a dense web over the half that faces the growth
    [[O1, 0.9], [O2, -0.2]].forEach(function (q) {
        const s = q[0];
        for (let k = 0; k < 36; k++) {
            hypha(s.x + 4 + r() * 22, s.y + 2 + r() * 22, q[1] + Math.PI * (r() < 0.5 ? 1 : 0) + (r() - 0.5) * 1.6, 5 + Math.floor(r() * 9), 2, r, hy, 0.55);
        }
    });
    // the fused pair: a mat between them, and cords tied to their corners
    const a = sqPos(F1), b = sqPos(F2);
    for (let k = 0; k < 70; k++) {
        const t = r();
        hypha(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t + (r() - 0.5) * 30, r() * 6.28, 4 + Math.floor(r() * 8), 2, r, hy, 0.6);
    }
    over += hy.join('');
    // cords: darker, thicker, and the pulse travels them as beads
    V.forEach(function (v, i) {
        const pts = wob(v, 3.5, 40 + i, 10);
        const w = i === 0 || i === 5 ? 3.4 : 2.2;
        over += '<path d="' + ribbon(pts, function (t) { return w * (1.15 - 0.5 * t) * (0.8 + 0.4 * Math.sin(t * 17 + i)); }) + '" fill="#2b3439"/>';
        over += '<path d="' + d(pts) + '" fill="none" stroke="#c7d0d5" stroke-width="0.5" opacity="0.35" transform="translate(-0.6,-0.8)"/>';
        over += '<path class="pdots" d="' + d(pts) + '" fill="none" style="stroke:' + PULSE_HI + ';animation-delay:-' + (i * 1.7) + 's" stroke-width="' + (w * 0.8).toFixed(1) + '" stroke-linecap="round" opacity="0.85"/>';
    });
    [[a, HY, 1], [b, HY, -1]].forEach(function (c, k) {
        for (let j = 0; j < 4; j++) {
            const p0 = [c[0][0] + (r() - 0.5) * 26, c[0][1] + (r() - 0.5) * 26];
            over += '<path d="' + d(wob([p0, [(p0[0] + c[1][0]) / 2, (p0[1] + c[1][1]) / 2 + (r() - 0.5) * 6], c[1]], 1.5, 60 + k * 9 + j, 8)) + '" fill="none" stroke="#7d888e" stroke-width="' + f1(0.8 + r()) + '"/>';
        }
    });
    // the hybrid: a crowded clump where the two meet, two of it fruited
    [[0, 0, 7, 1], [-11, 6, 5, 0], [9, 8, 6, 1], [-4, 13, 4, 0], [13, -4, 4, 0]].forEach(function (n, k) {
        over += nodule(HY[0] + n[0], HY[1] + n[1], n[2], 300 + k * 7, n[3], r);
    });
    // nodules on the overgrown squares
    over += nodule(O1.x + 12, O1.y + 9, 4, 410, 0, r) + nodule(O1.x + 4, O1.y + 14, 3, 417, 0, r);
    over += nodule(O2.x + 10, O2.y + 11, 4, 420, 1, r) + nodule(O2.x + 15, O2.y + 2, 3, 427, 0, r);
    // the pure growth: six nodules, three of them fruited
    [[0, 0, 7, 1], [-14, 5, 5, 1], [10, 9, 6, 0], [-5, 15, 5, 1], [16, -6, 4, 0], [-18, -8, 4, 0]].forEach(function (n, k) {
        over += nodule(BIO[0] + n[0] * 1.5, BIO[1] + n[1] * 1.5, n[2] * 1.45, 500 + k * 11, n[3], r);
    });
    return { under: under, over: over };
}

/* ================================================================ B · SACS
   Anatomy: a translucent membrane laid over the board, vein networks in it, soft sacs pressed
   between the squares. Level: how full a sac is with dark fluid. */
function vein(P, w, seed, depth, out, r) {
    const pts = wob(P, 2.4, seed, 10);
    out.push('<path d="' + ribbon(pts, function (t) { return w * 1.25 * (1 - 0.7 * t); }) + '" fill="#241f29"/>');
    out.push('<path d="' + d(pts) + '" fill="none" stroke="#6a4552" stroke-width="' + f1(w * 0.3) + '" opacity="0.75"/>');
    out.push('<path d="' + d(pts) + '" fill="none" stroke="#c9d3da" stroke-width="0.4" opacity="0.3" transform="translate(-0.6,-0.7)"/>');
    if (depth < 3) {
        for (let k = 2; k < pts.length - 3; k += 4 + Math.floor(r() * 4)) {
            const p = pts[k], q = pts[k + 1];
            const a = Math.atan2(q[1] - p[1], q[0] - p[0]) + (r() < 0.5 ? 1 : -1) * (0.6 + r() * 0.7);
            const L = 14 + r() * 26 * (1 - depth * 0.25);
            const e = [p[0] + Math.cos(a) * L, p[1] + Math.sin(a) * L];
            vein([p, [(p[0] + e[0]) / 2 + (r() - 0.5) * 6, (p[1] + e[1]) / 2 + (r() - 0.5) * 6], e], w * 0.55, seed * 7 + k, depth + 1, out, r);
        }
    }
    return pts;
}
function sac(x, y, rr, seed, sx, sy, fill, idx) {

    over += hose([[530, 420], [512, 398], [536, 380], [560, 404], [548, 420]], 8, 38, r, false);
    // over the overgrown squares: draped, looping back on itself
    over += hose([[478, 316], [500, 260], [470, 206], [436, 186], [412, 196], [420, 214], [446, 206], [470, 186]], 8, 24, r, true);
    over += hose([[470, 330], [400, 344], [330, 330], [300, 304], [284, 316], [296, 330], [318, 318]], 9, 25, r, true);
    // and on to the fused pair: hoses wound round both, pulling them in
    over += hose([[300, 300], [262, 246], [226, 196], [204, 164]], 8, 26, r, true);
    over += hose([[436, 180], [380, 160], [300, 168], [248, 152], [220, 146]], 7, 27, r, true);
    over += hose([[a[0] - 26, a[1] + 8], [a[0] - 8, a[1] + 26], [HY[0] - 4, HY[1] + 22], [b[0] + 4, b[1] + 26], [b[0] + 24, b[1] + 4], [b[0] + 4, b[1] - 22], [HY[0] + 6, HY[1] - 20], [a[0] - 4, a[1] - 22], [a[0] - 24, a[1] - 4]], 6, 28, r, true);
    over += clampAt(a[0] - 18, a[1] + 16, 0.8, 7, 31) + clampAt(b[0] + 20, b[1] + 12, -0.6, 7, 32);
    // the knot between the fused squares: two hoses
    over += hose([[HY[0] - 18, HY[1] + 10], [HY[0] - 2, HY[1] - 10], [HY[0] + 14, HY[1] + 4], [HY[0] - 4, HY[1] + 16], [HY[0] - 12, HY[1] + 2]], 7, 33, r, true);
    // the pure growth is a knot of three hoses, three sockets still empty
    over += hose([[BIO[0] - 30, BIO[1] + 18], [BIO[0] - 4, BIO[1] - 12], [BIO[0] + 20, BIO[1] + 6], [BIO[0] + 2, BIO[1] + 22], [BIO[0] - 12, BIO[1] + 4], [BIO[0] + 6, BIO[1] - 22]], 9, 34, r, true);
    over += hose([[BIO[0] + 34, BIO[1] - 8], [BIO[0] + 10, BIO[1] + 14], [BIO[0] - 16, BIO[1] - 2], [BIO[0] - 2, BIO[1] - 18], [BIO[0] + 18, BIO[1] - 4]], 8, 35, r, true);
    over += hose([[BIO[0] + 6, BIO[1] + 40], [BIO[0] + 14, BIO[1] + 12], [BIO[0] - 8, BIO[1] + 8], [BIO[0] - 22, BIO[1] + 22]], 7, 36, r, true);
    [[BIO[0] - 30, BIO[1] - 22, 0.6], [BIO[0] + 28, BIO[1] + 26, 2.4], [BIO[0] - 34, BIO[1] + 34, 1.9]].forEach(function (s, k) {
        // an empty socket: a short stub with a collar, open and dark
        const c = Math.cos(s[2]), sn = Math.sin(s[2]);
        over += hose([[s[0], s[1]], [s[0] + c * 7, s[1] + sn * 7], [s[0] + c * 12 + 1, s[1] + sn * 12]], 6, 40 + k, r, false);
        over += '<path d="' + blob(s[0] - c * 1, s[1] - sn * 1, 4.2, 0.55, 70 + k, 7, 1.4, 0.8) + '" fill="#000"/>';
    });
    over += clampAt(BIO[0] - 4, BIO[1] + 2, 0.3, 14, 37);
    return { under: '', over: over };
}

/* ---------------------------------------------------------------- the sheet */
const PANELS = [
    ['A', 'MYCELIUM', styleA, 'level: how many nodules have fruited'],
    ['B', 'SACS', styleB, 'level: how full the sac is'],
    ['C', 'SINEW', styleC, 'level: how thick the bundle'],
    ['D', 'CORAL', styleD, 'level: how far the lattice has closed'],
    ['E', 'TUBES', styleE, 'level: how many hoses in the knot']
];
const sheet = document.getElementById('sheet');
PANELS.forEach(function (p) {
    const id = p[0].toLowerCase();
    const s = p[2](id);
    // the squares in their order: the tissue grows over all of them
    let h = board(id) + s.under;
    [F1, F2, O1, O2].forEach(function (q) { h += square(q); });
    h += s.over + labels();
    const fig = document.createElement('figure');
    fig.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '">' + h + '</svg>' +
        '<figcaption><span class="l">' + p[0] + '</span><span class="w">' + p[1] + '</span><span class="lv">' + p[3] + '</span></figcaption>';
    sheet.appendChild(fig);
});
const key = document.createElement('div');
key.className = 'key';
key.innerHTML = '<b>THE SCENE, THE SAME IN ALL FIVE</b><br>' +
    'a patch of the board, four won squares and their traces<br>' +
    'the tissue comes in from the lower right corner<br>' +
    '<b>OUTPUT</b> and <b>FEED</b>, upper left: being fused, pulled in from where they stood (dotted)<br>' +
    '<b>YIELD</b> and <b>BEDS</b>: overgrown<br>' +
    'lower right: the pure growth, at level 3 of 6<br>' +
    'the vessels between them carry the pulse<br><br>' +
    '<b>ALL FIVE</b>: no symmetry, nothing ruled, no gauges, no eyes';
sheet.appendChild(key);

document.querySelectorAll('.toggle button').forEach(function (b) {
    b.addEventListener('click', function () {
        document.body.dataset.pulse = b.dataset.p;
        document.querySelectorAll('.toggle button').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
});
})();
</script>
