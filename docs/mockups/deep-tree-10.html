<style>
/* Mockup 10a of chapter IV: the skill tree. Mockup 9 with Ola's notes ("Ola on mockups 9" in
   docs/superpowers/specs/2026-10-02-chapter-iv-tree-and-bio.md):
   - no floating tooltips: one fixed INFO BOX under the board shows the hovered node
   - quiet hover life: the trace from the root lights up in order, the node lifts a pixel,
     its pips tick once; what can be bought breathes very slightly
   - the tissue grows OVER what is won: overgrown squares (still visible under the ribbing,
     with a bonus), and a HYBRID where two bought squares are fused into a new node
   - the tissue is Giger proper: oil black, gunmetal, pale bone ribbing, vertebrae, tubes and
     pistons; nodes are ribbed vertebral segments with a membrane window whose chambers fill
     with fluid. One arterial colour for the pulse, in two palettes to choose from (A / B)
   - a fourth tab, fusion, plays one fusion on a loop
   STATIC: no game logic, every number is by hand.

   THE BOARD is unchanged from 9: rock #0a0d12 and plate #d5dbe3 at different strengths, plus
   the bright outline #ffffff on what can be bought. THE VOICE keeps Surface's tone #cfc9bb;
   once Biological begins its threads take the pulse colour. Gradients only inside the tissue. */

* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; background: #0a0d12; color: #d5dbe3; }
body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
body[data-pal="A"] { --pulse: #b3122a; --pulse-hi: #ff5566; --pulse-dk: #3a030b; }
body[data-pal="B"] { --pulse: #1fd3bd; --pulse-hi: #a8fff3; --pulse-dk: #03363a; }

#tabs {
    position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 20;
    display: flex; align-items: center; gap: 26px; padding: 0 40px;
    background: #0a0d12; font-size: 11px; letter-spacing: 0.12em;
}
#tabs .mark { color: rgba(213, 219, 227, 0.32); margin-right: 14px; }
.tab, .pal button {
    font: inherit; letter-spacing: inherit; background: none; border: 0; cursor: pointer;
    color: rgba(213, 219, 227, 0.42); padding: 6px 0; border-bottom: 1px solid transparent;
}
.tab:hover, .pal button:hover { color: rgba(213, 219, 227, 0.8); }
.tab.on, .pal button.on { color: #ffffff; border-bottom-color: #ffffff; }
#tabs .ver { margin-left: auto; color: rgba(213, 219, 227, 0.22); font-size: 10px; }

section.state { height: 100vh; padding-top: 36px; scroll-snap-align: start; position: relative; }
section.state svg.board { display: block; width: 100%; height: 100%; }
section.state + section.state { border-top: 1px solid rgba(213, 219, 227, 0.06); }

/* the palette choice, inside the biological tab and the fusion tab */
.pal {
    position: absolute; top: 48px; right: 40px; z-index: 5;
    display: flex; gap: 18px; align-items: center; font-size: 11px; letter-spacing: 0.1em;
}
.pal .lbl { color: rgba(213, 219, 227, 0.3); font-size: 10px; letter-spacing: 0.3em; }
.pal .sw { display: inline-block; width: 8px; height: 8px; margin-right: 7px; vertical-align: 0; }

svg text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* hover life: a lift of one pixel, the pips tick once, the path from the root lights in order */
.node { cursor: default; transition: transform 140ms ease-out; }
.node.hov { transform: translateY(-1px); }
@keyframes tick { 0% { opacity: 1; } 45% { opacity: 0.2; } 100% { opacity: 1; } }
.node.tick .pip { animation: tick 260ms ease-out 1 both; animation-delay: calc(var(--i) * 22ms); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.lit { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 110ms linear forwards; }
/* what can be bought breathes, barely */
@keyframes bo { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.55; } }
.breathe-o { animation: bo 3.6s ease-in-out infinite; }

/* tissue */
@keyframes pulse { to { stroke-dashoffset: -100; } }
.pulse { stroke-dasharray: 5 95; animation: pulse 5.5s linear infinite; }
.pulse.wide { stroke-dasharray: 9 91; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.006); } }
.breathe { transform-box: view-box; transform-origin: 1420px 900px; animation: breathe 9s ease-in-out infinite; }
@keyframes piston { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
.piston { animation: piston 5.5s ease-in-out infinite; }
@keyframes slosh { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(0.8px); } }
.fluid { animation: slosh 4s ease-in-out infinite; }

@keyframes caret { 50% { opacity: 0; } }
.caret { animation: caret 1s steps(1) infinite; }
</style>

    let s = f(n / Math.pow(10, 3 * t));
    if (Number(s) >= 1000) { t++; s = f(n / Math.pow(10, 3 * t)); }
    return s + ' ' + SUF[t];

function nodeLook(st, id) {

    const lvl = s[0], next = s[1], ring = s[2];
    const greyed = ring === 'o';
    const parentOk = !PARENT[id] || (st[PARENT[id]] && st[PARENT[id]][0] > 0);
    let label, price = null, priceC = null;

        price = priceText(id, lvl);
        priceC = next === 'buy' ? BR : op(0.36);

/* ---------------------------------------------------------------- the info box */
function infoFor(sid, id) {
    const st = STATE[sid];
    if (id === 'hybrid') {
        return { name: HYBRID.name, lvl: HYBRID.lvl, cost: 'grown', eff: HYBRID.eff, x: HYBRID.extra, xc: BONE, bio: 1 };
    }
    if (BIO[id]) {
        const b = BIO[id];
        const out = { name: b.name, lvl: b.lvl + ' / ' + b.max, eff: b.eff, bio: 1 };
        if (b.sf === 'o') { out.cost = 'not ours to open'; out.eff = '. . .'; }
        else if (b.lvl >= b.max) out.cost = 'grown';
        else if (b.cost) out.cost = 'next ' + star(b.cost[0]) + ' + ' + b.cost[1] + ' people';
        if (b.sf === 'f') { out.x = '"' + LINES[6].text + '"'; out.xc = WARM; }
        return out;
    }
    const n = N[id], s = st[id];
    if (!s) return null;
    const out = { name: n.name.replace('\n', ' '), lvl: n.big ? '' : s[0] + ' / ' + (n.max || 1), eff: n.eff };
    if (n.big) { out.cost = ''; }
    else if (s[2] === 'o') { out.cost = 'not ours to open'; out.eff = '. . .'; }
    else if (s[1] === 'max') out.cost = s[0] > 0 ? 'bought' : '';
    else out.cost = 'next ' + priceText(id, s[0], true);
    if (s[2] === 'f') {
        const l = LINES.filter(function (x) { return x.to === id; })[0];
        if (l) { out.x = '"' + l.text + '"'; out.xc = WARM; }
    }
    if (sid === 'c' && OVERGROWN[id]) { out.lvl += ', ' + OVERGROWN[id]; out.bio = 1; }
    if (sid === 'c' && FUSED[id]) { out.lvl += ', fused into ' + FUSED[id]; out.bio = 1; }
    return out;
}

/* ---------------------------------------------------------------- the night log */
function nightLog(sid, upTo) {
    let h = '', y = 92;
    const tracesOut = [];
    h += text(40, 66, 'NIGHT LOG', { s: 9, c: WARM, op: 0.55, ls: '0.32em' });
    LINES.slice(0, upTo).forEach(function (l, i) {
        let fs = 16, lh = 22, c = WARM, o = 1;
        if (sid === 'c') {
            if (l.n <= 4) { fs = 13; lh = 17; o = 0.5; }
            else if (l.n <= 6) { fs = 15; lh = 20; o = 0.8; }
            else { fs = 19; lh = 25; c = '#e9e6dc'; }
        }
        const maxCh = Math.floor(282 / (fs * CW));
        const rows = wrap(l.text, maxCh);
        h += text(40, y, 'NIGHT ' + l.n, { s: 9, c: WARM, op: o * 0.55, ls: '0.28em' });
        const ty = y + 9 + fs;
        let endX = 40;
        rows.forEach(function (r, k) {
            h += text(40, ty + k * lh, r, { s: fs, c: c, op: o });
            if (k === 0) endX = 40 + r.length * fs * CW;
        });
        if (l.typing) {
            const last = rows[rows.length - 1];
            const cx = 40 + last.length * fs * CW + 2;
            h += '<rect class="caret" x="' + cx + '" y="' + (ty + (rows.length - 1) * lh - fs * 0.78) + '" width="' + (fs * 0.55) + '" height="' + (fs * 0.95) + '" fill="' + c + '"/>';
        }
        if (l.to) tracesOut.push({ i: i, l: l, x: endX + 8, y: ty - fs * 0.33, o: o });
        y = ty + (rows.length - 1) * lh + (sid === 'c' && l.n <= 4 ? 24 : 30);
    });
    return { svg: h, traces: tracesOut };
}

/* dotted threads from a line to what it opened: Surface's tone, then the pulse once bio begins */
function logTraces(list, bio) {
    let h = '';
    let nb = 0, nt = 0;
    const col = bio ? 'stroke:' + PULSE : 'stroke:' + WARM;
    const fillc = bio ? 'fill:' + PULSE : 'fill:' + WARM;
    list.forEach(function (t) {
        const l = t.l;
        const isBio = !!BIO[l.to];
        const node = isBio ? BIO[l.to] : N[l.to];
        const half = isBio ? node.r : S / 2;
        const nx = node.x + BX, ny = node.y + BY;
        const cx = 322 + 5 * t.i;
        let pts = [[t.x, t.y], [cx, t.y]];
        if (l.how === 'left') {
            const yy = l.to === 'question' ? ny + 10 : ny;
            pts.push([cx, yy], [nx - half, yy]);
        } else if (l.how === 'topleft') {
            const yt = BY - 14 - 5 * nt++;
            const vx = nx - half - 30;
            pts.push([cx, yt], [vx, yt], [vx, ny + 8], [nx - half, ny + 8]);
        } else if (l.how === 'top') {
            const yt = BY - 14 - 5 * nt++;
            pts.push([cx, yt], [nx, yt], [nx, ny - node.r * 1.1]);
        } else if (l.how === 'bottomleft') {
            const yb = BY + BH + 14 + 5 * nb++;
            const vx = nx - half - 12;
            pts.push([cx, yb], [vx, yb], [vx, ny + 8], [nx - half, ny + 8]);
        } else if (l.how === 'bottomright') {
            const yb = BY + BH + 14 + 5 * nb++;
            const vx = nx + half + 22;
            pts.push([cx, yb], [vx, yb], [vx, ny + 6], [nx + half, ny + 6]);
        }
        const o = Math.min(1, 0.5 + 0.4 * t.o);
        h += '<path d="' + poly(pts) + '" fill="none" style="' + col + '" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="0.1 3.4" opacity="' + o.toFixed(2) + '"/>';
        h += '<rect x="' + (t.x - 2) + '" y="' + (t.y - 2) + '" width="4" height="4" style="' + fillc + '" opacity="' + o.toFixed(2) + '"/>';
        const e = pts[pts.length - 1];
        h += '<rect x="' + (e[0] - 2) + '" y="' + (e[1] - 2) + '" width="4" height="4" style="' + fillc + '"/>';
    });
    return h;
}

/* ---------------------------------------------------------------- the tissue: Giger */
function tube(b, w0, w1, n, seed, tMax) {
    const out = [];
    const r = rng(seed);
    const ph = r() * 6;
    const tm = tMax === undefined ? 1 : tMax;
    for (let i = 0; i <= n; i++) {
        const t = i / n * tm;
        const p = bez(b, t), d = bezD(b, t);
        const len = Math.hypot(d[0], d[1]) || 1;
        let nx = -d[1] / len, ny = d[0] / len;
        if (nx * -0.7 + ny * -0.7 < 0) { nx = -nx; ny = -ny; }
        const w = (w0 + (w1 - w0) * t) * (1 + 0.1 * Math.sin(t * 34 + ph));
        out.push({ p: p, n: [nx, ny], t: [d[0] / len, d[1] / len], w: w });
    }
    return out;
}

    const L = [], R = [];

        const hw = o.w * k / 2, sx = o.n[0] * o.w * shift, sy = o.n[1] * o.w * shift;
        L.push([o.p[0] + o.n[0] * hw + sx, o.p[1] + o.n[1] * hw + sy]);
        R.push([o.p[0] - o.n[0] * hw + sx, o.p[1] - o.n[1] * hw + sy]);
    });

}

    let h = '';
    h += '<path d="' + tubeOutline(T_, 1.0, 0) + '" fill="' + OIL + '"/>';
    h += '<path d="' + tubeOutline(T_, 0.74, 0) + '" fill="' + (dim ? '#15191c' : '#262c33') + '"/>';
    h += '<path d="' + tubeOutline(T_, 0.22, 0.18) + '" fill="' + (dim ? '#4a5157' : '#a3abb2') + '" opacity="' + (dim ? 0.45 : 0.7) + '"/>';

        const q = T_[i], hw = q.w / 2;
        const a = [q.p[0] + q.n[0] * hw, q.p[1] + q.n[1] * hw];
        const c = [q.p[0] - q.n[0] * hw, q.p[1] - q.n[1] * hw];
        const m = [q.p[0] + q.t[0] * hw * 0.55, q.p[1] + q.t[1] * hw * 0.55];
        const d = 'M ' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' Q ' + m[0].toFixed(1) + ' ' + m[1].toFixed(1) + ' ' + c[0].toFixed(1) + ' ' + c[1].toFixed(1);
        h += '<path d="' + d + '" fill="none" stroke="#000" stroke-width="' + (q.w > 6 ? 1.3 : 0.8) + '" opacity="0.8"/>';
        if (q.w > 5 && !dim) h += '<path d="' + d + '" fill="none" stroke="' + BONE + '" stroke-width="0.5" opacity="0.35" transform="translate(-0.7,-0.7)"/>';
    }
    if (o.pulse) {
        const centre = poly(T_.map(function (q) { return q.p; }));
        const delay = (-(seed % 50) / 10).toFixed(1);
        h += '<path class="pulse wide" pathLength="100" d="' + centre + '" fill="none" style="stroke:' + PULSE + ';animation-delay:' + delay + 's" stroke-width="' + (w0 * 0.85).toFixed(1) + '" stroke-linecap="round" opacity="0.35"/>';
        h += '<path class="pulse" pathLength="100" d="' + centre + '" fill="none" style="stroke:' + PULSE_HI + ';animation-delay:' + delay + 's" stroke-width="' + (w0 * 0.34).toFixed(1) + '" stroke-linecap="round" opacity="0.95"/>';
    }
    return h;
}

function blobPath(cx, cy, rx, ry, rot, seed, k) {
    const r = rng(seed), pts = [];
    const n = k || 9;
    for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2;
        const j = 0.85 + r() * 0.25;
        const x = Math.cos(a) * rx * j, y = Math.sin(a) * ry * j;
        const c = Math.cos(rot), s = Math.sin(rot);
        pts.push([cx + x * c - y * s, cy + x * s + y * c]);
    }
    let d = 'M ' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ' C ' + c1[0].toFixed(1) + ' ' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ' ' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d + ' Z';
}

/* ribbed wall inside a clip: arcs fanning from a far point, each with a pale lip */
function ribWall(cx, cy, from, to, step) {
    let h = '';
    for (let rr = from; rr < to; rr += step) {
        const rx = rr * 1.18, ry = rr * 0.82;
        const d = 'M ' + (cx - rx) + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 0 1 ' + cx + ' ' + (cy - ry) + ' A ' + rx + ' ' + ry + ' 0 0 1 ' + (cx + rx) + ' ' + cy;
        h += '<path d="' + d + '" fill="none" stroke="#000" stroke-width="' + (2.4 + 1.4 * Math.sin(rr * 0.09)).toFixed(2) + '" opacity="0.7"/>';
        h += '<path d="' + d + '" fill="none" stroke="' + BONE + '" stroke-width="0.7" opacity="0.13" transform="translate(-1.4,-1.4)"/>';
    }
    return h;
}

/* a piston: a gunmetal sleeve and a bright rod that works in and out */
function piston(a, b, w) {
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let h = '<g transform="translate(' + a[0] + ',' + a[1] + ') rotate(' + ang.toFixed(1) + ')">';
    h += '<rect x="0" y="' + (-w / 2) + '" width="' + (len * 0.58) + '" height="' + w + '" rx="' + (w * 0.3) + '" fill="url(#gGun)" stroke="' + OIL + '" stroke-width="1"/>';
    for (let k = 1; k < 5; k++) h += '<rect x="' + (len * 0.58 * k / 5) + '" y="' + (-w / 2) + '" width="1.4" height="' + w + '" fill="' + BONE + '" opacity="0.35"/>';
    h += '<g class="piston"><rect x="' + (len * 0.5) + '" y="' + (-w * 0.2) + '" width="' + (len * 0.46) + '" height="' + (w * 0.4) + '" fill="url(#gRod)" stroke="' + OIL + '" stroke-width="0.6"/>';
    h += '<rect x="' + (len * 0.94) + '" y="' + (-w * 0.45) + '" width="' + (w * 0.5) + '" height="' + (w * 0.9) + '" rx="1.5" fill="url(#gBone)" stroke="' + OIL + '" stroke-width="0.6"/></g>';
    return h + '</g>';
}

/* A node of the body: a ribbed vertebral segment. Pale bone processes, a gunmetal body,
   and a membrane window whose chambers fill with fluid, one chamber a level. Never an eye. */
function segment(x, y, r, o) {
    const live = o.live, open = o.open, locked = !live && !open;
    const boneG = locked ? 'gBoneDim' : 'gBone';
    const gunG = locked ? 'gGunDim' : 'gGun';
    let h = '<g class="node" data-id="' + o.id + '"' + (locked ? ' opacity="0.7"' : '') + '>';
    // transverse processes, swept back and pointed, mirrored
    const proc = function (sx, k) {
        const s = k || 1;
        return 'M ' + (x + sx * r * 0.85) + ' ' + (y - r * 0.2 * s) +
            ' C ' + (x + sx * r * 1.4) + ' ' + (y - r * 0.45 * s) + ' ' + (x + sx * r * 1.9) + ' ' + (y - r * 0.3 * s) + ' ' + (x + sx * r * 2.35) + ' ' + (y - r * 0.85 * s) +
            ' C ' + (x + sx * r * 2.0) + ' ' + (y + r * 0.05 * s) + ' ' + (x + sx * r * 1.45) + ' ' + (y + r * 0.28 * s) + ' ' + (x + sx * r * 0.85) + ' ' + (y + r * 0.3 * s) + ' Z';
    };
    [-1, 1].forEach(function (sx) {
        h += '<path d="' + proc(sx) + '" fill="url(#' + boneG + ')" stroke="' + OIL + '" stroke-width="0.9"/>';
        if (o.hybrid) h += '<path d="' + proc(sx, -1) + '" fill="url(#' + boneG + ')" stroke="' + OIL + '" stroke-width="0.9"/>';
        // a pedicle hooking down
        h += '<path d="M ' + (x + sx * r * 0.45) + ' ' + (y + r * 0.6) + ' C ' + (x + sx * r * 0.6) + ' ' + (y + r * 1.05) + ' ' + (x + sx * r * 0.75) + ' ' + (y + r * 1.2) + ' ' + (x + sx * r * 0.95) + ' ' + (y + r * 1.3) +
             ' C ' + (x + sx * r * 0.75) + ' ' + (y + r * 0.95) + ' ' + (x + sx * r * 0.72) + ' ' + (y + r * 0.8) + ' ' + (x + sx * r * 0.7) + ' ' + (y + r * 0.55) + ' Z" fill="url(#' + boneG + ')" stroke="' + OIL + '" stroke-width="0.7"/>';
    });
    // the spinous process, a fin up the middle
    h += '<path d="M ' + (x - r * 0.28) + ' ' + (y - r * 0.6) + ' Q ' + (x - r * 0.05) + ' ' + (y - r * 1.0) + ' ' + x + ' ' + (y - r * 1.45) +
         ' Q ' + (x + r * 0.05) + ' ' + (y - r * 1.0) + ' ' + (x + r * 0.28) + ' ' + (y - r * 0.6) + ' Z" fill="url(#' + boneG + ')" stroke="' + OIL + '" stroke-width="0.8"/>';
    if (o.core) {

        [-1, 1].forEach(function (sy) {
            const dy = y + sy * r * 0.78;
            h += '<rect x="' + (x - r * 1.15) + '" y="' + (dy - r * 0.13) + '" width="' + (r * 2.3) + '" height="' + (r * 0.26) + '" rx="' + (r * 0.13) + '" fill="url(#gBone)" stroke="' + OIL + '" stroke-width="0.9"/>';
            for (let q = -4; q <= 4; q++) h += '<line x1="' + (x + q * r * 0.24) + '" y1="' + (dy - r * 0.12) + '" x2="' + (x + q * r * 0.24) + '" y2="' + (dy + r * 0.12) + '" stroke="#000" stroke-width="0.8" opacity="0.6"/>';
        });
    }
    // the body

    h += '<rect x="' + (x - r) + '" y="' + (y - bh / 2) + '" width="' + bw + '" height="' + bh + '" rx="' + (r * 0.32) + '" fill="url(#' + gunG + ')" stroke="' + OIL + '" stroke-width="1.3"/>';
    // pale rib bands top and bottom, and grooves
    h += '<rect x="' + (x - r * 0.96) + '" y="' + (y - bh / 2 + 1) + '" width="' + (bw * 0.96) + '" height="' + (r * 0.16) + '" rx="' + (r * 0.08) + '" fill="url(#' + boneG + ')" opacity="0.9"/>';
    h += '<rect x="' + (x - r * 0.96) + '" y="' + (y + bh / 2 - r * 0.17 - 1) + '" width="' + (bw * 0.96) + '" height="' + (r * 0.16) + '" rx="' + (r * 0.08) + '" fill="url(#' + boneG + ')" opacity="0.9"/>';
    [-1, 1].forEach(function (sx) {
        for (let k = 0; k < 3; k++) {

    h += '<rect x="' + wx + '" y="' + wy + '" width="' + ww + '" height="' + wh + '" rx="1.2" fill="#020303" stroke="' + BONE + '" stroke-width="0.8" opacity="0.95"/>';
    // graduations along the top of the gauge
    for (let g = 1; g < 12; g++) {
        const gx = wx + ww * g / 12;
        h += '<line x1="' + gx.toFixed(2) + '" y1="' + (wy - 2.6) + '" x2="' + gx.toFixed(2) + '" y2="' + (wy - (g % 3 === 0 ? 0.2 : 1.2)) + '" stroke="' + BONE + '" stroke-width="0.5" opacity="0.6"/>';

    const cw = (ww - 4) / n;
    for (let i = 0; i < n; i++) {
        const cx0 = wx + 2 + i * cw;

        h += '<g class="fluid" style="animation-delay:-' + (i * 0.4) + 's"><rect class="pip" style="--i:' + i + '" x="' + (cx0 + 0.4).toFixed(2) + '" y="' + (wy + wh - 1.5 - fh).toFixed(2) + '" width="' + Math.max(0.6, cw - 0.8).toFixed(2) + '" height="' + fh.toFixed(2) + '" fill="url(#gFluid)" opacity="' + (full ? 1 : 0.5) + '"/></g>';
        if (i > 0) h += '<line x1="' + cx0.toFixed(2) + '" y1="' + (wy + 1) + '" x2="' + cx0.toFixed(2) + '" y2="' + (wy + wh - 1) + '" stroke="' + BONE + '" stroke-width="0.5" opacity="0.6"/>';
    }
    // the membrane's sheen
    h += '<path d="M ' + (wx + 1.5) + ' ' + (wy + 1.4) + ' L ' + (wx + ww - 1.5) + ' ' + (wy + 1.4) + '" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>';
    if (open) {
        h += '<rect class="breathe-o" x="' + (x - r - 3.5) + '" y="' + (y - bh / 2 - 3.5) + '" width="' + (bw + 7) + '" height="' + (bh + 7) + '" rx="' + (r * 0.4) + '" fill="none" stroke="' + BONE + '" stroke-width="1.1"/>';
    }
    if (o.sf) {
        const rx = x + r * 1.1, ry = y - bh / 2 - 6;
        h += o.sf === 'f'
            ? '<circle cx="' + rx + '" cy="' + ry + '" r="3.6" style="fill:' + PULSE + '" stroke="' + BONE + '" stroke-width="0.8"/>'
            : '<circle cx="' + rx + '" cy="' + ry + '" r="3.6" fill="none" stroke="' + BONE + '" stroke-width="1.1" opacity="0.8"/>';
    }
    if (o.label) h += o.label;
    return h + '</g>';
}

/* a culture vat: a ribbed capsule on end, its fluid at the level bought */
function vat(x, y, r, o) {

    for (let i = 0; i < o.max; i++) {
        const cy0 = wy + wh - 2 - (i + 1) * ch;
        if (i < o.lvl) h += '<g class="fluid" style="animation-delay:-' + i * 0.3 + 's"><rect class="pip" style="--i:' + i + '" x="' + (wx + 1.2) + '" y="' + (cy0 + 0.6).toFixed(2) + '" width="' + (ww - 2.4) + '" height="' + (ch - 1.2).toFixed(2) + '" fill="url(#gFluid)"/></g>';
        h += '<line x1="' + wx + '" y1="' + cy0.toFixed(2) + '" x2="' + (wx + ww) + '" y2="' + cy0.toFixed(2) + '" stroke="' + BONE + '" stroke-width="0.5" opacity="0.55"/>';
    }
    for (let k = -5; k <= 5; k++) {
        h += '<path d="M ' + (x - w / 2) + ' ' + (y + k * 4) + ' Q ' + (x - w * 0.3) + ' ' + (y + k * 4 + 2) + ' ' + (x - w * 0.24) + ' ' + (y + k * 4) + '" stroke="#000" stroke-width="0.9" fill="none" opacity="0.7"/>';
        h += '<path d="M ' + (x + w / 2) + ' ' + (y + k * 4) + ' Q ' + (x + w * 0.3) + ' ' + (y + k * 4 + 2) + ' ' + (x + w * 0.24) + ' ' + (y + k * 4) + '" stroke="#000" stroke-width="0.9" fill="none" opacity="0.7"/>';
    }
    h += '<rect x="' + (x - w / 2 - 3) + '" y="' + (y - hgt / 2 - 1) + '" width="' + (w + 6) + '" height="5" rx="2.5" fill="url(#gBone)" stroke="' + OIL + '" stroke-width="0.7"/>';
    h += '<rect x="' + (x - w / 2 - 3) + '" y="' + (y + hgt / 2 - 4) + '" width="' + (w + 6) + '" height="5" rx="2.5" fill="url(#gBone)" stroke="' + OIL + '" stroke-width="0.7"/>';
    if (o.label) h += o.label;
    return h + '</g>';
}

function bioNode(id) {
    const b = BIO[id];
    const live = b.lvl > 0, open = !!b.buy, locked = !live && !open;
    const nameC = locked ? BONE_LOW : open && !live ? '#ffffff' : BONE;
    let price = null;
    if (b.sf !== 'o' && b.lvl < b.max && b.cost) price = [star(b.cost[0]), '+ ' + b.cost[1] + ' people'];
    let label = '';
    const below = b.kind === 'vat' ? b.y + b.r * 1.2 + 14 : b.y + b.r * 1.3 + 14;
    if (b.lab === 'l') {
        label += text(b.x - b.r * 2.4 - 6, b.y + 4, b.name, { a: 'end', c: nameC, ls: '0.06em' });
    } else {
        label += text(b.x, below, b.name, { a: 'middle', c: nameC, ls: '0.06em' });
        if (price) price.forEach(function (pl, k) { label += text(b.x, below + 12 + k * 11, pl, { a: 'middle', c: open ? '#ffffff' : BONE_MID }); });
    }
    if (b.kind === 'vat') return vat(b.x, b.y, b.r, { id: id, lvl: b.lvl, max: b.max, label: label });
    return segment(b.x, b.y, b.r, { id: id, lvl: b.lvl, max: b.max, live: live, open: open, sf: b.sf, core: b.kind === 'core', label: label });
}

/* ---------------------------------------------------------------- one state */
const MECH_IDS = Object.keys(N);

function render(svg) {
    const sid = svg.dataset.state;
    const st = STATE[sid];
    const bio = sid === 'c';
    let h = '';
    h += '<rect x="0" y="0" width="1440" height="930" fill="' + RK + '"/>';
    h += '<g transform="translate(' + BX + ',' + BY + ')">';
    h += boardBase(sid);
    h += traces(st);
    h += '<g class="lit-layer"></g>';
    h += tags(st);
    h += '</g>';

    let log = null;
    if (sid !== 'a') log = nightLog(sid, sid === 'b' ? 4 : 9);
    if (sid === 'b') h += logTraces(log.traces, false);

    h += '<g transform="translate(' + BX + ',' + BY + ')">';
    MECH_IDS.forEach(function (id) {
        if (!st[id]) return;
        if (bio && (OVERGROWN[id] || FUSED[id])) return;
        h += mechNode(st, id, sid);
    });
    if (bio) {
        h += massSvg(sid);
        Object.keys(OVERGROWN).forEach(function (id, k) { h += overgrow(st, id, sid, k); });
        h += hybridSvg(st, sid);
        h += text(720, 862, 'BIOLOGICAL', { s: 9, c: BONE_MID, ls: '0.32em' });
    }
    h += '</g>';

    if (bio) {
        h += logTraces(log.traces, true);
        h += '<g transform="translate(' + BX + ',' + BY + ')">';
        h += vessels();
        Object.keys(BIO).forEach(function (id) { h += bioNode(id); });
        h += '</g>';
    }

    if (log) h += log.svg;
    h += legend();
    h += infoBoxSvg();
    svg.innerHTML = h;

    // hover: the info box, the path from the root lit in order, a lift, the pips tick once
    const litLayer = svg.querySelector('.lit-layer');
    function chainTo(id) {
        let c = id;
        if (BIO[c]) c = 'question';
        if (c === 'hybrid') c = 'seam';
        const chain = [];
        while (PARENT[c]) { chain.unshift(c); c = PARENT[c]; }
        return chain;
    }
    svg.querySelectorAll('.node').forEach(function (g) {
        const id = g.dataset.id;
        g.addEventListener('mouseenter', function () {
            setInfo(svg, infoFor(sid, id));
            g.classList.add('hov');
            g.classList.remove('tick'); void g.getBoundingClientRect(); g.classList.add('tick');
            litLayer.innerHTML = '';
            const chain = chainTo(id);
            const step = chain.length ? 300 / chain.length : 0;
            chain.forEach(function (c, i) {
                const src = svg.querySelector('path[data-child="' + c + '"]');
                if (!src) return;
                const p = src.cloneNode(false);
                p.removeAttribute('data-child');
                p.removeAttribute('stroke-dasharray');
                p.setAttribute('stroke', BR);
                p.setAttribute('stroke-width', '2');
                p.setAttribute('pathLength', '1');
                p.setAttribute('class', 'lit');
                p.style.animationDelay = Math.round(i * step) + 'ms';
                litLayer.appendChild(p);
            });
        });
        g.addEventListener('mouseleave', function () {
            setInfo(svg, null);
            g.classList.remove('hov', 'tick');
            litLayer.innerHTML = '';
        });
    });
}

document.querySelectorAll('svg.board[data-state]').forEach(render);

/* ---------------------------------------------------------------- d · fusion, on a loop
   Output and The machine: feed, both won. The tissue rises, reaches each, draws them
   together and fuses them into ORGANOID CELL. Then it lets go and plays again. */
(function fusion() {
    const svg = document.getElementById('fusion');
    const A0 = [560, 330], B0 = [880, 330], C = [720, 345];
    const SZ = 72;
    let h = '<rect x="0" y="0" width="1440" height="930" fill="' + RK + '"/>';
    h += '<defs><pattern id="dots-d" width="20" height="20" patternUnits="userSpaceOnUse"><rect x="9.5" y="9.5" width="1" height="1" fill="' + op(0.1) + '"/></pattern>' +
         '<clipPath id="fclip"><path d="M 350 700 C 380 590 520 560 720 560 C 920 560 1060 590 1090 700 Z"/></clipPath></defs>';
    h += '<rect x="330" y="110" width="780" height="580" fill="url(#dots-d)"/>';
    h += '<rect x="330.5" y="110.5" width="779" height="579" fill="none" stroke="' + op(0.16) + '"/>';
    h += text(350, 135, 'POWER', { s: 9, c: op(0.34), ls: '0.32em' });
    h += '<g id="f-steps"></g>';
    h += '<g id="f-stage"></g>';
    h += infoBoxSvg();
    svg.innerHTML = h;
    const stage = svg.querySelector('#f-stage');
    const stepsG = svg.querySelector('#f-steps');
    const STEPS = ['1 won', '2 reached', '3 drawn together', '4 fused'];

    const MASSF = 'M 350 700 C 380 590 520 560 720 560 C 920 560 1060 590 1090 700 Z';
    const FRIBS = ribWall(720, 760, 20, 420, 9);
    function bigSquare(x, y, rot, alpha, name, lvl, max) {
        let s = '<g transform="rotate(' + rot.toFixed(2) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')" opacity="' + alpha.toFixed(2) + '">';
        s += '<rect x="' + (x - SZ / 2) + '" y="' + (y - SZ / 2) + '" width="' + SZ + '" height="' + SZ + '" fill="' + PL + '"/>';
        s += '<rect x="' + (x - SZ / 2 + 6) + '" y="' + (y - SZ / 2 + 6) + '" width="7" height="7" fill="' + RK + '"/>';
        for (let i = 0; i < max; i++) {
            const px = x + SZ / 2 + 6 + Math.floor(i / 5) * 11, py = y - SZ / 2 + 2 + (i % 5) * 12;
            s += i < lvl ? '<rect x="' + px + '" y="' + py + '" width="8" height="8" fill="' + PL + '"/>'
                         : '<rect x="' + (px + 0.5) + '" y="' + (py + 0.5) + '" width="7" height="7" fill="none" stroke="' + op(0.32) + '"/>';
        }
        return s + '</g>';
    }
    function ribsOver(x, y, a) {
        if (a <= 0.01) return '';
        let s = '<g opacity="' + a.toFixed(2) + '">';
        const d = blobPath(x, y, 52, 46, 0.3, 77, 9);
        s += '<path d="' + d + '" fill="' + OIL + '" opacity="0.4"/>';
        for (let j = -6; j <= 6; j++) {
            const yy = y + j * 8;
            const half = Math.sqrt(Math.max(0, 1 - Math.pow(j / 6.6, 2))) * 50;
            const dd = 'M ' + (x - half) + ' ' + yy + ' Q ' + x + ' ' + (yy + 9) + ' ' + (x + half) + ' ' + yy;
            s += '<path d="' + dd + '" fill="none" stroke="#000" stroke-width="3" opacity="0.7"/>';
            s += '<path d="' + dd + '" fill="none" stroke="' + BONE + '" stroke-width="1" opacity="0.5" transform="translate(0,-1.6)"/>';
        }
        return s + '</g>';
    }
    const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const clamp = (t) => Math.max(0, Math.min(1, t));
    const seg = (t, a, b) => clamp((t - a) / (b - a));
    const LOOP = 10.5;
    const FIX = new URLSearchParams(location.search).get('t');
    let lastHold = false;

    function frame(now) {
        // ?t=7 holds the loop at one moment (for a still)
        const t = FIX !== null ? Number(FIX) : (now / 1000) % LOOP;
        const k = ease(seg(t, 1.0, 2.4));                 // the mass rises
        const reach = ease(seg(t, 2.2, 3.6));             // vessels reach the squares
        const pull = ease(seg(t, 3.8, 5.6));              // drawn together
        const fuse = ease(seg(t, 5.3, 6.4));              // the hybrid forms
        const fade = 1 - ease(seg(t, 9.4, 10.2));         // and it lets go
        const hold = t >= 6.5 && t < 9.4;
        const step = t < 2.2 ? 0 : t < 3.8 ? 1 : t < 5.5 ? 2 : 3;
        stepsG.innerHTML = STEPS.map(function (w, i) {
            return text(350 + i * 150, 92, w, { s: 10, c: i === step ? BR : op(0.3), ls: '0.1em' });
        }).join('');
        if (hold && lastHold) { requestAnimationFrame(frame); return; }
        lastHold = hold;

        const ax = A0[0] + (C[0] - 58 - A0[0]) * pull, ay = A0[1] + (C[1] - A0[1]) * pull;
        const bx = B0[0] + (C[0] + 58 - B0[0]) * pull, by = B0[1] + (C[1] - B0[1]) * pull;
        let s = '<g opacity="' + fade.toFixed(3) + '">';
        // the trace between them, bright: both are won
        s += '<path d="M ' + ax + ' ' + ay + ' L ' + bx + ' ' + by + '" stroke="' + op(0.78 * (1 - fuse)) + '" stroke-width="2"/>';
        // the mass, rising from the bottom of the board
        if (k > 0) {
            s += '<g transform="translate(0,700) scale(1,' + k.toFixed(3) + ') translate(0,-700)">';
            s += '<path d="' + MASSF + '" fill="url(#gMass)"/>';
            s += '<g clip-path="url(#fclip)">' + FRIBS + '</g>';
            s += '</g>';
        }
        s += '</g>';
        // squares
        s += '<g opacity="' + fade.toFixed(3) + '">';
        s += bigSquare(ax, ay, -9 * pull, 1 - 0.35 * pull - 0.15 * fuse, 'OUTPUT', 10, 10);
        s += bigSquare(bx, by, 8 * pull, 1 - 0.35 * pull - 0.15 * fuse, 'FEED', 6, 8);
        s += ribsOver(ax, ay, pull * 0.9);
        s += ribsOver(bx, by, pull * 0.9);
        // labels: the old names fade as the new one comes
        // the old names ride with their squares, outward, and fade as the new one comes
        s += text(ax + SZ / 2, ay + SZ / 2 + 22, 'OUTPUT', { a: 'end', c: op(0.9 * (1 - fuse)), ls: '0.06em', s: 12 });
        s += text(bx - SZ / 2, by + SZ / 2 + 22, 'THE MACHINE: FEED', { a: 'start', c: op(0.9 * (1 - fuse)), ls: '0.06em', s: 12 });
        // vessels: up from the mass to each square, then between them
        if (reach > 0) {
            s += tubeSvg([[620, 600], [600, 480], [ax + 10, ay + 80], [ax + 6, ay + SZ / 2]], 14, 9, 201, { tMax: reach, pulse: hold });
            s += tubeSvg([[820, 600], [840, 480], [bx - 10, by + 80], [bx - 6, by + SZ / 2]], 14, 9, 202, { tMax: reach, pulse: hold });
        }
        if (pull > 0) {
            s += tubeSvg([[ax + 20, ay - 18], [ax + 40, ay - 70], [bx - 40, by - 70], [bx - 20, by - 18]], 9, 9, 203, { tMax: Math.min(1, pull * 1.4), pulse: hold });
            s += tubeSvg([[ax + 26, ay + 24], [ax + 50, ay + 50], [bx - 50, by + 50], [bx - 26, by + 24]], 8, 8, 204, { tMax: Math.min(1, pull * 1.4), pulse: hold });
        }
        if (fuse > 0) {
            const r = 10 + 24 * fuse;
            s += '<g opacity="' + fuse.toFixed(3) + '">';
            s += segment(C[0], C[1], Math.max(1, r), { lvl: 1, max: 1, live: 1, hybrid: 1, id: 'fusion' });
            s += text(C[0], C[1] + 100, 'ORGANOID CELL', { a: 'middle', c: BONE, ls: '0.1em', s: 13, w: 700 });
            s += '</g>';
        }
        s += '</g>';
        stage.innerHTML = s;

        // the info box tells the step
        if (fuse > 0.6) setInfo(svg, { name: 'ORGANOID CELL', lvl: 'fused: Output 10/10 + The machine: feed 6/8', cost: 'grown',
            eff: 'generators and the machine are one organ: energy ×20, games ×4', x: 'the machine needs no feeding now; it is fed', xc: BONE, bio: 1 });
        else if (t > 2.2) setInfo(svg, { name: 'OUTPUT + THE MACHINE: FEED', lvl: '10 / 10 + 6 / 8', cost: 'both won', eff: 'the tissue is drawing them together', bio: 1 });
        else setInfo(svg, null);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();

/* ---------------------------------------------------------------- tabs and palette */
const tabs = document.querySelectorAll('.tab');
tabs.forEach(function (t) {
    t.addEventListener('click', function () {
        document.getElementById('state-' + t.dataset.to).scrollIntoView({ behavior: 'smooth' });
    });
});
const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        const k = e.target.id.slice(6);
        tabs.forEach(function (t) { t.classList.toggle('on', t.dataset.to === k); });
    });
}, { threshold: 0.55 });
document.querySelectorAll('section.state').forEach(function (s) { io.observe(s); });

document.querySelectorAll('.pal button').forEach(function (b) {
    b.addEventListener('click', function () {
        document.body.dataset.pal = b.dataset.p;
        document.querySelectorAll('.pal button').forEach(function (x) { x.classList.toggle('on', x.dataset.p === b.dataset.p); });
    });
});
})();
</script>
