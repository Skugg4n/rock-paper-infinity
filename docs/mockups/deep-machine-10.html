<style>
/* Mockup 10b of chapter IV: the rock, paper, scissors machine. Mockup 9 with Ola's notes
   ("Ola on mockups 9" in docs/superpowers/specs/2026-10-02-chapter-iv-tree-and-bio.md):
   - a CRT on a short mast at the top shows the throw it plays against; the three arms end in
     small CRT heads showing gem, file-text and scissors (glyphs drawn on canvas textures,
     with scanlines, a rolling band and a flicker)
   - it stands in its OWN ROOM on top: a plate with low cut-away walls. No lid, no hatch.
     To one side a narrow ESCAPE PASSAGE goes up through the crust: hand-hewn, lumpy,
     rubble at its mouth
   - energy comes up as blue dashed threads from below, through the floor into the base,
     faster and thicker the more it is fed
   - a win throws sparks off the winning head and the screen, and a star
   - "later": the same slider times fifty, to show how fast it can run when it has grown
   STATIC: no game logic beyond the toy itself. Every number is by hand.
   Two colours as the colony (light plate #d5dbe3, dark rock #0a0d12), darker joints #5b6676,
   the crust #353e4a as in the game. Phosphor, energy blue and the star's amber are the only
   lights. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
    background-color: #0a0d12;
    color: #8fa1b6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

#scene { position: fixed; inset: 0; }
#scene canvas { display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.win { opacity: 0; color: #d9a25f; }
.win svg { width: 18px; height: 18px; fill: #d9a25f; }
.win.go { animation: win 760ms ease-out forwards; }
@keyframes win {
    0%   { opacity: 0; transform: translateY(6px) scale(0.4); }
    18%  { opacity: 1; transform: translateY(0) scale(1.25); }
    60%  { opacity: 1; transform: translateY(-10px) scale(1); }
    100% { opacity: 0; transform: translateY(-22px) scale(0.85); }
}

.chrome { position: fixed; z-index: 10; }
#feed { left: 72px; top: 50%; transform: translateY(-50%); width: 250px; }

.big { font-size: 34px; font-weight: 700; color: #dbe4f0; line-height: 1; }
.mid { font-size: 22px; font-weight: 700; color: #c3cfdd; line-height: 1; }

input[type=range] {

}

    width: 16px; height: 16px; border-radius: 9999px; background: #d5dbe3; margin-top: -6px; border: 0;
}
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 9999px; background: #d5dbe3; border: 0; }
body.later input[type=range]::-webkit-slider-thumb { background: #5aa2ff; }

.range { display: flex; gap: 8px; margin-top: 12px; }
.range button {
    white-space: nowrap;
    font: inherit; font-size: 11px; letter-spacing: 0.08em; cursor: pointer;
    border: 0; border-radius: 9999px; padding: 5px 12px;
    background: #1e2733; color: #7d8fa5;
}
.range button.on { background: #d5dbe3; color: #0a0d12; }
.range button[data-r="later"].on { background: #5aa2ff; color: #0a0d12; }

#tip {
    position: fixed; z-index: 30; pointer-events: none; opacity: 0;
    background-color: #2a3442; color: #dbe4f0; padding: 6px 12px; border-radius: 8px;
    font-size: 13px; white-space: nowrap; transition: opacity 0.15s;
}

.chapter-mark { font-family: 'Bebas Neue', system-ui, sans-serif; letter-spacing: 0.06em; font-size: 22px; color: #394453; }
#fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 12px; color: #55637a; }
</style>

    <span class="mono" style="font-size:11px; color:#2f3949;">the machine, in its room</span>
</div>
<div class="chrome mono" style="right:72px; bottom:34px; font-size:10px; color:#2f3949;">mockup 0.10</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const ROCK = 0x0a0d12;
const PLATE = 0xd5dbe3;
const LANE = 0x7b8595;
const JOINT = 0x5b6676;
const CRUST = 0x353e4a;
const RUBBLE = 0x4a5361;
const ENERGY = 0x4f9bff;

const PLATE_W = 2.0, PLATE_H = 0.26;
const TOP = PLATE_H / 2;
const H0 = 0.58;                    // the shoulders
const R0 = 0.2;
const L1 = 0.38, L2 = 0.34;
const RING_Y = H0 + 0.3;
const CRT_Y = 1.24;                 // the screen at the top
const D2R = Math.PI / 180;
const GLYPHS = ['gem', 'file-text', 'scissors'];

/* lucide's own paths for chapter I's three glyphs, drawn on the screens */
const PATHS = {
    'gem': ['M6 3h12l4 6-10 13L2 9Z', 'M11 3 8 9l4 13 4-13-3-6', 'M2 9h20'],
    'file-text': ['M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z', 'M14 2v4a2 2 0 0 0 2 2h4', 'M10 9H8', 'M16 13H8', 'M16 17H8'],
    'scissors': ['M9 6a3 3 0 1 1-6 0a3 3 0 1 1 6 0', 'M9 18a3 3 0 1 1-6 0a3 3 0 1 1 6 0', 'M20 4 8.12 15.88', 'M14.47 14.48 20 20', 'M8.12 8.12 12 12']
};
const P2D = {};
Object.keys(PATHS).forEach(function (k) { P2D[k] = PATHS[k].map(function (d) { return new Path2D(d); }); });

const host = document.getElementById('scene');
const labelHost = document.getElementById('labels');
const slider = document.getElementById('energy');
const tip = document.getElementById('tip');

let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('fallback').style.display = 'flex'; }

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

if (renderer) {
    let W = window.innerWidth, H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(W, H);
    renderer.setClearColor(ROCK, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    host.appendChild(renderer.domElement);
    const labelRenderer = new CSS2DRenderer({ element: labelHost });
    labelRenderer.setSize(W, H);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(ROCK);

    const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 100);
    camera.position.set(3.9, 2.55, 4.7);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.6, 0.62, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.minDistance = 1.6;
    controls.maxDistance = 11;
    controls.minPolarAngle = 0.3;
    controls.maxPolarAngle = 1.75;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.3;
    controls.update();
    controls.addEventListener('start', function () { controls.autoRotate = false; });
    renderer.domElement.addEventListener('wheel', function () { controls.autoRotate = false; }, { passive: true });

    scene.add(new THREE.AmbientLight(0xffffff, 0.34));
    const lamp = new THREE.PointLight(0xffffff, 9, 0, 1.25);
    lamp.position.set(1.0, 4.2, 1.6);
    scene.add(lamp);

    const plateMat = new THREE.MeshLambertMaterial({ color: PLATE });
    const jointMat = new THREE.MeshLambertMaterial({ color: JOINT });
    const laneMat = new THREE.MeshBasicMaterial({ color: LANE });
    const crustMat = new THREE.MeshLambertMaterial({ color: CRUST, flatShading: true, side: THREE.DoubleSide });
    const rubbleMat = new THREE.MeshLambertMaterial({ color: RUBBLE, flatShading: true });

    const machineParts = [];
    function add(mesh, parent, isMachine) {
        (parent || scene).add(mesh);
        if (isMachine) machineParts.push(mesh);
        return mesh;
    }

    /* ---------------------------------------------------------------- the room */
    add(new THREE.Mesh(new THREE.BoxGeometry(PLATE_W, PLATE_H, PLATE_W), plateMat));
    const R = 0.8, LW = 0.14, span = 2 * R + LW;
    [[0, -R, span, LW], [0, R, span, LW], [-R, 0, LW, span], [R, 0, LW, span],
     [(R + 0.97) / 2, 0, 0.97 - R, LW]].forEach(function (c) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(c[2], 0.02, c[3]), laneMat);
        m.position.set(c[0], TOP + 0.002, c[1]);
        add(m);
    });
    // low walls, cut away: tall at the corners, low along the middle; a doorway on the passage side
    const WT = 0.06, TALL = 0.4, LOW = 0.12;
    function wall(cx, cz, len, alongX, h) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(alongX ? len : WT, h, alongX ? WT : len), plateMat);
        m.position.set(cx, TOP + h / 2, cz);
        add(m);
    }
    const E = PLATE_W / 2 - WT / 2;
    [[0, -E, true], [0, E, true], [-E, 0, false], [E, 0, false]].forEach(function (w, k) {
        const along = w[2];
        [[-0.75, 0.5, TALL], [0, 1.0, LOW], [0.75, 0.5, TALL]].forEach(function (sg) {
            if (k === 3 && sg[1] === 1.0) return;              // the doorway to the passage
            wall(along ? sg[0] : w[0], along ? w[1] : sg[0], sg[1], along, sg[2]);
        });
    });

    /* ---------------------------------------------------------------- the crust and the passage up */
    const crust = add(new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.3, 1.05, 6, 1, 6), crustMat));
    crust.position.set(1.86, 1.96, 0);
    {
        const pos = crust.geometry.attributes.position;
        const r = mulberry32(44);
        for (let i = 0; i < pos.count; i++) {
            if (pos.getY(i) > 0) pos.setY(i, pos.getY(i) + (r() - 0.5) * 0.06);
        }
        crust.geometry.computeVertexNormals();
    }
    // hand-hewn: a lumpy tube, every vertex pushed by hand, faceted
    const passCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0.98, TOP + 0.12, 0.0),
        new THREE.Vector3(1.28, TOP + 0.22, 0.05),
        new THREE.Vector3(1.52, 0.68, -0.08),
        new THREE.Vector3(1.66, 1.18, 0.07),
        new THREE.Vector3(1.78, 1.68, -0.05),
        new THREE.Vector3(1.84, 2.2, 0.02)
    ]);
    const passGeo = new THREE.TubeGeometry(passCurve, 46, 0.12, 8, false);
    {
        const pos = passGeo.attributes.position, nor = passGeo.attributes.normal;
        const r = mulberry32(77);
        const ring = 9;
        // one push per ring and per vertex: lumps along it and round it, never a clean bore
        const ringPush = [];
        for (let i = 0; i <= 46; i++) ringPush.push((r() - 0.5) * 0.05);
        for (let i = 0; i < pos.count; i++) {
            const k = (r() - 0.5) * 0.06 + ringPush[Math.floor(i / ring)];
            pos.setXYZ(i, pos.getX(i) + nor.getX(i) * k, pos.getY(i) + nor.getY(i) * k, pos.getZ(i) + nor.getZ(i) * k);
        }
        passGeo.computeVertexNormals();
    }
    add(new THREE.Mesh(passGeo, crustMat));
    // a rough landing outside the doorway, and rubble round the mouth
    {
        const r = mulberry32(91);
        for (let i = 0; i < 4; i++) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(0.16 + r() * 0.1, 0.08 + r() * 0.05, 0.16 + r() * 0.12), crustMat);
            m.position.set(1.05 + r() * 0.2, TOP - 0.02 + r() * 0.04, -0.12 + r() * 0.24);
            m.rotation.set((r() - 0.5) * 0.3, r() * 3, (r() - 0.5) * 0.3);
            add(m);
        }
        for (let i = 0; i < 14; i++) {
            const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.035 + r() * 0.06, 0), rubbleMat);
            const a = r() * Math.PI * 2, d = 0.15 + r() * 0.22;
            m.position.set(1.84 + Math.cos(a) * d, 2.14 + r() * 0.04, Math.sin(a) * d);
            m.rotation.set(r() * 3, r() * 3, r() * 3);
            add(m);
        }
    }

    /* ---------------------------------------------------------------- screens */
    function makeScreen(glyph, ring) {
        const c = document.createElement('canvas');
        c.width = 128; c.height = 96;
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        const mat = new THREE.MeshBasicMaterial({ map: tex });
        return { c: c, ctx: c.getContext('2d'), tex: tex, mat: mat, glyph: glyph, win: 0, noise: 0, roll: Math.random(), ring: ring };
    }
    function drawScreen(sc, time) {
        const ctx = sc.ctx, w = 128, h = 96;
        const hot = sc.win > 0;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = hot ? '#2a1b07' : '#06110f';
        ctx.fillRect(0, 0, w, h);
        if (sc.noise > 0) {
            for (let i = 0; i < 260; i++) {
                ctx.fillStyle = 'rgba(207,238,230,' + (Math.random() * 0.7).toFixed(2) + ')';
                ctx.fillRect(Math.random() * w, Math.random() * h, 2, 1);
            }
        } else {
            const col = hot ? '#ffd27e' : '#cdeee5';
            ctx.save();
            const k = 2.6;
            ctx.translate(w / 2 - 12 * k, h / 2 - 12 * k);
            ctx.scale(k, k);
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = col;
            ctx.shadowColor = col;
            ctx.shadowBlur = 6;
            P2D[sc.glyph].forEach(function (p) { ctx.stroke(p); });
            ctx.restore();
        }
        // scanlines, a rolling band, the dark round the edge of the glass
        ctx.fillStyle = 'rgba(0,0,0,0.38)';
        for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
        const y0 = ((time * 34 + sc.roll * 120) % 130) - 18;
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fillRect(0, y0, w, 12);
        const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, w * 0.66);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        sc.tex.needsUpdate = true;
    }

    /* ---------------------------------------------------------------- the machine */
    const axle = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.24, 16), jointMat), null, true);
    axle.position.y = TOP + 0.12;
    const fly = new THREE.Group();
    fly.position.y = TOP + 0.11;
    scene.add(fly);
    const rim = add(new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.032, 10, 64), plateMat), fly, true);
    rim.rotation.x = Math.PI / 2;
    for (let i = 0; i < 6; i++) {
        const sp = add(new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.022, 0.035), plateMat), fly, true);
        sp.rotation.y = i * Math.PI / 3;
        sp.position.set(Math.cos(i * Math.PI / 3) * 0.23, 0, -Math.sin(i * Math.PI / 3) * 0.23);
    }
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.05, 20), jointMat), fly, true);
    const weight = add(new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.07), jointMat), fly, true);
    weight.position.set(0.46, 0, 0);

    const hub = add(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 0.36, 24), plateMat), null, true);
    hub.position.y = TOP + 0.31;
    const collar = add(new THREE.Mesh(new THREE.TorusGeometry(0.142, 0.02, 8, 32), jointMat), null, true);
    collar.rotation.x = Math.PI / 2;
    collar.position.y = H0 - 0.035;
    const cap = add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 0.04, 24), jointMat), null, true);
    cap.position.y = TOP + 0.51;

    // the ring, and the mast that carries it and the screen above it
    const mastTop = CRT_Y - 0.13;
    const mast = add(new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, mastTop - (TOP + 0.53), 8), jointMat), null, true);
    mast.position.y = (mastTop + TOP + 0.53) / 2;
    const ring = add(new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.017, 10, 40), plateMat), null, true);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = RING_Y;

    // the CRT at the top: what it plays against. It turns to face you, like a toy
    const crt = new THREE.Group();
    crt.position.y = CRT_Y;
    scene.add(crt);
    add(new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.28, 0.24), plateMat), crt, true);
    const back = add(new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.2, 0.14), plateMat), crt, true);
    back.position.z = -0.17;
    const bezel = add(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.23, 0.02), jointMat), crt, true);
    bezel.position.z = 0.12;
    const mainScreen = makeScreen('gem', true);
    const glass = add(new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.2), mainScreen.mat), crt, true);
    glass.position.z = 0.131;
    [-1, 1].forEach(function (s) {
        const knob = add(new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.03, 10), jointMat), crt, true);
        knob.rotation.x = Math.PI / 2;
        knob.position.set(0.15, s * 0.06 - 0.02, 0.13);
        knob.scale.set(0.8, 0.8, 0.8);
    });
    const antenna = add(new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.16, 6), jointMat), crt, true);
    antenna.position.set(-0.1, 0.21, -0.05);
    antenna.rotation.z = 0.35;

    // the stars a win throws up, over the screen
    const stars = [];
    for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'win';
        el.innerHTML = '<i data-lucide="star"></i>';
        const o = new CSS2DObject(el);
        o.position.set(0, CRT_Y + 0.28, 0);
        scene.add(o);
        stars.push(el);
    }
    let starNext = 0, starLast = -1;
    function flashStar(time) {
        if (time - starLast < 0.12) return;
        starLast = time;
        const el = stars[starNext++ % stars.length];
        el.classList.remove('go');
        void el.offsetWidth;
        el.classList.add('go');
    }

    /* ---------------------------------------------------------------- the arms, with CRT heads */
    function makeArm(mats, withHead, glyph) {
        const base = new THREE.Group();
        const shoulder = new THREE.Group();
        shoulder.position.set(R0, H0, 0);
        base.add(shoulder);
        const parts = [];
        const sj = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.1, 16), mats.joint);
        sj.rotation.x = Math.PI / 2;
        shoulder.add(sj); parts.push(sj);
        const upper = new THREE.Mesh(new THREE.BoxGeometry(L1, 0.05, 0.06), mats.plate);
        upper.position.x = L1 / 2;
        shoulder.add(upper); parts.push(upper);
        const elbow = new THREE.Group();
        elbow.position.x = L1;
        shoulder.add(elbow);
        const ej = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.085, 14), mats.joint);
        ej.rotation.x = Math.PI / 2;
        elbow.add(ej); parts.push(ej);
        const fore = new THREE.Mesh(new THREE.BoxGeometry(L2, 0.042, 0.05), mats.plate);
        fore.position.x = L2 / 2;
        elbow.add(fore); parts.push(fore);
        const head = new THREE.Group();
        head.position.x = L2 + 0.04;
        elbow.add(head);
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.09, 0.09), mats.plate);
        head.add(box); parts.push(box);
        let screen = null;
        if (withHead) {
            screen = makeScreen(glyph, false);
            // the screen on the end and on the top, so it reads from anywhere
            const fb = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.078, 0.078), mats.joint);
            fb.position.x = 0.052; head.add(fb);
            const f = new THREE.Mesh(new THREE.PlaneGeometry(0.066, 0.066), screen.mat);
            f.rotation.y = Math.PI / 2; f.position.x = 0.059; head.add(f);
            const tb = new THREE.Mesh(new THREE.BoxGeometry(0.078, 0.012, 0.078), mats.joint);
            tb.position.y = 0.047; head.add(tb);
            const t = new THREE.Mesh(new THREE.PlaneGeometry(0.066, 0.066), screen.mat);
            t.rotation.x = -Math.PI / 2; t.rotation.z = -Math.PI / 2; t.position.y = 0.054; head.add(t);
            parts.push(fb, f, tb, t);
            parts.forEach(function (m) { machineParts.push(m); });
        }
        scene.add(base);
        return { base: base, shoulder: shoulder, elbow: elbow, head: head, screen: screen };
    }

    const arms = [], ghosts = [];
    for (let i = 0; i < 3; i++) {
        const a = makeArm({ plate: plateMat, joint: jointMat }, true, GLYPHS[i]);
        const yaw = i * 2 * Math.PI / 3 + Math.PI / 6;
        a.base.rotation.y = yaw;
        arms.push(a);
        const gs = [];
        for (let k = 0; k < 3; k++) {
            const pm = new THREE.MeshLambertMaterial({ color: PLATE, transparent: true, opacity: 0, depthWrite: false });
            const jm = new THREE.MeshLambertMaterial({ color: JOINT, transparent: true, opacity: 0, depthWrite: false });
            const g = makeArm({ plate: pm, joint: jm }, false);
            g.base.rotation.y = yaw;
            g.mats = [pm, jm];
            gs.push(g);
        }
        ghosts.push(gs);
    }
    const screens = [mainScreen].concat(arms.map(function (a) { return a.screen; }));

    function ik(x, y) {
        const d2 = x * x + y * y;
        const c = Math.max(-1, Math.min(1, (d2 - L1 * L1 - L2 * L2) / (2 * L1 * L2)));
        const phi = Math.acos(c);
        const theta = Math.atan2(y, x) - Math.atan2(L2 * Math.sin(phi), L1 + L2 * Math.cos(phi));
        return [theta, phi];
    }
    // the head comes down beside the ring, under the screen
    const HIT = ik(-R0 + 0.15, RING_Y + 0.06 - H0);

    let energy = 40;
    let later = false;
    function rest(i, time) {
        const k = Math.sqrt(energy / 100);
        let th = (-24 + 30 * k) * D2R, ph = (-14 + 10 * k) * D2R;
        th += Math.sin(time * (0.5 + k) + i * 2.1) * (0.5 + 2.5 * k) * D2R;
        return [th, ph];
    }
    const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    const inOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
    const easeIn = (t) => t * t * t;
    function pose(i, gc, time) {
        const g = Math.floor(gc), p = gc - g;
        const r = rest(i, time);
        if (gc <= 0 || ((g % 3) + 3) % 3 !== i) return r;
        const wind = [r[0] - 12 * D2R, r[1] - 26 * D2R];
        if (p < 0.22) return mix(r, wind, inOut(p / 0.22));
        if (p < 0.48) return mix(wind, HIT, easeIn((p - 0.22) / 0.26));
        if (p < 0.62) {
            const b = Math.sin((p - 0.48) / 0.14 * Math.PI) * 4 * D2R;
            return [HIT[0] + b, HIT[1] - b * 0.6];
        }
        return mix(HIT, r, inOut((p - 0.62) / 0.38));
    }
    function apply(a, ps) { a.shoulder.rotation.z = ps[0]; a.elbow.rotation.z = ps[1]; }

    /* ---------------------------------------------------------------- energy, coming up from below */
    const THREADS = [];
    {
        const r = mulberry32(5150);
        for (let i = 0; i < 6; i++) {
            const a = i / 6 * Math.PI * 2 + r() * 0.5;
            const sx = Math.cos(a) * (1.3 + r() * 0.5), sz = Math.sin(a) * (1.3 + r() * 0.5);
            const end = [Math.cos(a) * 0.025, Math.sin(a) * 0.025];
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(sx, -2.6, sz),
                new THREE.Vector3(sx * 0.72, -1.5, sz * 0.72),
                new THREE.Vector3(sx * 0.3, -0.55, sz * 0.3),
                new THREE.Vector3(end[0] * 2, -TOP, end[1] * 2),
                new THREE.Vector3(end[0], TOP + 0.06, end[1])
            ]);
            THREADS.push({ curve: curve, len: curve.getLength(), phase: r() });
        }
    }
    const DASH = 0.1, GAP = 0.11;
    const perThread = THREADS.map(function (t) { return Math.ceil(t.len / (DASH + GAP)) + 1; });
    const nDash = perThread.reduce(function (a, b) { return a + b; }, 0);
    const energyMat = new THREE.MeshBasicMaterial({ color: ENERGY, transparent: true, opacity: 0.9, depthWrite: false });
    const dashes = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 6), energyMat, nDash);
    dashes.frustumCulled = false;
    scene.add(dashes);
    const dm = new THREE.Matrix4(), dq = new THREE.Quaternion(), dpos = new THREE.Vector3(), dscl = new THREE.Vector3();
    const UP = new THREE.Vector3(0, 1, 0);
    let flow = 0;
    function updateThreads(dt) {
        const e = energy / 100;
        const speed = (0.06 + 1.1 * e) * (later ? 4 : 1);
        flow += speed * dt;
        const rad = energy <= 0 ? 0.0035 : (0.005 + 0.013 * e) * (later ? 1.5 : 1);
        energyMat.opacity = energy <= 0 ? 0.3 : 0.55 + 0.4 * e;
        let k = 0;
        THREADS.forEach(function (t, ti) {
            const step = DASH + GAP;
            const off = ((flow + t.phase * step) % step + step) % step;
            for (let j = 0; j < perThread[ti]; j++) {
                const s0 = j * step + off - step;
                const a = Math.max(0, s0), b = Math.min(t.len, s0 + DASH);
                if (b <= a) {
                    dm.makeScale(0, 0, 0);
                    dashes.setMatrixAt(k++, dm);
                    continue;
                }
                const um = (a + b) / 2 / t.len;
                t.curve.getPointAt(um, dpos);
                const tan = t.curve.getTangentAt(um);
                dq.setFromUnitVectors(UP, tan);
                dscl.set(rad, b - a, rad);
                dm.compose(dpos, dq, dscl);
                dashes.setMatrixAt(k++, dm);
            }
        });
        dashes.instanceMatrix.needsUpdate = true;
    }

    /* ---------------------------------------------------------------- sparks */
    const NSP = 600;
    const spPos = new Float32Array(NSP * 3), spCol = new Float32Array(NSP * 3);
    const spVel = new Float32Array(NSP * 3), spLife = new Float32Array(NSP), spMax = new Float32Array(NSP);
    for (let i = 0; i < NSP; i++) spPos[i * 3 + 1] = -100;
    const spGeo = new THREE.BufferGeometry();
    spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
    spGeo.setAttribute('color', new THREE.BufferAttribute(spCol, 3));
    const sparks = new THREE.Points(spGeo, new THREE.PointsMaterial({
        size: 0.035, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    sparks.frustumCulled = false;
    scene.add(sparks);
    let spNext = 0;
    const tmpV = new THREE.Vector3();
    function burst(at, n) {
        for (let k = 0; k < n; k++) {
            const i = spNext++ % NSP;
            spPos[i * 3] = at.x; spPos[i * 3 + 1] = at.y; spPos[i * 3 + 2] = at.z;
            const a = Math.random() * Math.PI * 2, u = Math.random() * 2 - 1, s = 0.6 + Math.random() * 1.1;
            const rr = Math.sqrt(1 - u * u);
            spVel[i * 3] = Math.cos(a) * rr * s; spVel[i * 3 + 1] = Math.abs(u) * s + 0.5; spVel[i * 3 + 2] = Math.sin(a) * rr * s;
            spMax[i] = spLife[i] = 0.35 + Math.random() * 0.45;
        }
    }
    function updateSparks(dt) {
        for (let i = 0; i < NSP; i++) {
            if (spLife[i] <= 0) continue;
            spLife[i] -= dt;
            spVel[i * 3 + 1] -= 3.2 * dt;
            spPos[i * 3] += spVel[i * 3] * dt; spPos[i * 3 + 1] += spVel[i * 3 + 1] * dt; spPos[i * 3 + 2] += spVel[i * 3 + 2] * dt;
            const f = Math.max(0, spLife[i] / spMax[i]);
            // hot white to the star's amber, then out
            spCol[i * 3] = f; spCol[i * 3 + 1] = f * (0.55 + 0.4 * f); spCol[i * 3 + 2] = f * f * 0.6;
            if (spLife[i] <= 0) { spPos[i * 3 + 1] = -100; spCol[i * 3] = spCol[i * 3 + 1] = spCol[i * 3 + 2] = 0; }
        }
        spGeo.attributes.position.needsUpdate = true;
        spGeo.attributes.color.needsUpdate = true;
    }

    /* ---------------------------------------------------------------- what energy buys */
    const period = (e) => (e <= 0 ? Infinity : 6 * Math.pow(0.04, e / 100) / (later ? 50 : 1));
    const gamesADay = (e) => (e <= 0 ? 0 : Math.round(Math.pow(e, 1.5) * 0.9 * (later ? 50 : 1)));
    const fmt = (n) => n.toLocaleString('en-US').replace(/,/g, ' ');
    const elGames = document.getElementById('games');
    const elStars = document.getElementById('stars');
    const elVal = document.getElementById('energy-val');
    let shownGames = 0, shownStars = 0;
    function setEnergy(v) { energy = v; elVal.textContent = String(v); }
    slider.addEventListener('input', function () { setEnergy(Number(slider.value)); });
    setEnergy(Number(slider.value));
    document.querySelectorAll('.range button').forEach(function (b) {
        b.addEventListener('click', function () {
            later = b.dataset.r === 'later';
            document.body.classList.toggle('later', later);
            document.querySelectorAll('.range button').forEach(function (x) { x.classList.toggle('on', x === b); });
        });
    });

    /* ---------------------------------------------------------------- the games */
    const rnd = mulberry32(20261002);
    let gc = 0;
    let ringThrow = 0;
    function newGame() {
        ringThrow = Math.floor(rnd() * 3);
        mainScreen.glyph = GLYPHS[ringThrow];
    }
    let bursts = 0;
    function land(g, time) {
        const i = ((g % 3) + 3) % 3;
        const d = (i - ringThrow + 3) % 3;              // 1: the arm wins, 2: the screen wins, 0: a draw
        if (d === 1) {
            arms[i].screen.win = 0.35;
            mainScreen.noise = 0.18;
            if (bursts < 3) {
                bursts++;
                arms[i].head.getWorldPosition(tmpV);
                burst(tmpV, later ? 10 : 22);
                glass.getWorldPosition(tmpV);
                burst(tmpV, later ? 8 : 16);
            }
            flashStar(time);
        }
    }

    /* ---------------------------------------------------------------- hover */
    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoverXY = null;
    renderer.domElement.addEventListener('pointermove', function (e) {
        hoverXY = [e.clientX, e.clientY];
        mouse.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1);
    });
    renderer.domElement.addEventListener('pointerleave', function () { hoverXY = null; });
    function updateTip() {
        if (!hoverXY) { tip.classList.remove('on'); return; }
        ray.setFromCamera(mouse, camera);
        const hit = ray.intersectObjects(machineParts, false)[0];
        if (hit) {
            tip.textContent = 'The machine plays. ' + energy + ' energy a day. Each win is a star.';
            tip.style.left = (hoverXY[0] + 16) + 'px';
            tip.style.top = (hoverXY[1] + 14) + 'px';
            tip.classList.add('on');
        } else tip.classList.remove('on');
    }

    const clock = new THREE.Clock();
    let time = 0, screenClock = 0;
    newGame();
    function frame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        time += dt;
        bursts = 0;

        const T = period(energy);
        let rate = isFinite(T) ? 1 / T : 0;
        if (!rate && gc > Math.floor(gc)) rate = 1 / 4;
        const before = gc;
        gc += rate * dt;
        if (!isFinite(T) && Math.floor(gc) > Math.floor(before)) gc = Math.floor(gc);
        // every game that started or landed in this frame, the last few of them only
        const gFrom = Math.max(Math.floor(before), Math.floor(gc) - 6);
        for (let g = gFrom; g <= Math.floor(gc); g++) {
            if (g > Math.floor(before)) newGame();
            if (g + 0.48 > before && g + 0.48 <= gc) land(g, time);
        }

        const blur = Math.max(0, Math.min(1, (1.0 - T) / 0.7));
        for (let i = 0; i < 3; i++) {
            apply(arms[i], pose(i, gc, time));
            ghosts[i].forEach(function (gh, k) {
                const lag = (k + 1) * 0.055;
                apply(gh, pose(i, gc - lag, time - lag * (isFinite(T) ? T : 1)));
                const o = blur * [0.34, 0.2, 0.1][k];
                gh.mats[0].opacity = o; gh.mats[1].opacity = o;
                gh.base.visible = o > 0.01;
            });
        }

        fly.rotation.y -= (energy <= 0 ? 0.08 : 0.9 + energy * 0.22) * (later ? 3 : 1) * dt;
        crt.rotation.y = Math.atan2(camera.position.x, camera.position.z);

        // the screens: redrawn thirty times a second, flickering always, a little more when fed
        screenClock += dt;
        screens.forEach(function (sc) {
            sc.win = Math.max(0, sc.win - dt);
            sc.noise = Math.max(0, sc.noise - dt);
            const dip = Math.random() < 0.02 ? 0.55 : 1;
            sc.mat.color.setScalar((0.84 + Math.random() * 0.16) * dip);
        });
        if (screenClock > 1 / 30) {
            screenClock = 0;
            screens.forEach(function (sc) { drawScreen(sc, time); });
        }

        updateThreads(dt);
        updateSparks(dt);

        const tg = gamesADay(energy), ts = Math.round(tg / 3);
        shownGames += (tg - shownGames) * Math.min(1, dt * 4);
        shownStars += (ts - shownStars) * Math.min(1, dt * 4);
        elGames.textContent = fmt(Math.round(shownGames));
        elStars.textContent = fmt(Math.round(shownStars));

        controls.update();
        updateTip();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        requestAnimationFrame(frame);
    }
    frame();
    lucide.createIcons();

    window.addEventListener('resize', function () {
        W = window.innerWidth; H = window.innerHeight;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        renderer.setSize(W, H);
        labelRenderer.setSize(W, H);
    });
}
</script>
</body>
</html>
